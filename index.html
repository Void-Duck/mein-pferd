<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mein Pferd">
<meta name="theme-color" content="#7CC7F2">
<title>Mein Pferd</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --pink: #FF6FA5; --pink-d: #E04F88; --violet: #8B6CFF; --mint: #3CCB9A; --sun: #FFC93C;
  --ink: #3A2D4A; --ink2: #6E5F80; --card: rgba(255, 255, 255, .86); --line: rgba(58, 45, 74, .1);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0; background: #7CC7F2; }
body { font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input { font-family: inherit; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; overflow: hidden; }

/* ---------- Szene ---------- */
#sceneBg { position: absolute; inset: 0; z-index: 0; }
#sceneBg svg, .scene-svg { width: 100%; height: 100%; display: block; }
.cloud { animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(18px); } }
.snow { animation: snow 9s linear infinite; }
@keyframes snow { to { transform: translateY(620px); } }
.firefly { animation: fly 3.2s ease-in-out infinite alternate; }
@keyframes fly { 0% { opacity: .1; transform: translate(0, 0); } 100% { opacity: 1; transform: translate(10px, -14px); } }
.twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
.floaty { animation: floaty 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes floaty { 0% { opacity: 0; transform: translateY(16px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) scale(1); } }

/* ---------- Pferd-Animationen ---------- */
.horse-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.breathe { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scale(1.008, 1.018); } }
.tail { animation: tail 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 90% 4%; }
@keyframes tail { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-3deg); } }
.ear { transform-box: fill-box; transform-origin: 50% 100%; }
.twitch .ear { animation: twitch .5s ease-in-out; }
@keyframes twitch { 30% { transform: rotate(-18deg); } 60% { transform: rotate(8deg); } }
.eye { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .08s; }
.blink .eye { transform: scaleY(.08); }
.headgrp { transform-box: fill-box; transform-origin: 12% 96%; transition: transform .35s; }
.eating .headgrp { animation: eat .5s ease-in-out 4 alternate; }
@keyframes eat { 0% { transform: rotate(14deg); } 100% { transform: rotate(20deg); } }
.nope .headgrp { animation: nope .9s ease-in-out; }
@keyframes nope { 20% { transform: rotate(-6deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.hop { animation: hop .7s cubic-bezier(.3, .7, .4, 1); }
@keyframes hop { 30% { transform: translateY(-9%) rotate(-3deg); } 60% { transform: translateY(0) rotate(1deg); } 75% { transform: translateY(-3%); } }
.shiver { animation: shiver .35s linear 3; }
@keyframes shiver { 25% { transform: translateX(-1.5%); } 75% { transform: translateX(1.5%); } }

/* ---------- Hauptbildschirm ---------- */
#main { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1; }
.top { padding: calc(var(--sat) + 8px) 12px 6px; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 5; }
.topbar { display: flex; align-items: center; gap: 8px; }
.namepill { flex: 1; min-width: 0; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; padding: 7px 12px; font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
.namepill small { font-weight: 600; color: var(--ink2); font-size: 13px; margin-left: 4px; }
.coins { background: linear-gradient(180deg, #FFE27A, #FFC23C); border-radius: 18px; padding: 7px 12px; font-weight: 900; font-size: 18px; box-shadow: 0 2px 0 #E0A21F, 0 3px 10px rgba(0, 0, 0, .1); display: flex; align-items: center; gap: 5px; color: #6B4A00; }
.coins.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.iconbtn { width: 40px; height: 40px; border-radius: 14px; background: var(--card); font-size: 20px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); flex: none; }
.bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
.bar { background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 14px; padding: 5px 7px 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .07); }
.bar .lbl { display: flex; justify-content: space-between; gap: 2px; white-space: nowrap; font-size: 13px; font-weight: 800; color: var(--ink2); margin-bottom: 3px; }
.bar .track { height: 11px; background: rgba(58, 45, 74, .1); border-radius: 8px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 8px; transition: width .5s, background-color .5s; position: relative; }
.bar .fill::after { content: ""; position: absolute; left: 4px; right: 4px; top: 2px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.bar.low { animation: lowpulse 1.2s ease-in-out infinite; }
@keyframes lowpulse { 50% { box-shadow: 0 0 0 3px rgba(255, 80, 100, .35); } }

#track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; width: 300%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
#track.dragging { transition: none; }
.panel { width: 33.3334%; height: 100%; position: relative; overflow: hidden; }

/* Pferd in der Mitte */
.stage { position: absolute; left: 0; right: 0; bottom: 0; top: 0; }
.horsebox { position: absolute; left: 50%; transform: translateX(-50%); touch-action: none; }
.horsebox > .hwrap { width: 100%; height: 100%; }
.bubble { position: absolute; background: #fff; border-radius: 18px; padding: 8px 13px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 14px rgba(0, 0, 0, .15); max-width: 70%; transform: translate(-50%, -100%) scale(.6); opacity: 0; transition: .25s; pointer-events: none; z-index: 4; text-align: center; }
.bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }
.tools { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; gap: 6px; justify-content: center; z-index: 3; }
.tool { flex: 1; max-width: 76px; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 16px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; font-weight: 800; color: var(--ink2); box-shadow: 0 2px 8px rgba(0, 0, 0, .08); border: 2.5px solid transparent; transition: transform .15s; }
.tool .ic { font-size: 24px; line-height: 28px; height: 28px; display: grid; place-items: center; }
.tool.on { border-color: var(--pink); color: var(--pink-d); transform: translateY(-3px); }
.tool .price { font-size: 10px; color: #A07800; }
.sidebtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.sidebtn { width: 52px; height: 52px; border-radius: 18px; background: var(--card); box-shadow: 0 2px 8px rgba(0, 0, 0, .1); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
.sidebtn span { font-size: 10px; font-weight: 800; color: var(--ink2); margin-top: 3px; }
.fx { position: absolute; pointer-events: none; z-index: 6; font-size: 26px; will-change: transform, opacity; }
.fx.heart { animation: heartup 1.1s ease-out forwards; }
@keyframes heartup { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -170%) scale(1.15); opacity: 0; } }
.fx.bubbleFx { width: var(--s, 18px); height: var(--s, 18px); border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0 18%, rgba(255, 255, 255, .35) 30%, var(--bc, rgba(170, 220, 255, .55)) 70%, rgba(255, 255, 255, .9) 100%); border: 1px solid rgba(255, 255, 255, .9); animation: bubbleup 1.2s ease-out forwards; }
@keyframes bubbleup { 0% { transform: translate(-50%, -50%) scale(.3); opacity: .2; } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -260%) scale(1.1); opacity: 0; } }
.fx.spark { animation: spark .8s ease-out forwards; color: #FFD43B; font-size: 20px; }
@keyframes spark { 0% { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -30px))) scale(1.2) rotate(90deg); opacity: 0; } }
.fx.food { transition: transform .55s cubic-bezier(.4, -0.1, .6, 1), opacity .2s .5s; font-size: 40px; transform: translate(-50%, -50%); }
.fx.coinfly { transition: transform .7s cubic-bezier(.5, 0, .7, 1), opacity .2s .6s; font-size: 26px; transform: translate(-50%, -50%); }
.fx.plus { animation: plusup 1.1s ease-out forwards; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 0 8px rgba(0, 0, 0, .2); white-space: nowrap; }
@keyframes plusup { 0% { transform: translate(-50%, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-50%, -60px); opacity: 0; } }
.foam { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.fly { position: absolute; font-size: 18px; pointer-events: none; animation: buzz 2.4s ease-in-out infinite; z-index: 3; }
@keyframes buzz { 0% { transform: translate(0, 0); } 25% { transform: translate(30px, -16px); } 50% { transform: translate(8px, -36px); } 75% { transform: translate(-22px, -12px); } 100% { transform: translate(0, 0); } }

/* Seiten-Panels */
.sheetcard { position: absolute; left: 10px; right: 10px; bottom: 8px; top: 8px; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); overflow: hidden; display: flex; flex-direction: column; }
.sheetcard h2 { margin: 14px 16px 2px; font-size: 22px; font-weight: 900; }
.sheetcard .sub { margin: 0 16px 10px; color: var(--ink2); font-size: 14px; font-weight: 600; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; padding: 4px 12px 14px; touch-action: pan-y; }
.gamecard { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 0 var(--line), 0 3px 10px rgba(0, 0, 0, .05); width: 100%; text-align: left; }
.gamecard .gi { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; flex: none; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.gamecard .gt { flex: 1; min-width: 0; }
.gamecard b { font-size: 17px; display: block; }
.gamecard .gd { font-size: 13px; color: var(--ink2); font-weight: 600; line-height: 1.25; }
.gamecard .gb { font-size: 12px; color: #A07800; font-weight: 800; margin-top: 3px; }
.gamecard .play { background: var(--pink); color: #fff; font-weight: 900; border-radius: 14px; padding: 9px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--pink-d); flex: none; }
.bonus { background: linear-gradient(135deg, #FFF1B8, #FFD6EA); border-radius: 20px; padding: 12px 14px; margin-bottom: 10px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.bonus .big { font-size: 30px; }

.foodgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.food { background: #fff; border-radius: 18px; padding: 8px 4px 7px; text-align: center; box-shadow: 0 2px 0 var(--line), 0 3px 10px rgba(0, 0, 0, .05); position: relative; }
.food .fi { font-size: 34px; line-height: 40px; }
.food .fn { font-weight: 800; font-size: 13px; }
.food .fs { font-size: 11px; color: var(--ink2); font-weight: 700; }
.food .fp { font-size: 12px; font-weight: 900; color: #A07800; margin-top: 2px; }
.food .fp.free { color: var(--mint); }
.food:active, .gamecard:active, .tool:active, .item:active { transform: scale(.95); }
.food.poor { opacity: .5; }

/* Navigation unten */
.tabs { display: flex; gap: 6px; padding: 6px 12px calc(var(--sab) + 8px); position: relative; z-index: 5; }
.tab { flex: 1; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; padding: 7px 0 6px; font-weight: 800; font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
.tab .ic { font-size: 22px; line-height: 26px; }
.tab.on { background: #fff; color: var(--pink-d); box-shadow: 0 0 0 2.5px var(--pink), 0 4px 12px rgba(0, 0, 0, .12); }
.dots { display: flex; gap: 6px; justify-content: center; position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 76px); z-index: 4; pointer-events: none; }

/* ---------- Bottom-Sheet (Shop) ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: #FFF8FC; border-radius: 26px 26px 0 0; z-index: 20; box-shadow: 0 -8px 30px rgba(0, 0, 0, .18); display: flex; flex-direction: column; transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--sab); }
.sheet:not(.open) { visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s .32s; }
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .15); margin: 8px auto 4px; }
.sheethead { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px; }
.sheethead h3 { margin: 0; font-size: 20px; flex: 1; font-weight: 900; }
.seg { display: flex; gap: 6px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; box-shadow: 0 1px 0 var(--line); color: var(--ink2); }
.seg button.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-d); }
.itemgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item { background: #fff; border-radius: 18px; padding: 8px 4px; text-align: center; box-shadow: 0 2px 0 var(--line); border: 2.5px solid transparent; position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.item.on { border-color: var(--mint); }
.item .pv { width: 100%; height: 54px; display: grid; place-items: center; font-size: 30px; overflow: hidden; border-radius: 12px; }
.item .pv svg { height: 100%; width: auto; }
.item .nm { font-size: 12px; font-weight: 800; line-height: 1.15; }
.item .pr { font-size: 12px; font-weight: 900; color: #A07800; }
.item .pr.own { color: var(--mint); }
.item .check { position: absolute; top: 4px; right: 6px; font-size: 14px; }
.sectionlbl { font-size: 13px; font-weight: 900; color: var(--ink2); margin: 10px 2px 6px; text-transform: uppercase; letter-spacing: .04em; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }

/* ---------- Erstellen ---------- */
#creator { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #FFF8FC; }
.cprev { position: relative; height: 40%; min-height: 220px; overflow: hidden; flex: none; }
.cprev .horsebox { bottom: 10%; }
.chead { position: absolute; top: calc(var(--sat) + 10px); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 2; }
.chead .ttl { flex: 1; background: var(--card); border-radius: 16px; padding: 8px 12px; font-weight: 900; font-size: 17px; }
.cbody { flex: 1; display: flex; flex-direction: column; min-height: 0; border-radius: 26px 26px 0 0; margin-top: -22px; background: #FFF8FC; position: relative; z-index: 3; box-shadow: 0 -6px 20px rgba(0, 0, 0, .08); }
.steps { display: flex; gap: 5px; justify-content: center; padding: 12px 0 4px; }
.steps i { width: 26px; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, .1); }
.steps i.on { background: var(--pink); }
.cbody h2 { margin: 6px 16px 2px; font-size: 22px; font-weight: 900; }
.cbody .sub { margin: 0 16px 8px; color: var(--ink2); font-size: 14px; font-weight: 600; }
.cfoot { display: flex; gap: 8px; padding: 8px 12px calc(var(--sab) + 12px); }
.btn { flex: 1; border-radius: 18px; padding: 14px; font-weight: 900; font-size: 17px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.btn.pri { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-d); }
.btn.pri:disabled { opacity: .5; }
.opt { background: #fff; border-radius: 18px; padding: 6px 4px 8px; text-align: center; border: 2.5px solid transparent; box-shadow: 0 2px 0 var(--line); font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.opt.on { border-color: var(--pink); background: #FFF0F6; }
.opt .pv { width: 100%; height: 86px; }
.opt .pv svg { width: 100%; height: 100%; }
.opt small { font-weight: 600; color: var(--ink2); font-size: 11px; line-height: 1.2; }
.optgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; border: 2.5px solid transparent; box-shadow: 0 2px 0 var(--line); display: flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--pink); background: #FFF0F6; }
.chip .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.chip .lock { font-size: 11px; color: #A07800; }
.nameinput { display: flex; gap: 8px; margin: 4px 0 10px; }
.nameinput input { flex: 1; font-size: 22px; font-weight: 800; padding: 12px 14px; border-radius: 16px; border: 2.5px solid var(--pink); outline: none; background: #fff; color: var(--ink); min-width: 0; -webkit-user-select: text; user-select: text; }

/* ---------- Minispiel ---------- */
#game { position: absolute; inset: 0; z-index: 40; background: #9AD8FF; display: flex; flex-direction: column; }
.ghud { display: flex; gap: 8px; align-items: center; padding: calc(var(--sat) + 8px) 12px 8px; position: relative; z-index: 2; }
.ghud .gtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.pill { background: rgba(255, 255, 255, .9); border-radius: 14px; padding: 6px 11px; font-weight: 900; font-size: 16px; white-space: nowrap; }
#garea { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#garea canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 20, 60, .35); z-index: 5; padding: 20px; }
.gbox { background: #fff; border-radius: 26px; padding: 22px 20px 18px; text-align: center; width: min(340px, 100%); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); animation: pop .35s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.gbox h2 { margin: 4px 0 6px; font-size: 26px; font-weight: 900; }
.gbox p { margin: 4px 0; font-weight: 700; color: var(--ink2); }
.gbox .won { font-size: 30px; font-weight: 900; color: #A07800; margin: 10px 0; }
.gbox .row { display: flex; gap: 8px; margin-top: 14px; }
.gbox .emoji { font-size: 54px; }
.memgrid { position: absolute; inset: 10px; display: grid; gap: 8px; align-content: center; justify-content: center; }
.mcard { perspective: 600px; }
.mcard .in { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .35s; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .fa, .mcard .ba { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 3px 0 rgba(0, 0, 0, .12); }
.mcard .ba { background: linear-gradient(135deg, #B07CFF, #FF7DB8); font-size: 26px; color: #fff; }
.mcard .fa { background: #fff; transform: rotateY(180deg); font-size: 34px; }
.mcard.done .fa { background: #E7FFF3; }
.holes { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 20px 14px 30px; align-content: center; }
.hole { position: relative; aspect-ratio: 1/1; overflow: hidden; border-radius: 50% 50% 18px 18px; }

.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 800; text-align: left; }

#lamp { background: radial-gradient(ellipse at 50% 8%, rgba(255, 214, 120, .55), rgba(255, 214, 120, 0) 55%); mix-blend-mode: screen; }
body[data-phase=dawn] #tint { opacity: .4; background: linear-gradient(#FFB0A0, #FFDCC0 60%, #FFF0E0); }
body[data-phase=dusk] #tint { opacity: .5; background: linear-gradient(#FF8A5C, #FFC28A 55%, #FFE2C4); }
body[data-phase=evening] #tint { opacity: .72; background: linear-gradient(#4A3F8F, #8A6FB8 55%, #B89AC8); }
body[data-phase=night] #tint { opacity: .86; background: linear-gradient(#121A48, #26336E 55%, #34477E); }
body[data-phase=evening] #nightsky { opacity: .45; }
body[data-phase=night] #nightsky { opacity: 1; }

body[data-phase=night] .sun, body[data-phase=evening] .sun { opacity: 0; }
.horsebox { transition: filter 2s; }
body[data-phase=night] .horsebox { filter: brightness(.8) saturate(.85); }
body[data-phase=evening] .horsebox { filter: brightness(.9) saturate(.95); }
body[data-phase=dusk] .horsebox { filter: sepia(.12) saturate(1.1); }

.zzz { animation: zzz 2.7s ease-in-out infinite; opacity: 0; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 8px) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -22px) scale(1.15); } }

// ===== Das Pferd als SVG zeichnen =====
// horseSVG(horse, opts) liefert einen SVG-String.
// horse: { breed, coat, mane, maneStyle, face, legs, eye, equip: {slot: itemId} }
// opts:  { mood: 'happy'|'ok'|'sad', clean: 0..100, pose: 'stand'|'run1'|'run2'|'jump', eyes: 'open'|'closed', anim: true }

let _hid = 0;

function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
// amt > 0 heller, amt < 0 dunkler
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function lum(hex) { const [r, g, b] = hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

// kleiner deterministischer Zufall (gleiche Flecken bei jedem Zeichnen)
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

function f(n) { return Math.round(n * 10) / 10; }

function starPath(x, y, r, r2) {
  r2 = r2 || r * 0.45;
  let d = '';
  for (let i = 0; i < 10; i++) {

// ===== Ton: Geräusche und Musik (alles selbst erzeugt, keine Dateien nötig) =====
// Snd   – Geräusche (Snd.play('crunch') …) und Grundbausteine
// Music – fröhliche Musik mit Abwandlungen pro Spiel und Schlaflied

const Snd = {
  ctx: null, master: null, sfx: null, mus: null, noiseBuf: null,
  unlock() {
    if (!this.ctx) {
      // iPhone: auch bei Stummschalter abspielen (Safari 17+, sonst ohne Wirkung)
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { }
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
      const c = this.ctx;
      const comp = c.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      this.master = c.createGain(); this.sfx = c.createGain(); this.mus = c.createGain();
      this.sfx.connect(this.master); this.mus.connect(this.master); this.master.connect(comp); comp.connect(c.destination);
      this.master.gain.value = 1.15;
      const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noiseBuf = buf;
      this.applyVolumes();
      Music.boot();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  applyVolumes() {
    if (!this.ctx || !S) return;
    const t = this.ctx.currentTime;
    this.sfx.gain.setTargetAtTime(S.sound !== false ? (S.sfxVol ?? 0.9) * 1.7 : 0, t, 0.05);
    this.mus.gain.setTargetAtTime(S.musicOn !== false ? (S.musicVol ?? 0.6) * 0.55 : 0, t, 0.1);
  },
  ok() { return this.ctx && S && S.sound !== false; },
  // Einzelton (für Geräusche)
  tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0, dest) {
    const c = this.ctx; if (!c) return;
    if (!dest && !this.ok()) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest || this.sfx); o.start(t); o.stop(t + dur + 0.03);
  },
  // Rauschen durch einen Filter (für Kratzen, Plätschern, Knacken …)
  noise(dur, vol = 0.12, f1 = 1200, f2 = 0, type = 'bandpass', delay = 0, q = 1, dest, absT) {
    const c = this.ctx; if (!c) return;
    if (!dest && !this.ok()) return;
    const t = absT != null ? absT : c.currentTime + delay;
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const flt = c.createBiquadFilter(); flt.type = type; flt.Q.value = q; flt.frequency.setValueAtTime(f1, t); if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt).connect(g).connect(dest || this.sfx); src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.02);
  },
  // Weiches, tiefes Brummeln (Pferde-„Nickern“): tiefer Ton, schnell pulsierend, mit Atem
  nicker(len = 0.7, pitch = 1) {
    const c = this.ctx; if (!c || !this.ok()) return;
    const t = c.currentTime, f0 = (105 + Math.random() * 25) * pitch;
    const o = c.createOscillator(); o.type = 'sawtooth';
    o.frequency.setValueAtTime(f0 * 1.08, t); o.frequency.linearRampToValueAtTime(f0, t + len * 0.3); o.frequency.linearRampToValueAtTime(f0 * 0.86, t + len);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(700, t); lp.frequency.linearRampToValueAtTime(380, t + len); lp.Q.value = 2;
    const am = c.createGain(); am.gain.value = 0.5;
    const lfo = c.createOscillator(); lfo.type = 'sine'; lfo.frequency.setValueAtTime(15 + Math.random() * 4, t); lfo.frequency.linearRampToValueAtTime(10, t + len);
    const lfoG = c.createGain(); lfoG.gain.value = 0.5; lfo.connect(lfoG).connect(am.gain);
    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t + 0.06); g.gain.setValueAtTime(0.2, t + len * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(lp).connect(am).connect(g).connect(this.sfx);
    o.start(t); lfo.start(t); o.stop(t + len + 0.05); lfo.stop(t + len + 0.05);
    // Atem durch die Nüstern
    this.noise(len * 0.9, 0.06, 900, 400, 'lowpass', 0.02, 0.7);
  },
  play(name) {
    if (!this.ok()) return;
    const r = Math.random;
    switch (name) {
      case 'coin': this.tone(988, 0.08, 'square', 0.1); this.tone(1319, 0.22, 'square', 0.1, 0, 0.07); break;
      case 'pop': this.tone(520, 0.1, 'sine', 0.28, 500); break;
      case 'nicker': this.nicker(0.55 + r() * 0.35); break;
      case 'grunt': this.nicker(0.28, 0.9); break;
      case 'fur': this.noise(0.22, 0.07, 2600, 1600, 'bandpass', 0, 0.8); this.noise(0.18, 0.05, 3400, 2200, 'bandpass', 0.12, 0.8); break;
      case 'breath': this.noise(0.6, 0.12, 600, 250, 'lowpass', 0, 0.7); break;
      case 'click': this.tone(700, 0.05, 'triangle', 0.12); break;
      case 'flip': this.tone(880, 0.06, 'sine', 0.14, 200); break;
      case 'nope': this.tone(330, 0.12, 'triangle', 0.18); this.tone(260, 0.2, 'triangle', 0.18, 0, 0.13); break;
      case 'hurt': this.tone(220, 0.25, 'square', 0.13, -130); this.noise(0.15, 0.15, 400, 0, 'lowpass'); break;
      case 'win': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.25, 'triangle', 0.2, 0, i * 0.1)); break;
      case 'sparkle': [1568, 2093, 2637, 3136, 3951].forEach((f, i) => this.tone(f, 0.15, 'sine', 0.09, 0, i * 0.05)); break;
      // Pflege
      case 'brush': this.noise(0.16, 0.22 + r() * 0.06, 3400 + r() * 800, 1800, 'bandpass', 0, 2.5); this.noise(0.1, 0.1, 6000, 0, 'highpass', 0.05); break;
      case 'brushSoft': this.noise(0.2, 0.18, 2200 + r() * 400, 1400, 'bandpass', 0, 1.5); break;
      case 'brushGold': this.noise(0.16, 0.2, 3600, 2000, 'bandpass', 0, 2.5); this.tone(2093 + r() * 600, 0.15, 'sine', 0.07, 0, 0.03); break;
      case 'splash': this.noise(0.4, 0.26, 2500, 500, 'bandpass', 0, 0.8); this.noise(0.25, 0.12, 900, 0, 'lowpass', 0.08); break;
      case 'bubble': for (let i = 0; i < 2; i++) { const f = 500 + r() * 700; this.tone(f, 0.08, 'sine', 0.12, f * 0.9, i * 0.06 + r() * 0.04); } break;
      // Futter
      case 'crunch': for (let i = 0; i < 4; i++) { this.noise(0.06, 0.34, 2600 + r() * 1500, 0, 'highpass', i * 0.17 + r() * 0.03); this.noise(0.08, 0.2, 500, 0, 'lowpass', i * 0.17); } break;
      case 'munch': for (let i = 0; i < 4; i++) this.noise(0.18, 0.2, 1200 + r() * 600, 600, 'bandpass', i * 0.22, 1.2); break;
      case 'nom': [0, 0.18, 0.36].forEach((d, i) => { this.tone(300 + i * 60, 0.09, 'sine', 0.2, -80, d); this.noise(0.05, 0.12, 1500, 0, 'bandpass', d); }); break;
      case 'slurp':
        this.noise(0.45, 0.16, 800, 2400, 'bandpass', 0, 3);
        for (let i = 0; i < 4; i++) { this.tone(240, 0.13, 'sine', 0.26, -110, 0.45 + i * 0.24); this.tone(600 + r() * 300, 0.05, 'sine', 0.07, 200, 0.5 + i * 0.24); }
        break;
      case 'eat': this.play('munch'); break;
      // Pferd
      case 'snort': this.noise(0.35, 0.28, 700, 300, 'bandpass', 0, 1.2); this.noise(0.2, 0.15, 1800, 0, 'bandpass', 0.05, 2); break;
      case 'snore': {
        const c = this.ctx, t = c.currentTime;
        // einatmen: rauhes Brummen
        const o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(70, t); o.frequency.linearRampToValueAtTime(85, t + 1.0);
        f.type = 'lowpass'; f.frequency.value = 320;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.11, t + 0.7); g.gain.linearRampToValueAtTime(0.0001, t + 1.1);
        o.connect(f).connect(g).connect(this.sfx); o.start(t); o.stop(t + 1.15);
        this.noise(1.0, 0.06, 400, 0, 'lowpass', 0.05);
        // ausatmen: leises Pusten
        this.noise(1.1, 0.07, 1400, 700, 'bandpass', 1.3, 1);
        this.tone(520, 0.8, 'sine', 0.025, -150, 1.4);
        break;
      }
      case 'yawn': {
        const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain(), f = c.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(320, t); o.frequency.linearRampToValueAtTime(460, t + 0.35); o.frequency.exponentialRampToValueAtTime(180, t + 1.0);
        f.type = 'lowpass'; f.frequency.setValueAtTime(600, t); f.frequency.linearRampToValueAtTime(1500, t + 0.4); f.frequency.linearRampToValueAtTime(500, t + 1.0);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.2); g.gain.linearRampToValueAtTime(0.0001, t + 1.05);
        o.connect(f).connect(g).connect(this.sfx); o.start(t); o.stop(t + 1.1);
        break;
      }
      case 'neigh': {
        const c = this.ctx, t = c.currentTime;
        [1, 1.5].forEach((m, k) => {
          const o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain(), flt = c.createBiquadFilter();
          o.type = 'sawtooth'; o.frequency.setValueAtTime(560 * m, t); o.frequency.linearRampToValueAtTime(980 * m, t + 0.18); o.frequency.exponentialRampToValueAtTime(360 * m, t + 1.05);
          lfo.frequency.setValueAtTime(14, t); lfo.frequency.linearRampToValueAtTime(22, t + 1); lg.gain.value = 60 * m; lfo.connect(lg).connect(o.frequency);
          flt.type = 'bandpass'; flt.frequency.value = 1500 * m; flt.Q.value = 1.2;
          const v = k ? 0.06 : 0.16;
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.06); g.gain.setValueAtTime(v, t + 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
          o.connect(flt).connect(g).connect(this.sfx); o.start(t); lfo.start(t); o.stop(t + 1.15); lfo.stop(t + 1.15);
        });
        this.noise(0.3, 0.1, 900, 400, 'bandpass', 1.0);
        break;
      }
      // Bewegung
      case 'clop': { const f = 820 + r() * 160; this.tone(f, 0.045, 'sine', 0.22, -300); this.noise(0.035, 0.16, 2200, 0, 'bandpass', 0, 3); this.tone(180, 0.06, 'sine', 0.12, -60); break; }
      case 'jump': this.noise(0.38, 0.22, 500, 2600, 'bandpass', 0, 1.5); this.tone(300, 0.25, 'sine', 0.16, 420); break;
      case 'land': this.tone(110, 0.14, 'sine', 0.35, -50); this.noise(0.1, 0.18, 300, 0, 'lowpass'); setTimeout(() => this.play('clop'), 70); break;
      case 'knock': this.tone(520, 0.08, 'triangle', 0.25, -200); this.tone(390, 0.1, 'triangle', 0.2, -150, 0.09); this.noise(0.08, 0.15, 1800, 0, 'bandpass', 0, 2); break;
      case 'scrape': this.noise(0.22, 0.2, 1800, 900, 'bandpass', 0, 2); break;
      case 'plop': this.tone(180, 0.12, 'sine', 0.3, -80); this.noise(0.08, 0.15, 600, 0, 'lowpass'); break;
      case 'swish': this.noise(0.22, 0.16, 900, 3000, 'bandpass', 0, 1.2); break;
    }
  },
};
document.addEventListener('pointerdown', () => Snd.unlock(), { capture: true });
document.addEventListener('visibilitychange', () => { if (!Snd.ctx) return; if (document.hidden) Snd.ctx.suspend(); else Snd.ctx.resume(); });

// ---------- Musik ----------
const Music = (() => {

// ---------- Cloud-Sicherung (nur wenn als Claude-Artefakt geöffnet, sonst ohne Wirkung) ----------
// Browser löschen den Speicher eingebetteter Seiten oft beim Schließen des Tabs.
// Darum wird der Spielstand dort zusätzlich im eigenen Claude-Konto gesichert (privat).
const Cloud = {
  doc: null, db: null, ok: false, t: 0, busy: false, again: false, lastJson: '', connecting: null,
  available() { return !!(window.claude && window.claude.use); },
  // Verbinden und gespeicherten Stand holen. Liefert den Stand oder null.
  connect() { if (!this.connecting) this.connecting = this._connect(); return this.connecting; },
  async _connect() {
    if (!this.available()) return null;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      this.db = db;
      this.doc = db.collection('data/users/' + id).doc('spielstand');
      const snap = await this.doc.get();
      this.ok = true;
      const d = snap && snap.exists ? snap.data() : null;
      if (d && typeof d.json === 'string') { this.lastJson = d.json; const st = JSON.parse(d.json); if (st && st.v) return st; }
    } catch (e) { this.doc = null; this.ok = false; }
    return null;
  },
  push(now) {
    if (!this.doc || !S || !S.horse) return;
    clearTimeout(this.t);
    if (now) this.write(); else this.t = setTimeout(() => this.write(), 1200);
  },
  async write() {
    if (!this.doc) return;
    if (this.busy) { this.again = true; return; }
    const json = JSON.stringify(S);
    if (json === this.lastJson) return;
    this.busy = true;
    try {
      await this.doc.set({ json, last: S.last || Date.now() });
      this.lastJson = json;
      const key = nameKey(S.horse.name);
      if (this.db && key) await this.db.doc('pferde/' + key).set({ json, last: S.last || Date.now(), name: S.horse.name });
    }
    catch (e) { if (e && (e.code === 'revoked' || e.code === 'invalid_argument' || e.code === 'not_granted')) this.doc = null; }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  },
};
// Schlüssel aus dem Pferdenamen: „Sternchen“ → sternchen, „Müsli Maus“ → muesli-maus
function nameKey(n) {
  const k = String(n || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  return k || null;
}
// Pferd nach Namen in der Cloud suchen
async function findByName(name) {
  const key = nameKey(name);
  if (!key || !Cloud.available()) return null;
  await Promise.race([Cloud.connect(), new Promise(r => setTimeout(r, 8000))]);
  if (!Cloud.db) return null;
  try {
    const snap = await Cloud.db.doc('pferde/' + key).get();
    const d = snap && snap.exists ? snap.data() : null;
    if (d && typeof d.json === 'string') { const st = JSON.parse(d.json); if (st && st.horse) return st; }
  } catch (e) { }
  return null;
}
// Wo läuft das Spiel gerade?
function runMode() {
  if (nativeApp()) return 'ios';
  if (Cloud.available()) return 'claude';
  if (location.protocol === 'file:') return 'android';
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) return 'homescreen';
  return 'browser';
}
const RUN_NAMES = { ios: 'iPhone-App', android: 'Android-App', claude: 'Claude-Link', homescreen: 'Home-Bildschirm-App', browser: 'Browser-Tab' };
// Liest den Stand aus der Cloud, mit Zeitlimit; übernimmt ihn, wenn er neuer ist
async function syncFromCloud(maxMs) {
  if (!Cloud.available()) return false;
  const remote = await Promise.race([Cloud.connect(), new Promise(r => setTimeout(() => r('timeout'), maxMs))]);
  if (!remote || remote === 'timeout' || !remote.horse) return false;
  if (S.horse && (remote.last || 0) <= (S.last || 0)) return false;
  S = Object.assign(defaultState(), remote);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  return true;
}
// Balken sinken mit der Zeit (sanft: nie unter FLOOR)
// Im Schlaf sinken die anderen Balken nur halb so schnell, Energie steigt doppelt so schnell.
function applyDecay() {
  const now = Date.now();
  let t = S.last || now;
  S.last = now;
  if (!S.horse || now <= t) return;
  t = Math.max(t, now - 7 * 864e5);
  while (t < now) {
    const step = Math.min(600000, now - t), hrs = step / 3600000, mid = new Date(t + step / 2);
    const bed = isBedtime(mid);
    const asleep = bed ? mid.getTime() >= (S.awakeUntil || 0) : !!S.napping;
    for (const k of ['hunger', 'fun', 'clean']) {
      const v = S.stats[k];
      if (v > FLOOR) S.stats[k] = Math.max(FLOOR, v - DECAY[k] * hrs * (asleep ? 0.5 : 1));
    }
    S.stats.energy = Math.min(100, (S.stats.energy || 0) + (asleep ? ENERGY_SLEEP : ENERGY_AWAKE) * hrs);
    if (bed && S.napping) { S.napping = false; if (S.napReturn) { S.scene = S.napReturn; S.napReturn = null; } }
    t += step;
  }
}

function realPhase() {
  const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
  if (h >= 21 || h < 5.5) return 'night';
  if (h < 7.5) return 'dawn';
  if (h >= 19.75) return 'evening';
  if (h >= 18) return 'dusk';
  return 'day';
}
function phase() { return S.dayNight ? realPhase() : 'day'; }
function applyPhase() {
  const sc = byId(SCENES, displayScene());
  document.body.dataset.phase = sc.alwaysNight ? 'day' : phase();
  document.body.classList.toggle('indoor', !!sc.indoor);
  refreshHorses();
}
function nightSkySVG() {
  const r = rng(99);
  let s = '<svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMax slice" style="width:100%;height:100%">';
  for (let i = 0; i < 70; i++) s += `<circle class="${i % 3 ? '' : 'twinkle'}" style="animation-delay:${(r() * 3).toFixed(1)}s" cx="${Math.round(r() * 400)}" cy="${Math.round(r() * 300)}" r="${(0.7 + r() * 1.5).toFixed(1)}" fill="#FFFFFF"/>`;
  s += '<defs><mask id="moonM"><circle r="28" fill="#fff"/><circle cx="13" cy="-9" r="25" fill="#000"/></mask></defs><g transform="translate(80 95)"><circle r="42" fill="#FFF6C8" opacity=".18"/><circle r="28" fill="#FFF6C8" mask="url(#moonM)"/></g>';
  return s + '</svg>';
}

class HorseView {
  constructor(box) { this.box = box; this.key = ''; this.eyes = 'open'; this.chew = false; }
  render(force) {
    if (!S.horse) return;
    const sparkle = S.sparkleUntil > Date.now();
    const cleanStep = Math.round(S.stats.clean / 10);
    const asleep = isAsleep();
    const sleepy = !asleep && (S.stats.energy < 25 || sleepState() === 'nightAwake');
    const key = JSON.stringify([S.horse, moodOf(), cleanStep, sparkle, this.eyes, this.chew, sleepy, asleep, this.override]);
    if (!force && key === this.key) return;
    this.key = key;
    const keep = this.svg ? Array.from(this.svg.classList).filter(c => ['eating', 'nope'].includes(c)) : [];
    let o = { mood: moodOf(), clean: S.stats.clean, sparkle, eyes: this.eyes, chew: this.chew, sleepy };
    if (asleep) o = Object.assign(o, { pose: 'lie', eyes: 'closed', zzz: true, sleepy: false });
    if (this.override) o = Object.assign(o, this.override);
    this.box.querySelector('.hwrap').innerHTML = horseSVG(S.horse, o);
    this.svg = this.box.querySelector('svg');
    keep.forEach(c => this.svg.classList.add(c));
  }
  anim(cls, ms) {
    const el = cls === 'hop' || cls === 'shiver' ? this.box.querySelector('.hwrap') : this.svg;
    if (!el) return;
    el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls);
    clearTimeout(this['t' + cls]);
    this['t' + cls] = setTimeout(() => el.classList.remove(cls), ms);
  }
  // Aufwachen: Augen auf, gähnen, aufstehen, schütteln, wiehern
  wakeUp(done) {
    if (this.waking) return;
    this.waking = true;
    const steps = [
      [{ pose: 'lie', eyes: 'open', sleepy: true, zzz: false }, 650, () => Snd.play('pop')],
      [{ pose: 'lie', eyes: 'closed', yawn: true, zzz: false }, 1000, () => Snd.play('yawn')],
      [{ pose: 'lie', eyes: 'open', zzz: false }, 350, null],
      [{ pose: 'stand', eyes: 'closed' }, 300, () => this.anim('hop', 700)],
      [{ pose: 'stand' }, 0, () => { this.anim('shiver', 1000); Snd.play('neigh'); }],
    ];
    let i = 0;
    const next = () => {
      if (i >= steps.length) {
        this.override = null; this.waking = false; this.render(true);
        const r = this.box.getBoundingClientRect();
        for (let k = 0; k < 3; k++) setTimeout(() => fx('heart', r.left + r.width * (0.55 + Math.random() * 0.3), r.top + r.height * 0.3, ['💖', '💕', '☀️'][k], { '--dx': (Math.random() * 50 - 25) + 'px' }), k * 140);
        done && done();
        return;
      }
      const [ov, ms, fn] = steps[i++];
      this.override = ov; this.render(true); fn && fn();
      setTimeout(next, ms);
    };
    next();
  }
  closeEyes(ms) {
    this.eyes = 'closed'; this.render();
    clearTimeout(this.tEyes);
    this.tEyes = setTimeout(() => { this.eyes = 'open'; this.render(); }, ms);
  }
  mouth() {
    const m = this.box.querySelector('.mouthpt');
    if (!m) return null;
    const r = m.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  }
  head() {
    const r = this.box.getBoundingClientRect();
    const m = this.mouth() || { x: r.left + r.width * 0.75, y: r.top + r.height * 0.3 };
    return { x: m.x - r.width * 0.12, y: m.y - r.height * 0.22 };
  }
}

// Pferd auf den Boden der Szene stellen
function placeHorse(box, area, opts = {}) {
  const a = area.getBoundingClientRect(), app = appRect();
  if (!a.width || !a.height) return;
  const s = Math.max(app.width / 400, app.height / 600);
  const groundY = app.bottom - 120 * s; // y = 480 in der Szene
  let feetY = Math.min(groundY + 20, a.bottom - (opts.bottomPad || 0));
  const maxH = feetY - a.top - (opts.topPad || 0);
  let w = Math.min(a.width * (opts.wFrac || 0.94), 520, maxH / 0.95 * 340 / 360);
  const h = w * 360 / 340;
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.style.top = (feetY - a.top - h + (15 / 360) * h) + 'px';
  box.style.bottom = 'auto';
}

function setupSwipe() {
  const tr = $('#track');
  let sx = 0, sy = 0, dx = 0, mode = null, id = null, t0 = 0;
  tr.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-noswipe]')) return;
    sx = e.clientX; sy = e.clientY; dx = 0; mode = 'wait'; id = e.pointerId; t0 = performance.now();
  });
  tr.addEventListener('pointermove', e => {
    if (e.pointerId !== id || !mode) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (mode === 'wait') {
      if (Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my) * 1.2) { mode = 'drag'; tr.classList.add('dragging'); try { tr.setPointerCapture(id); } catch (err) { } }
      else if (Math.abs(my) > 12) { mode = null; return; }
    }
    if (mode === 'drag') {
      dx = mx;
      if ((panel === 0 && dx > 0) || (panel === 2 && dx < 0)) dx *= 0.3;
      tr.style.transform = `translateX(calc(${-panel * 33.3334}% + ${dx}px))`;
    }
  });
  const end = e => {
    if (e.pointerId !== id) return;
    if (mode === 'drag') {
      tr.classList.remove('dragging');
      const v = dx / Math.max(1, performance.now() - t0);
      const w = tr.parentElement.getBoundingClientRect().width;
      if (dx < -w * 0.2 || v < -0.5) goPanel(panel + 1);
      else if (dx > w * 0.2 || v > 0.5) goPanel(panel - 1);
      else goPanel(panel);
      suppressClick = true; setTimeout(() => suppressClick = false, 50);
    }
    mode = null; id = null;
  };
  tr.addEventListener('pointerup', end);
  tr.addEventListener('pointercancel', end);
}
let suppressClick = false;
document.addEventListener('click', e => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); } }, true);

const petLog = [];
function setupCare() {
  const box = $('#centerBox');

  box.addEventListener('pointerdown', e => {
    if (isAsleep() || views.center.waking) { e.preventDefault(); if (!views.center.waking) wakeHorse(views.center, () => say(isBedtime() ? 'Oh… hallo! Ist schon Morgen? 🥱' : 'Oh, hallo! 😊', 2200)); down = false; return; }

          const bc = up.color === 'rainbow' ? `hsla(${Math.floor(Math.random() * 360)},90%,70%,.75)` : up.id === 'schwamm_bluete' ? 'rgba(255,150,200,.7)' : 'rgba(170,220,255,.55)';
          fx('bubbleFx', e.clientX + (Math.random() * 30 - 15), e.clientY + (Math.random() * 20 - 10), '', { '--s': (10 + Math.random() * 20) + 'px', '--dx': (Math.random() * 30 - 15) + 'px', '--bc': bc });
        }
        if (Math.random() < 0.18) Snd.play('splash'); else Snd.play('bubble');
        gainClean(1.3 * pw, 0);
      } else if (tool === 'buerste') {
        const gold = up.id === 'buerste_gold';
        fx('spark', e.clientX, e.clientY, Math.random() < 0.5 ? '✦' : '·', { '--dx': (Math.random() * 40 - 20) + 'px', '--dy': (-10 - Math.random() * 30) + 'px', color: gold ? '#FFC107' : up.id === 'buerste_weich' ? '#8FC8FF' : '#FFD43B' });
        Snd.play(gold ? 'brushGold' : up.id === 'buerste_weich' ? 'brushSoft' : 'brush');
        gainClean(0.6 * pw, 0.35 * pw);
      }
    }
  });
  const up = e => {
    if (!down) return;
    down = false;
    if (tool === 'hand' && moved < 14) pet(e.clientX, e.clientY);

}
let cleanMsgT = 0;
function gainClean(c, f) {

  if (f && S.stats.fun < 90) S.stats.fun = clamp(S.stats.fun + f, 0, 100);
  if (before < 100 && S.stats.clean >= 100) { say('Blitzeblank! ✨ Danke!'); Snd.play('sparkle'); views.center.anim('hop', 800); }
  else if (S.stats.clean >= 100 && Date.now() - cleanMsgT > 4000) { cleanMsgT = Date.now(); say('Ich bin schon ganz sauber! 😊', 1800); }
  save(); renderBars(); refreshHorses();
}
function pet(x, y) {
  const now = Date.now();
  while (petLog.length && now - petLog[0] > 60000) petLog.shift();
  petLog.push(now);
  for (let i = 0; i < 3; i++) setTimeout(() => fx('heart', x + (Math.random() * 30 - 15), y, ['💖', '💕', '💗'][i], { '--dx': (Math.random() * 50 - 25) + 'px' }), i * 120);

  change({ fun: Math.max(1, Math.round(1.5 * pw)) });
  // sanft: Fell-Rascheln und ab und zu ein tiefes, zufriedenes Brummeln (kein Wiehern)

}

// Langeweile: App offen, aber 5 Minuten weder gepflegt, gefüttert noch gespielt → Spaß sinkt extra
function boredTick() {
  const now = Date.now();
  if (!S.horse || document.visibilityState !== 'visible' || isAsleep()) { lastCare = Math.max(lastCare, now - BORED_AFTER + 60000); return; }
  if (!$('#game').classList.contains('hidden') || $('#main').classList.contains('hidden')) { lastCare = now; return; }

  if (S.stats.fun > FLOOR) S.stats.fun = Math.max(FLOOR, S.stats.fun - BORED_DROP);

function importCode(code) {

  const parts = (i >= 0 ? code.slice(i + 7) : code).split(/\s+/).map(t => t.replace(/[^A-Za-z0-9+/=]/g, '')).filter(Boolean);

      const k = hh / 160;

        if (rail === '#FFFFFF') { ctx.fillStyle = '#E5484D'; for (let s = 0; s < o.w + 12 * k; s += 14 * k) ctx.fillRect(o.x - 6 * k + s, ry, 7 * k, 7 * k); }
      }

    loop(dt => {

      // Hitbox Pferd (Beine/Körper)

        }
        if (!o.passed && o.x + o.w < bx1) { o.passed = true; if (!o.hit) { cleared++; hud('🏁 ' + cleared, '❤️'.repeat(lives) + '🤍'.repeat(L0 - lives)); parts.push({ x: hx + hw * 0.5, y: gy - y - hh * 0.6, t: 0, txt: '+1' }); } }

      while (obs.length && obs[0].x < -100) obs.shift();
      coinsArr.forEach(cn => {

      });

      // Zeichnen

  }

  // ---------- 2. Äpfel fangen ----------
  function Catch() {
    const { c, ctx, W, H } = makeCanvas();
    const gy = H * 0.94, hw = Math.min(W * 0.42, H * 0.3, 210), hh = hw * 360 / 340;
    let x = W / 2 - hw / 2, tx = x, flip = false, t = 0, score = 0, lives = 3, spawnT = 0, frame = 0, ft = 0, moving = 0, timeLeft = 60, done = false;
    const items = [], parts = [];
    const imgs = { stand: horseImg('stand'), run1: horseImg('run1'), run2: horseImg('run2') };
    const kinds = [
      { ch: '🍎', p: 1, w: 34 }, { ch: '🥕', p: 1, w: 28 }, { ch: '🍏', p: 1, w: 10 }, { ch: '⭐', p: 5, w: 6 },
      { ch: '🐝', p: -1, w: 12 * D(1, 1.6, 2.2) }, { ch: '💩', p: -1, w: 10 * D(1, 1.6, 2.2) },
    ];
    const total = kinds.reduce((a, k) => a + k.w, 0);
    const pick = () => { let r = Math.random() * total; for (const k of kinds) { if ((r -= k.w) < 0) return k; } return kinds[0]; };
    const move = e => { const r = c.getBoundingClientRect(); tx = clamp(e.clientX - r.left - hw / 2, -hw * 0.1, W - hw * 0.9); };
    c.addEventListener('pointerdown', move); c.addEventListener('pointermove', move);
    hud('🍎 0', '❤️❤️❤️ ⏱ 60');
    loop(dt => {
      t += dt; timeLeft -= dt;
      if (timeLeft <= 0 && !done) { done = true; cur.paused = true; setTimeout(() => finish('aepfel', score, Math.ceil(score / 2), `${score} Punkte gefangen`), 300); }
      const prev = x; x += (tx - x) * Math.min(1, dt * 12);
      const vx = (x - prev) / Math.max(dt, 0.001);
      if (Math.abs(vx) > 30) { flip = vx < 0; moving = 0.15; } else moving -= dt;
      ft += dt; if (ft > 0.1) { ft = 0; frame ^= 1; if (moving > 0) Snd.play('clop'); }
      const lvl = (1 + t / 25) * D(1.15, 1.4, 1.7);
      spawnT -= dt;
      if (spawnT <= 0) { spawnT = Math.max(0.26, 0.95 / lvl) * (0.7 + Math.random() * 0.6); const k = pick(); items.push({ k, x: 20 + Math.random() * (W - 40), y: -30, v: H * (0.22 + Math.random() * 0.12) * lvl, rot: Math.random() * 6 }); }
      // Fangzone: Kopf des Pferdes
      const headX = flip ? x + hw * 0.2 : x + hw * 0.8, headY = gy - hh * 0.72;
      items.forEach(it => {
        it.y += it.v * dt; it.rot += dt * 2;
        if (!it.gone && Math.abs(it.x - headX) < hw * 0.26 && Math.abs(it.y - headY) < hh * 0.2) {
          it.gone = true;
          if (it.k.p > 0) { score += it.k.p; Snd.play(it.k.p > 1 ? 'sparkle' : 'pop'); parts.push({ x: it.x, y: it.y, t: 0, txt: '+' + it.k.p, col: '#fff' }); }
          else { lives--; Snd.play('hurt'); parts.push({ x: it.x, y: it.y, t: 0, txt: it.k.ch === '🐝' ? 'Autsch!' : 'Iiih!', col: '#FF6B6B' }); if (lives <= 0 && !done) { done = true; cur.paused = true; setTimeout(() => finish('aepfel', score, Math.ceil(score / 2), `${score} Punkte gefangen`), 400); } }
        }
      });

      hud('🍎 ' + score, '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(3 - Math.max(0, lives)) + ' ⏱ ' + Math.max(0, Math.ceil(timeLeft)));

      ctx.fillStyle = '#4FA05C'; ctx.beginPath(); ctx.ellipse(W / 2, -H * 0.02, W * 0.75, H * 0.12, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#3F8E4E'; for (let i = 0; i < 7; i++) { ctx.beginPath(); ctx.arc(W * i / 6, H * 0.06, W * 0.1, 0, 7); ctx.fill(); }
      ctx.fillStyle = '#7CC96B'; ctx.beginPath(); ctx.moveTo(0, H); ctx.lineTo(0, gy - H * 0.08); ctx.quadraticCurveTo(W / 2, gy - H * 0.14, W, gy - H * 0.07); ctx.lineTo(W, H); ctx.fill();

      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(x + hw / 2, gy, hw * 0.36, 6, 0, 0, 7); ctx.fill();
      drawHorse(ctx, moving > 0 ? (frame ? imgs.run1 : imgs.run2) : imgs.stand, x, gy, hw, flip, 0);
      parts.forEach(p => { p.t += dt; p.y -= 50 * dt; ctx.globalAlpha = Math.max(0, 1 - p.t); ctx.font = `900 22px ui-rounded,system-ui`; ctx.fillStyle = p.col; ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 3; ctx.textAlign = 'center'; ctx.strokeText(p.txt, p.x, p.y); ctx.fillText(p.txt, p.x, p.y); ctx.globalAlpha = 1; });
      while (parts.length && parts[0].t > 1) parts.shift();

    return { stop() { } };
  }

  // ---------- 3. Hufeisen-Memory ----------
  function Memory() {
    const pairs = D(6, 8, 10), limit = D(90, 75, 60);
    const a = area();
    a.style.background = 'linear-gradient(180deg,#E9DDFF,#FFE3F1)';
    const pool = ['🐴', '🦄', '🥕', '🍎', '🏆', '🎀', '⭐', '🌻', '🍀', '🌈'];
    const cards = shuffle(pool.slice(0, pairs).flatMap(e => [e, e]));
    const cols = pairs === 6 ? 3 : 4, rows = cards.length / cols;
    const W = a.clientWidth - 20, H = a.clientHeight - 20, gap = 8;
    const cw = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * 0.8, 120), ch = cw * 1.25;
    const shoe = `<svg width="60%" height="60%" viewBox="0 0 40 40"><path d="M8,6 C2,22 8,36 20,36 C32,36 38,22 32,6" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><g fill="#B07CFF"><circle cx="8" cy="18" r="1.6"/><circle cx="11" cy="28" r="1.6"/><circle cx="32" cy="18" r="1.6"/><circle cx="29" cy="28" r="1.6"/></g></svg>`;
    a.innerHTML = `<div class="memgrid" style="grid-template-columns:repeat(${cols},${cw}px);grid-auto-rows:${ch}px">${cards.map((e, i) => `<div class="mcard" data-i="${i}"><div class="in"><div class="ba">${shoe}</div><div class="fa" style="font-size:${cw * 0.5}px">${e}</div></div></div>`).join('')}</div>`;
    let open = [], moves = 0, found = 0, lock = false, t0 = performance.now();
    const upd = () => hud('🔄 ' + moves, '✅ ' + found + '/' + pairs);
    upd();
    let paused = 0, pAt = 0, over = false;
    const timer = setInterval(() => {
      if (!cur || over) return;
      if (cur.paused) { if (!pAt) pAt = performance.now(); return; }
      if (pAt) { paused += performance.now() - pAt; pAt = 0; }
      const left = Math.max(0, Math.ceil(limit - (performance.now() - t0 - paused) / 1000));
      $('#gExtra').innerHTML = '✅ ' + found + '/' + pairs + ' ⏱ ' + left;
      if (left <= 0 && found < pairs) { over = true; lock = true; Snd.play('nope'); setTimeout(() => finish('memory', moves, found, `Die Zeit ist um! ${found} von ${pairs} Paaren gefunden`), 500); }
    }, 250);
    a.onclick = e => {
      const el = e.target.closest('.mcard');
      if (!el || lock || el.classList.contains('up') || el.classList.contains('done')) return;
      el.classList.add('up'); Snd.play('flip'); open.push(el);
      if (open.length === 2) {
        moves++; upd();
        const [x, y] = open;
        if (cards[x.dataset.i] === cards[y.dataset.i]) {
          setTimeout(() => { x.classList.add('done'); y.classList.add('done'); Snd.play('coin'); }, 300);
          open = []; found++; upd();
          if (found === pairs && !over) { over = true;
            const secs = Math.round((performance.now() - t0) / 1000);
            const coins = pairs + Math.max(0, pairs * 3 - moves);
            setTimeout(() => finish('memory', moves, coins, `Alle ${pairs} Paare in ${moves} Zügen (${secs} Sek.)`), 800);
          }
        } else {
          lock = true;
          setTimeout(() => { x.classList.remove('up'); y.classList.remove('up'); open = []; lock = false; }, 850);
        }
      }
    };
    return { stop() { clearInterval(timer); a.onclick = null; } };
  }

  // ---------- 4. Karotten-Tippen ----------
  function Whack() {

    a.innerHTML = `<div class="holes">${Array.from({ length: 9 }, (_, i) => `<div class="hole" data-i="${i}"><div class="dirt"></div><div class="pop"></div><div class="front"></div></div>`).join('')}</div>`;
    const holes = $$('.hole', a).map(el => ({ el, pop: el.querySelector('.pop'), item: null, until: 0 }));
    let score = 0, timeLeft = 35, t = 0, spawnT = 0.6, done = false;
    hud('🥕 0', '⏱ 35');
    const tap = e => {
      const h = e.target.closest('.hole'); if (!h || done) return;

    let t = -3, last = '', frame = 0, ft = 0, done = false, place = 0, finishOrder = [];
    const LEN = 1; // Strecke 0..1

  // ---------- 6. Hufeisenwerfen ----------
  function Throw() {

    const TOL = D(0.85, 0.7, 0.55);

    const press = e => {
      e.preventDefault();
      if (state !== 'aim' || cur.paused) return;

      ctx.beginPath(); ctx.arc(0, 0, sz * 0.5, Math.PI * 0.95, Math.PI * 2.05, true); ctx.stroke();

    }

      t += dt;

      if (state === 'fly') {

    const tap = e => {

    function drawObj(o) {

      else if (o.kind.k === 'stein') { ctx.fillStyle = '#8E8B9C'; ctx.beginPath(); ctx.ellipse(o.x, y - 12 * s, 26 * s, 17 * s, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#ADAAB8'; ctx.beginPath(); ctx.ellipse(o.x - 6 * s, y - 18 * s, 10 * s, 6 * s, 0, 0, 7); ctx.fill(); }
      else if (o.kind.k === 'zaun') { ctx.fillStyle = '#8B5A2B'; ctx.fillRect(o.x - 20 * s, y - 40 * s, 6 * s, 40 * s); ctx.fillRect(o.x + 14 * s, y - 40 * s, 6 * s, 40 * s); ctx.fillStyle = '#C9A46A'; ctx.fillRect(o.x - 24 * s, y - 34 * s, 48 * s, 6 * s); ctx.fillRect(o.x - 24 * s, y - 20 * s, 48 * s, 6 * s); }

      const hw = hwBase * laneScale[lane];
      const curLane = lanesY.reduce((b, y, i) => Math.abs(y - ly) < Math.abs(lanesY[b] - ly) ? i : b, 0);

          if (o.kind.bad) { if (inv <= 0) { o.gone = true; lives--; inv = 1.2; Snd.play('hurt'); pop(o.x, lanesY[o.lane] - 60, 'Autsch!', '#FF6B6B'); if (lives <= 0 && !done) end(); } }
          else { o.gone = true; score += o.kind.p; Snd.play(o.kind.p > 1 ? 'sparkle' : 'pop'); pop(o.x, lanesY[o.lane] - 60, '+' + o.kind.p); }

      K.cloud(ctx, ((W * 0.85 - dist * 0.04) % (W + 160) + W + 160) % (W + 160) - 80, H * 0.22, 0.7);
      ctx.fillStyle = '#9AD47F'; ctx.beginPath(); ctx.moveTo(0, H);

  }

  // ---------- Dressur-Takt ----------
  function Dressur() {
    const { c, ctx, W, H } = K.makeCanvas();
    const hitX = W * 0.22, laneY = H * 0.38, travel = 1.7, total = 40, WIN = 0.22 * D(0.85, 0.7, 0.55);
    const notes = [];
    let bt = 1.2, beat = 0.66;
    for (let i = 0; i < total; i++) { notes.push({ time: bt, done: false, gold: Math.random() < 0.12 }); const tempo = Math.max(D(0.4, 0.36, 0.32), D(0.6, 0.54, 0.48) - i * 0.006); bt += Math.random() < 0.18 ? tempo * 2 : tempo; }
    let t = 0, score = 0, combo = 0, best = 0, hits = 0, frame = 0, lastBeat = 0, fb = '', fbT = 0, finished = false;
    const imgs = [K.horseImg('run1'), K.horseImg('run2')], hw = Math.min(W * 0.55, H * 0.34);
    const shoe = (x, y, r, gold, a = 1) => {
      ctx.save(); ctx.globalAlpha = a; ctx.translate(x, y);
      ctx.fillStyle = gold ? '#FFE27A' : '#FFFFFF'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
      ctx.strokeStyle = gold ? '#C99A1E' : '#8D99A6'; ctx.lineWidth = r * 0.26; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, r * 0.08, r * 0.52, Math.PI * 0.95, Math.PI * 2.05, true); ctx.stroke(); ctx.restore();
    };
    const tap = e => {
      e.preventDefault();
      if (C().paused || finished) return;
      let bestN = null, bd = 9;
      for (const n of notes) { if (n.done) continue; const d = Math.abs(n.time - t); if (d < bd) { bd = d; bestN = n; } }
      if (!bestN || bd > WIN) { fb = 'Zu früh!'; fbT = 0.6; combo = 0; Snd.play('nope'); return; }
      bestN.done = true; hits++;
      if (bd < WIN * 0.4) { combo++; const p = (bestN.gold ? 6 : 3) + Math.min(5, Math.floor(combo / 4)); score += p; fb = combo >= 4 ? `Perfekt! ×${combo}` : 'Perfekt!'; Snd.tone(784, 0.12, 'triangle', 0.12); }
      else { combo++; score += bestN.gold ? 2 : 1; fb = 'Gut!'; Snd.tone(587, 0.1, 'triangle', 0.1); }
      best = Math.max(best, combo); fbT = 0.6;
    };
    c.addEventListener('pointerdown', tap);
    K.loop(dt => {
      t += dt;
      // Metronom & Trab im Takt
      if (t - lastBeat >= 0.66) { lastBeat = t; frame ^= 1; Snd.play('clop'); }
      for (const n of notes) if (!n.done && t - n.time > WIN) { n.done = true; n.miss = true; combo = 0; fb = 'Daneben'; fbT = 0.5; }
      const left = notes.filter(n => !n.done).length;
      K.hud('🎶 ' + score, `🔥 ${combo} · noch ${left}`);
      if (!left && !finished) { finished = true; C().paused = true; setTimeout(() => K.finish('dressur', score, Math.round(score / 3), `${hits} von ${total} getroffen · beste Serie ${best}`), 500); }
      // Zeichnen: Reithalle
      ctx.fillStyle = '#C9A57A'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#8A5E35'; ctx.fillRect(0, H * 0.55, W, H * 0.08);
      ['A', 'K', 'E', 'H', 'C'].forEach((L, i) => { const x = W * (0.1 + i * 0.2); ctx.fillStyle = '#fff'; ctx.fillRect(x - 14, H * 0.56, 28, 28); ctx.fillStyle = '#3A2D4A'; ctx.font = '900 18px ui-rounded,system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(L, x, H * 0.56 + 15); });
      ground(ctx, W, H, H * 0.63, '#E5CFA3');
      // Taktband
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(0, laneY - 38, W, 76, 0) : ctx.rect(0, laneY - 38, W, 76); ctx.fill();
      const pulse = 1 + Math.max(0, 0.12 - (t - lastBeat)) * 1.2;
      ctx.strokeStyle = '#845EF7'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(hitX, laneY, 30 * pulse, 0, 7); ctx.stroke();
      const sp = (W - hitX + 40) / travel;
      for (const n of notes) {
        if (n.done && !n.miss) continue;
        const x = hitX + (n.time - t) * sp;
        if (x > W + 40 || x < -40) continue;
        shoe(x, laneY, 24, n.gold, n.miss ? 0.3 : 1);
      }
      K.drawHorse(ctx, imgs[frame], W * 0.5 - hw / 2, H * 0.95, hw);
      if (fbT > 0) { fbT -= dt; ctx.globalAlpha = Math.min(1, fbT * 2); big(ctx, fb, W / 2, laneY - 70, W * 0.07, fb.startsWith('Perfekt') ? '#FFE27A' : '#fff'); ctx.globalAlpha = 1; }
    });

  }

  // ---------- Fliegen verscheuchen ----------
  function Fliegen() {
    const { c, ctx, W, H } = K.makeCanvas();
    const hw = Math.min(W * 0.8, H * 0.5), hh = hw * 360 / 340, gy = H * 0.86, hx = W / 2 - hw / 2;
    const img = K.horseImg('stand');
    let t = 0, score = 0, spawnT = 0.5, bT = 2, shake = 0, done = false;
    const bugs = [];
    const target = () => ({ x: hx + hw * (0.3 + Math.random() * 0.5), y: gy - hh * (0.35 + Math.random() * 0.35) });
    const spawn = (kind) => {
      const side = Math.floor(Math.random() * 4);
      const p = side === 0 ? { x: -20, y: Math.random() * H * 0.8 } : side === 1 ? { x: W + 20, y: Math.random() * H * 0.8 } : { x: Math.random() * W, y: -20 };
      const tg = kind === 'fly' ? target() : { x: Math.random() * W, y: Math.random() * H * 0.7 };
      bugs.push({ kind, x: p.x, y: p.y, tx: tg.x, ty: tg.y, ph: Math.random() * 6, sp: kind === 'fly' ? H * (0.12 + Math.random() * 0.08) * (1 + t / 40) * D(1.2, 1.5, 1.85) : H * 0.08, life: 0 });
    };
    const tap = e => {
      e.preventDefault();
      if (C().paused || done) return;
      const r = c.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      let hit = null, bd = 44;
      for (const b of bugs) { const d = Math.hypot(b.x - x, b.y - y); if (d < bd) { bd = d; hit = b; } }
      if (!hit) return;
      bugs.splice(bugs.indexOf(hit), 1);
      if (hit.kind === 'fly') { score++; Snd.play('pop'); pop(hit.x, hit.y, '+1'); }
      else { score = Math.max(0, score - 2); Snd.play('nope'); pop(hit.x, hit.y, 'Nicht die Schmetterlinge! −2', '#FF6B6B'); }
    };
    c.addEventListener('pointerdown', tap);
    K.loop(dt => {
      t += dt; shake = Math.max(0, shake - dt);
      if (t >= 40 && !done) { done = true; C().paused = true; setTimeout(() => K.finish('fliegen', score, Math.ceil(score / 2), `${score} Fliegen verscheucht`), 300); }
      spawnT -= dt; bT -= dt;
      if (spawnT <= 0) { spawnT = Math.max(0.25, 1.0 - t * 0.018) / D(1.2, 1.5, 1.85); spawn('fly'); }
      if (bT <= 0) { bT = (2.5 + Math.random() * 2) / D(1, 1.4, 1.8); spawn('butterfly'); }
      for (let i = bugs.length - 1; i >= 0; i--) {
        const b = bugs[i]; b.ph += dt * 9; b.life += dt;
        const dx = b.tx - b.x, dy = b.ty - b.y, d = Math.hypot(dx, dy);
        const wob = b.kind === 'fly' ? 18 : 30;
        b.x += (dx / (d || 1)) * b.sp * dt + Math.cos(b.ph) * wob * dt;
        b.y += (dy / (d || 1)) * b.sp * dt + Math.sin(b.ph * 1.3) * wob * dt;
        if (b.kind === 'fly' && d < 10) { bugs.splice(i, 1); score = Math.max(0, score - 1); shake = 0.4; Snd.play('hurt'); pop(b.x, b.y, 'Pieks! −1', '#FF6B6B'); continue; }
        if (b.kind === 'butterfly' && (d < 10 || b.life > 7)) { const tg = { x: Math.random() * W, y: Math.random() * H * 0.7 }; b.tx = tg.x; b.ty = tg.y; if (b.life > 9) bugs.splice(i, 1); }
      }
      K.hud('🪰 ' + score, '⏱ ' + Math.max(0, Math.ceil(40 - t)));
      K.sky(ctx, W, H, t, '#8FD3FF', '#E9F8FF');
      K.cloud(ctx, W * 0.2, H * 0.1, 0.9); K.cloud(ctx, W * 0.8, H * 0.16, 0.7);
      ground(ctx, W, H, gy - 10, '#7CC96B');
      ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(W / 2, gy, hw * 0.36, 8, 0, 0, 7); ctx.fill();
      const sx = shake > 0 ? Math.sin(t * 80) * 4 : 0;
      K.drawHorse(ctx, img, hx + sx, gy, hw);
      for (const b of bugs) {
        ctx.save(); ctx.translate(b.x, b.y);
        if (b.kind === 'butterfly') ctx.scale(1, 0.75 + Math.abs(Math.sin(b.ph)) * 0.35);
        K.emoji(ctx, b.kind === 'fly' ? '🪰' : '🦋', 0, 0, b.kind === 'fly' ? 30 : 36);
        ctx.restore();

    return { stop() { c.removeEventListener('pointerdown', tap); } };
  }

  // ---------- Lasso ----------
  function Lasso() {
    const { c, ctx, W, H } = K.makeCanvas();
    const gy = H * 0.78, hw = Math.min(W * 0.3, H * 0.24), img = K.horseImg('stand');
    const minX = W * 0.32, maxX = W * 0.95;
    const SP = D(1.25, 1.6, 2), TOL = D(0.85, 0.7, 0.55);
    let posts = [], m = 0.5, dir = 1, mSpeed = 0.55 * SP, state = 'aim', throws = 0, score = 0, t = 0, fly = null, msg = '', msgT = 0;
    const newPosts = () => {
      posts = [];
      const zones = [[0.36, 0.52], [0.56, 0.72], [0.76, 0.93]];
      zones.forEach((z, i) => posts.push({ x: W * (z[0] + Math.random() * (z[1] - z[0])), pts: i + 1, caught: false }));
    };
    newPosts();
    const tap = e => {
      e.preventDefault();
      if (state !== 'aim' || C().paused) return;
      throws++; state = 'fly';
      fly = { x0: W * 0.17, y0: gy - hw * 0.9, x1: minX + (maxX - minX) * m, t: 0 };
      Snd.play('jump');
    };
    c.addEventListener('pointerdown', tap);
    K.hud('🤠 0', 'Wurf 1/10');
    K.loop(dt => {
      t += dt;
      if (state === 'aim') { m += dir * mSpeed * dt; if (m > 1) { m = 1; dir = -1; } if (m < 0) { m = 0; dir = 1; } }
      if (state === 'fly') {
        fly.t += dt / 0.75;
        if (fly.t >= 1) {
          fly.t = 1;
          const near = posts.reduce((b, p) => Math.abs(p.x - fly.x1) < Math.abs(b.x - fly.x1) ? p : b, posts[0]);
          if (Math.abs(near.x - fly.x1) < W * 0.035 * TOL) { near.caught = true; score += near.pts; msg = `Gefangen! +${near.pts}`; Snd.play(near.pts === 3 ? 'win' : 'coin'); }
          else { msg = 'Daneben!'; Snd.play('nope'); }
          state = 'wait'; msgT = 1.2;
          K.hud('🤠 ' + score, 'Wurf ' + Math.min(10, throws + 1) + '/10');
        }
      }
      if (state === 'wait') {
        msgT -= dt;
        if (msgT <= 0) {
          if (throws >= 10) { state = 'end'; C().paused = true; K.finish('lasso', score, score, `${score} Punkte mit 10 Würfen`); return; }
          state = 'aim'; fly = null; newPosts(); mSpeed = (0.55 + throws * 0.07) * SP;
        }
      }
      // Zeichnen: Ranch
      K.sky(ctx, W, H, t, '#F7C98B', '#FCE9CF');
      ctx.fillStyle = '#E3B26A'; ctx.beginPath(); ctx.moveTo(0, gy - H * 0.1); ctx.quadraticCurveTo(W / 2, gy - H * 0.18, W, gy - H * 0.08); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      ground(ctx, W, H, gy, '#D9A85E');
      K.emoji(ctx, '🌵', W * 0.9, gy - H * 0.13, 40);
      posts.forEach(p => {
        ctx.fillStyle = '#7A4E2C'; ctx.fillRect(p.x - 6, gy - 60, 12, 62);
        ctx.fillStyle = '#9C6A3C'; ctx.beginPath(); ctx.ellipse(p.x, gy - 60, 7, 3, 0, 0, 7); ctx.fill();
        ctx.font = '900 14px ui-rounded,system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#5A3A20'; ctx.fillText('+' + p.pts, p.x, gy + 16);
        if (p.caught) { ctx.strokeStyle = '#E8590C'; ctx.lineWidth = 4; ctx.beginPath(); ctx.ellipse(p.x, gy - 40, 16, 6, 0, 0, 7); ctx.stroke(); }
      });
      K.drawHorse(ctx, img, W * 0.02, gy, hw);
      // kreisendes Lasso beim Zielen
      const hand = { x: W * 0.17, y: gy - hw * 0.95 };
      if (state === 'aim') {
        const a = t * 9;
        ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(hand.x + Math.cos(a) * 8, hand.y - 24, 24, 8, 0, 0, 7); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.lineTo(hand.x + Math.cos(a) * 8, hand.y - 16); ctx.stroke();
        // Zielpfeil
        const mx = minX + (maxX - minX) * m;
        ctx.fillStyle = '#E8590C'; ctx.beginPath(); ctx.moveTo(mx, gy - 74); ctx.lineTo(mx - 10, gy - 92); ctx.lineTo(mx + 10, gy - 92); ctx.closePath(); ctx.fill();
      }
      if (fly) {
        const k = fly.t, x = fly.x0 + (fly.x1 - fly.x0) * k, y = fly.y0 + (gy - 40 - fly.y0) * k - Math.sin(k * Math.PI) * H * 0.22;
        ctx.strokeStyle = '#C0392B'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(hand.x, hand.y); ctx.quadraticCurveTo((hand.x + x) / 2, Math.min(hand.y, y) - 30, x, y); ctx.stroke();
        ctx.beginPath(); ctx.ellipse(x, y, 20, 7, 0, 0, 7); ctx.stroke();
      }
      if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); big(ctx, msg, W / 2, H * 0.28, W * 0.075); ctx.globalAlpha = 1; }
      big(ctx, 'Tippen zum Werfen!', W / 2, H * 0.93, 15, '#fff');

  }

  // ---------- Ringstechen ----------
  function Ring() {
    const { c, ctx, W, H } = K.makeCanvas();
    const gy = H * 0.85, hw = Math.min(W * 0.52, H * 0.36), hx = W * 0.02;
    const imgs = [K.horseImg('run1'), K.horseImg('run2')];
    const total = 15;
    let t = 0, frame = 0, ft = 0, score = 0, taken = 0, spawned = 0, nextT = 1.0, done = false, dist = 0;
    const rings = [];
    const tipX = hx + hw * 1.15;
    const RS = D(1.15, 1.3, 1.5), RT = D(0.9, 0.78, 0.65);
    const tipY = () => gy - hw * 0.95 + Math.sin(t * (2.2 + t * 0.02) * RS) * hw * 0.42;
    const tap = e => {
      e.preventDefault();
      if (C().paused || done) return;
      const ty = tipY();
      const r = rings.find(r => !r.done && Math.abs(r.x - tipX) < r.r * 1.4);
      if (!r) { Snd.play('click'); return; }
      r.done = true;
      if (Math.abs(r.y - ty) < r.r * 0.85 * RT) { r.hit = true; taken++; const p = r.gold ? 2 : 1; score += p; Snd.play(r.gold ? 'sparkle' : 'coin'); pop(tipX, r.y - 30, '+' + p); }
      else { Snd.play('nope'); pop(tipX, r.y - 30, r.y < ty ? 'Zu tief!' : 'Zu hoch!', '#FF6B6B'); }
    };
    c.addEventListener('pointerdown', tap);
    K.loop(dt => {
      t += dt;
      const speed = W * (0.32 + Math.min(0.25, t * 0.006)) * RS;
      dist += speed * dt;
      nextT -= dt;

  // ---------- Wasserlauf (Rohr-Rätsel) ----------
  // Rohr-Anschlüsse als Bits: oben 1, rechts 2, unten 4, links 8
  function Wasser() {
    const a = K.area();
    a.style.background = 'linear-gradient(180deg,#C5F6FA,#E3FAFC)';
    const sizes = D([4, 5, 5], [5, 5, 6], [5, 6, 6]);
    let level = 0, solved = 0, timeLeft = D(100, 100, 90), grid, n, r0, rEnd, done = false;
    const rot = m => ((m << 1) | (m >> 3)) & 15;
    function makeLevel() {
      n = sizes[level];
      grid = Array.from({ length: n }, () => Array(n).fill(0));
      r0 = Math.floor(Math.random() * n);
      let r = r0;
      const conn = (r1, c1, r2, c2) => {
        if (r2 < r1) { grid[r1][c1] |= 1; grid[r2][c2] |= 4; } else if (r2 > r1) { grid[r1][c1] |= 4; grid[r2][c2] |= 1; }
        else if (c2 > c1) { grid[r1][c1] |= 2; grid[r2][c2] |= 8; }
      };
      grid[r][0] |= 8;
      for (let c = 0; c < n; c++) {
        const rt = Math.floor(Math.random() * n);
        while (r !== rt) { const nr = r + Math.sign(rt - r); conn(r, c, nr, c); r = nr; }
        if (c < n - 1) conn(r, c, r, c + 1);
      }
      rEnd = r; grid[r][n - 1] |= 2;
      const fillers = [5, 10, 3, 6, 12, 9, 7, 11];
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
        if (!grid[i][j]) grid[i][j] = fillers[Math.floor(Math.random() * fillers.length)];
        for (let k = Math.floor(Math.random() * 4); k > 0; k--) grid[i][j] = rot(grid[i][j]);
      }
      if (flow().ok) makeLevel();
    }
    function flow() {
      const wet = Array.from({ length: n }, () => Array(n).fill(false));
      if (!(grid[r0][0] & 8)) return { wet, ok: false };
      const q = [[r0, 0]]; wet[r0][0] = true;
      const D = [[1, -1, 0, 4], [2, 0, 1, 8], [4, 1, 0, 1], [8, 0, -1, 2]];
      while (q.length) {
        const [i, j] = q.shift();
        for (const [b, di, dj, ob] of D) {
          if (!(grid[i][j] & b)) continue;
          const ni = i + di, nj = j + dj;
          if (ni < 0 || nj < 0 || ni >= n || nj >= n || wet[ni][nj] || !(grid[ni][nj] & ob)) continue;
          wet[ni][nj] = true; q.push([ni, nj]);
        }
      }
      return { wet, ok: wet[rEnd][n - 1] && !!(grid[rEnd][n - 1] & 2) };
    }
    const tileSVG = (m, w) => {
      const col = w ? '#22B8CF' : '#ADB5BD', inner = w ? '#99E9F2' : '#DEE2E6';
      let p = '';
      [[1, 50, 0], [2, 100, 50], [4, 50, 100], [8, 0, 50]].forEach(([b, x, y]) => { if (m & b) p += `<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="${col}" stroke-width="30" stroke-linecap="butt"/><line x1="50" y1="50" x2="${x}" y2="${y}" stroke="${inner}" stroke-width="12"/>`; });
      return `<svg viewBox="0 0 100 100" width="100%" height="100%">${p}<circle cx="50" cy="50" r="15" fill="${col}"/><circle cx="50" cy="50" r="6" fill="${inner}"/></svg>`;
    };
    function render() {
      const { wet, ok } = flow();
      const size = Math.floor(Math.min((a.clientWidth - 40 - 3 * (n - 1)) / (n + 1.2), (a.clientHeight - 120) / n, 84));
      let h = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px"><div style="font-weight:900;color:#0B7285">Rätsel ${level + 1} von 3</div><div style="display:flex;align-items:center;gap:2px">`;
      h += `<div style="display:grid;grid-template-rows:repeat(${n},${size}px);width:${size * 0.6}px;font-size:${size * 0.5}px">${Array.from({ length: n }, (_, i) => `<div style="display:grid;place-items:center">${i === r0 ? '🚰' : ''}</div>`).join('')}</div>`;
      h += `<div style="display:grid;grid-template-columns:repeat(${n},${size}px);grid-auto-rows:${size}px;gap:3px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 4px 0 rgba(0,0,0,.08)">`;
      for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) h += `<button data-t="${i},${j}" style="background:${wet[i][j] ? '#E3FAFC' : '#F8F9FA'};border-radius:10px;padding:0;touch-action:none">${tileSVG(grid[i][j], wet[i][j])}</button>`;
      h += `</div><div style="display:grid;grid-template-rows:repeat(${n},${size}px);width:${size * 0.6}px;font-size:${size * 0.5}px">${Array.from({ length: n }, (_, i) => `<div style="display:grid;place-items:center">${i === rEnd ? (ok ? '🐴' : '🪣') : ''}</div>`).join('')}</div></div></div>`;
      a.innerHTML = h;
      return ok;
    }
    a.onpointerdown = e => {
      const b = e.target.closest('[data-t]'); if (!b || done || C().paused) return;
      e.preventDefault();
      const [i, j] = b.dataset.t.split(',').map(Number);
      grid[i][j] = rot(grid[i][j]); Snd.play('click');
      if (render()) {
        done = true; solved++; Snd.play('win');
        setTimeout(() => {
          if (level < sizes.length - 1) { level++; done = false; makeLevel(); render(); }
          else finishGame();
        }, 1100);
      }
    };
    const finishGame = () => { done = true; C().paused = true; K.finish('wasser', solved, solved * 4 + Math.ceil(Math.max(0, timeLeft) / 10), `${solved} von 3 Rätseln gelöst`); };
    makeLevel(); render();
    K.loop(dt => {
      timeLeft -= dt;
      K.hud('💧 ' + solved + '/3', '⏱ ' + Math.max(0, Math.ceil(timeLeft)));
      if (timeLeft <= 0 && !done) finishGame();
    });
    return { stop() { a.onpointerdown = null; } };
  }


  // ---------- Stall ausmisten ----------
