    const barrow = { x: W * 0.62, y: H * 0.74, w: W * D(0.34, 0.3, 0.26), h: H * 0.13 }, diffN = K.diff();
    const TL = D(45, 40, 35);
    let t = 0, score = 0, fill = 0, spawnT = 0.2, grab = null, done = false, bx0 = barrow.x;
    const piles = [];
    const spawn = () => {
      if (piles.length >= 8) return;
      for (let k = 0; k < 10; k++) {
        const x = W * 0.08 + Math.random() * W * 0.84, y = floorY + H * 0.08 + Math.random() * (barrow.y - floorY - H * 0.14);
        if (y > barrow.y - 50) continue;
        if (piles.some(p => Math.hypot(p.x - x, p.y - y) < 60)) continue;
        piles.push({ x, y, gold: Math.random() < 0.1, born: t }); return;
      }
    };
    const pos = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    const down = e => {
      e.preventDefault(); if (done || C().paused) return;
      const p = pos(e);
      let best = null, bd = 52;
      for (const q of piles) { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = q; } }
      if (best) { grab = best; grab.ox = best.x - p.x; grab.oy = best.y - p.y; Snd.play('scrape'); try { c.setPointerCapture(e.pointerId); } catch (err) { } }
    };
    const move = e => { if (!grab) return; const p = pos(e); grab.x = p.x + grab.ox; grab.y = p.y + grab.oy; };
    const up = () => {
      if (!grab) return;
      const g = grab; grab = null;
      if (g.x > barrow.x - 10 && g.x < barrow.x + barrow.w + 10 && g.y > barrow.y - 40 && g.y < barrow.y + barrow.h) {
        piles.splice(piles.indexOf(g), 1);
        const p = g.gold ? 3 : 1; score += p; fill = Math.min(1, fill + 0.06);
        Snd.play(g.gold ? 'sparkle' : 'plop'); pop(barrow.x + barrow.w / 2, barrow.y - 30, '+' + p);
      }
    };
    c.addEventListener('pointerdown', down); c.addEventListener('pointermove', move); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    K.loop(dt => {
      t += dt;
      if (t >= TL && !done) { done = true; C().paused = true; setTimeout(() => K.finish('misten', score, score, `${score} Pferdeäpfel weggeräumt`), 300); }
      spawnT -= dt;
      if (spawnT <= 0) { spawnT = Math.max(0.6, 1.4 - t * 0.02); spawn(); if (t < 1) { spawn(); spawn(); spawn(); } }
      K.hud('🧹 ' + score, '⏱ ' + Math.max(0, Math.ceil(TL - t)));
      // Schwer: Schubkarre rollt hin und her
      if (diffN === 2) barrow.x = bx0 - W * 0.2 + Math.sin(t * 0.9) * W * 0.2; else if (diffN === 1) barrow.x = bx0 - W * 0.08 + Math.sin(t * 0.6) * W * 0.08;
      // Stall
      ctx.fillStyle = '#B07B48'; ctx.fillRect(0, 0, W, floorY);
      for (let x = 0; x < W; x += 36) { ctx.fillStyle = x % 72 ? '#A87444' : '#B8834F'; ctx.fillRect(x, 0, 34, floorY); }
      ctx.fillStyle = '#7A5230'; ctx.fillRect(0, floorY - 10, W, 12);
      ctx.fillStyle = '#E8C766'; ctx.fillRect(0, floorY, W, H - floorY);
      for (let i = 0; i < 70; i++) { const x = (i * 97) % W, y = floorY + ((i * 53) % (H - floorY)); ctx.strokeStyle = '#C9A440'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 10, y + (i % 3) - 1); ctx.stroke(); }
      K.drawHorse(ctx, img, W * 0.02, floorY + hw * 0.45, hw);
      // Schubkarre
      const b = barrow;
      ctx.fillStyle = '#2F9E44'; ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x + b.w, b.y); ctx.lineTo(b.x + b.w * 0.85, b.y + b.h); ctx.lineTo(b.x + b.w * 0.15, b.y + b.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#6B4423'; ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, b.y + 4, b.w * 0.45 * (0.3 + fill * 0.7), 6 + fill * 10, 0, Math.PI, 0); ctx.fill();
      ctx.fillStyle = '#343A40'; ctx.beginPath(); ctx.arc(b.x + b.w * 0.5, b.y + b.h + 8, 12, 0, 7); ctx.fill();
      ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(b.x + b.w, b.y + b.h * 0.4); ctx.lineTo(b.x + b.w + 18, b.y + b.h * 0.9); ctx.stroke();
      // Haufen
      for (const q of piles) {
        if (q !== grab && Math.sin((t + q.born) * 6) > 0.6) K.emoji(ctx, '🪰', q.x + 22, q.y - 26, 16);
        if (q === grab) { ctx.strokeStyle = '#868E96'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(q.x + 30, q.y + 60); ctx.lineTo(q.x + 4, q.y + 10); ctx.stroke(); [-12, 0, 12].forEach(d => { ctx.beginPath(); ctx.moveTo(q.x + d, q.y + 14); ctx.lineTo(q.x + d, q.y - 8); ctx.stroke(); }); }
        K.emoji(ctx, q.gold ? '🪙' : '💩', q.x, q.y, q.gold ? 34 : 40);

  // ---------- Mähne flechten ----------
  function Flechten() {

      <div id="fMsg" style="font-weight:900;font-size:20px;color:#3A2D4A;min-height:28px;text-align:center">Schau genau hin…</div>
      <div style="display:flex;gap:10px;width:100%;max-width:440px">${strands.map((st, i) => `<button data-s="${i}" style="flex:1;height:min(30vh,170px);border-radius:24px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:.6;transition:opacity .1s,transform .1s;touch-action:none"><svg width="36" height="90" viewBox="0 0 36 90"><path d="M18,4 C4,25 32,45 18,65 C10,76 14,84 18,88" stroke="${st.c}" stroke-width="12" fill="none" stroke-linecap="round"/></svg><b style="font-size:14px">${st.name}</b></button>`).join('')}</div></div>`;

    { id: 'wiese', name: 'Hügelwiese', icon: '🌳', price: 0, g: 900, grip: 1, amp: 1, sky: ['#86CDF4', '#E2F4FF'], far: '#A8DCA0', ground: '#8B5A2B', top: '#5BAE4B', deco: 'tree', seed: 1 },
    { id: 'wueste', name: 'Wüste', icon: '🏜️', price: 3000, g: 900, grip: 0.9, amp: 1.25, sky: ['#7FCBF2', '#FFF1D2'], far: '#F5D9A6', ground: '#D9A85E', top: '#F0C27D', deco: 'cactus', seed: 2 },
    { id: 'winter', name: 'Winterland', icon: '❄️', price: 6000, g: 900, grip: 0.55, amp: 1.1, sky: ['#A9C9E8', '#EEF5FC'], far: '#DCE8F4', ground: '#9DB4CC', top: '#FFFFFF', deco: 'pine', seed: 3 },

  ];
  // Werkstatt: Teile verbessern (gelten für alle Fahrzeuge). Jede Stufe bringt einen festen Prozent-Sprung,
  // jede Stufe kostet prozentual mehr als die vorige.
  const UPGRADES = [
    { id: 'tank', name: 'Tank', icon: '⛽', max: 15, base: 100, grow: 1.25, step: 15, desc: 'Mehr Sprit – du kommst weiter' },
    { id: 'motor', name: 'Motor', icon: '⚙️', max: 10, base: 150, grow: 1.28, step: 12, desc: 'Mehr Zugkraft am Berg' },
    { id: 'getriebe', name: 'Getriebe', icon: '🔩', max: 10, base: 150, grow: 1.28, step: 7, desc: 'Schneller anfahren, höheres Tempo' },
    { id: 'reifen', name: 'Reifen', icon: '🛞', max: 10, base: 150, grow: 1.28, step: 8, desc: 'Bessere Bodenhaftung, weniger Rutschen' },
    { id: 'federung', name: 'Federung', icon: '🌀', max: 10, base: 150, grow: 1.28, step: 6, desc: 'Weniger Hüpfen, kippt nicht so leicht' },
  ];
  const upCost = (u, lvl) => Math.round(u.base * Math.pow(u.grow, lvl) / 5) * 5;
  // Werte des Fahrzeugs inkl. Werkstatt-Stufen
  function tuned(V, up) {
    const L = id => Math.max(0, Math.min(UPGRADES.find(u => u.id === id).max, up[id] | 0));
    return {
      tank: V.tank * (1 + 0.15 * L('tank')),
      power: V.power * (1 + 0.12 * L('motor')),
      vmax: V.vmax * (1 + 0.07 * L('getriebe')),
      launch: 1 + 0.1 * L('getriebe'),             // Extra-Schub beim Anfahren
      grip: V.grip * 0.75 * (1 + 0.08 * L('reifen')), // Grundhaftung bewusst schwächer als bis 1.7
      bounce: 1.38 - 0.03 * L('federung'),           // 1 = kein Abprallen
      tilt: 0.34 - 0.013 * L('federung'),            // wie stark Gas am Boden das Fahrzeug aufbäumt
      air: V.air * (1 + 0.04 * L('federung')),
    };
  }

  // Fahrzeugmünzen-Werte: kleine oft, große erst weiter hinten und selten
  const FM_VALUES = [5, 10, 15, 20, 100, 500];

  function hill() {
    if (!S.hill || typeof S.hill !== 'object') S.hill = {};
    const h = S.hill;
    if (typeof h.fm !== 'number') h.fm = 0;
    if (!Array.isArray(h.owned)) h.owned = ['kutsche', 'wiese'];
    if (!h.vehicle) h.vehicle = 'kutsche';
    if (!h.map) h.map = 'wiese';
    if (!h.best) h.best = {};
    if (!h.up || typeof h.up !== 'object') h.up = {};
    for (const u of UPGRADES) if (typeof h.up[u.id] !== 'number') h.up[u.id] = 0;
    return h;
  }
  // Fahrzeugmünze als Bild (Kutsche drauf)
  function fmIcon(size = 18) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" style="flex:none;vertical-align:-3px"><circle cx="12" cy="12" r="11" fill="#FFB347" stroke="#C46A00" stroke-width="2"/><rect x="5.5" y="8" width="11" height="5" rx="1.5" fill="#8A4B12"/><path d="M16.5,10 L19,9" stroke="#8A4B12" stroke-width="1.5"/><circle cx="8" cy="15.5" r="2.3" fill="#8A4B12"/><circle cx="15" cy="15.5" r="2.3" fill="#8A4B12"/></svg>`;
  }
  function drawFm(ctx, x, y, r, val) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = val >= 500 ? '#C77DFF' : val >= 100 ? '#4DABF7' : '#FFB347';
    ctx.strokeStyle = val >= 500 ? '#7B2CBF' : val >= 100 ? '#1C7ED6' : '#C46A00';
    ctx.lineWidth = r * 0.18; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    ctx.fillRect(-r * 0.5, -r * 0.45, r, r * 0.45); ctx.beginPath(); ctx.arc(-r * 0.3, r * 0.25, r * 0.2, 0, 7); ctx.arc(r * 0.3, r * 0.25, r * 0.2, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `900 ${Math.round(r * 0.75)}px ui-rounded,system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2.5; ctx.strokeText(val, 0, r * 0.62 + 4); ctx.fillText(val, 0, r * 0.62 + 4);
    ctx.restore();
  }
  function vehIcon(v, w = 44) {
    const c = v.color;
    let body = '';
    if (v.id === 'kutsche') body = `<rect x="6" y="10" width="30" height="12" rx="2" fill="${c}"/><path d="M6,14 h30 M6,18 h30" stroke="#6E4A2E" stroke-width="1"/><path d="M36,18 L44,14" stroke="#6E4A2E" stroke-width="2"/>`;
    if (v.id === 'traktor') body = `<rect x="18" y="12" width="20" height="9" rx="2" fill="${c}"/><rect x="6" y="4" width="13" height="17" rx="2" fill="none" stroke="#343A40" stroke-width="2"/><rect x="6" y="14" width="13" height="7" fill="${c}"/><rect x="33" y="5" width="3" height="8" fill="#495057"/>`;
    if (v.id === 'gelaende') body = `<path d="M4,20 L6,12 L14,12 L18,6 L30,6 L34,12 L42,13 L42,20 Z" fill="${c}"/><path d="M19,8 L29,8 L32,12 L17,12 Z" fill="#BFE6FF"/>`;
    if (v.id === 'einhorn') body = `<path d="M4,20 Q6,8 20,8 Q36,8 42,16 L42,20 Z" fill="${c}"/><path d="M8,16 h30" stroke="#FFD43B" stroke-width="2"/><path d="M12,13 h24" stroke="#74C0FC" stroke-width="2"/><path d="M38,11 L46,2 L41,13 Z" fill="#FFE066"/>`;
    const r1 = v.r[0] * 0.42, r2 = v.r[1] * 0.42;
    return `<svg width="${w}" height="${w * 0.7}" viewBox="0 0 48 32">${body}<circle cx="12" cy="${26 - r1 + 3}" r="${r1}" fill="#212529"/><circle cx="12" cy="${26 - r1 + 3}" r="${r1 * 0.45}" fill="#ADB5BD"/><circle cx="36" cy="${26 - r2 + 3}" r="${r2}" fill="#212529"/><circle cx="36" cy="${26 - r2 + 3}" r="${r2 * 0.45}" fill="#ADB5BD"/></svg>`;
  }

  // ---------- Garage (Startbildschirm) ----------
  function garage(a, g, api) {
    const H = hill();
    let armed = null, tab = 'fahr';
    const werkstatt = () => UPGRADES.map(u => {
      const lvl = H.up[u.id], max = lvl >= u.max, cost = upCost(u, lvl), arm = armed === 'up_' + u.id;
      const pct = Math.round(u.step * lvl);

        <span class="wt"><b>${u.name} <small>Stufe ${lvl}/${u.max}${lvl ? ` · +${pct} %` : ''}</small></b><small>${u.desc}</small>
        <span class="pips">${Array.from({ length: u.max }, (_, i) => `<i class="${i < lvl ? 'on' : ''}"></i>`).join('')}</span></span>
        <span class="wp">${max ? '⭐ Maximal' : arm ? `Kaufen?<br>${fmIcon(13)} ${fmt(cost)}` : `⬆️ ${fmIcon(13)} ${fmt(cost)}`}</span></button>`;
    }).join('');
    const render = () => {
      const tired = S.stats.energy < g.energy;

        return `<button class="gcard ${on ? 'on' : ''} ${own ? '' : 'locked'} ${arm ? 'armed' : ''}" data-v="${v.id}"><span class="gi2">${vehIcon(v)}</span><span class="gt2"><b>${v.name}</b><small>${v.desc}</small><span class="pr2">${on ? '✅ Gewählt' : own ? 'Wählen' : arm ? `Kaufen? ${fmIcon(13)} ${fmt(v.price)}` : `🔒 ${fmIcon(13)} ${fmt(v.price)}`}</span></span></button>`;
      };

        return `<button class="gcard ${on ? 'on' : ''} ${own ? '' : 'locked'} ${arm ? 'armed' : ''}" data-m="${m.id}"><span class="gi2">${m.icon}</span><span class="gt2"><b>${m.name}</b><small>${best ? `🏁 Rekord ${fmt(best)} m` : m.id === 'mond' ? 'Wenig Schwerkraft!' : m.id === 'winter' ? 'Rutschig!' : '&nbsp;'}</small><span class="pr2">${on ? '✅ Gewählt' : own ? 'Wählen' : arm ? `Kaufen? ${fmIcon(13)} ${fmt(m.price)}` : `🔒 ${fmIcon(13)} ${fmt(m.price)}`}</span></span></button>`;
      };
      a.innerHTML = `<div class="garage">
        <div class="gh"><span style="font-size:20px">🚗 Garage</span><span style="flex:1"></span><span class="pill" style="display:flex;align-items:center;gap:5px">${fmIcon(18)} ${fmt(H.fm)}</span><span class="pill" style="color:${tired ? '#E8590C' : '#2B8A3E'}">⚡ ${Math.floor(S.stats.energy)} / ${g.energy}</span></div>
        <div class="gtabs"><button class="${tab === 'fahr' ? 'on' : ''}" data-tab="fahr">🚗 Fahrzeuge & Strecken</button><button class="${tab === 'werk' ? 'on' : ''}" data-tab="werk">🔧 Werkstatt</button></div>
        ${tab === 'fahr' ? `<div class="cols"><div class="col"><b class="t">Fahrzeuge</b><div class="grid">${VEHICLES.map(vehCard).join('')}</div></div>
        <div class="col"><b class="t">Strecken</b><div class="grid">${MAPS.map(mapCard).join('')}</div></div></div>`
        : `<div class="werk">${werkstatt()}</div>`}
        ${K.diffPicker('hill')}
        <div style="display:flex;gap:8px;align-items:center"><span style="flex:1;font-size:12px;font-weight:700;color:var(--ink2)">Fahrzeugmünzen sammelst du unterwegs – und mit Saltos ↺ ↻ und Flugzeit! Normale 🪙 kommen in deinen Geldbeutel.</span>
        <button class="btn" id="gBack" style="flex:none;padding:10px 16px">Zurück</button><button class="btn pri" id="gGo" style="flex:none;padding:10px 22px" ${tired ? 'disabled' : ''}>${tired ? '😴 Zu müde' : 'Losfahren! 🏁'}</button></div></div>`;
    };
    render();
    a.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      Snd.play('click');
      if (b.id === 'gBack') { a.onclick = null; api.close(); return; }
      if (b.dataset.d) { K.setDiff('hill', +b.dataset.d); render(); return; }
      if (b.dataset.tab) { tab = b.dataset.tab; armed = null; render(); return; }
      if (b.dataset.u) {
        const u = UPGRADES.find(x => x.id === b.dataset.u), lvl = H.up[u.id];
        if (lvl >= u.max) return;
        if (armed !== 'up_' + u.id) { armed = 'up_' + u.id; render(); return; }
        const cost = upCost(u, lvl);
        if (H.fm < cost) { Snd.play('nope'); toast(`Dir fehlen noch ${fmt(cost - H.fm)} Fahrzeugmünzen 🔧`); armed = null; render(); return; }
        H.fm -= cost; H.up[u.id] = lvl + 1; armed = null; save(); Snd.play('win'); render(); return;
      }
      if (b.id === 'gGo') { a.onclick = null; if (!api.launch({ vehicle: H.vehicle, map: H.map })) { toast('Dein Pferd ist zu müde 😴'); api.close(); } return; }
      const id = b.dataset.v || b.dataset.m; if (!id) return;
      const item = (b.dataset.v ? VEHICLES : MAPS).find(x => x.id === id);
      if (H.owned.includes(id)) { if (b.dataset.v) H.vehicle = id; else H.map = id; armed = null; save(); render(); return; }
      if (armed !== id) { armed = id; render(); return; }
      if (H.fm < item.price) { Snd.play('nope'); toast(`Dir fehlen noch ${fmt(item.price - H.fm)} Fahrzeugmünzen 🚗`); armed = null; render(); return; }
      H.fm -= item.price; H.owned.push(id); if (b.dataset.v) H.vehicle = id; else H.map = id; armed = null; save(); Snd.play('win'); render();
    };
  }

  // ---------- Das Spiel ----------
  function Bergfahrt(opt) {
    const H = hill();
    const V = VEHICLES.find(v => v.id === opt.vehicle) || VEHICLES[0];
    const M = MAPS.find(m => m.id === opt.map) || MAPS[0];
    const T = tuned(V, H.up);
    const a = K.area();
    const { c, ctx, W, H: SH } = K.makeCanvas();
    const z = SH / 330; // Zoom: Weltgröße passend zur Bildschirmhöhe
    // Bedienknöpfe
    a.insertAdjacentHTML('beforeend', `<button class="hcbtn" id="hcBrake" style="left:14px;background:#E8590C"><span class="ic">🛑</span>Bremse</button><button class="hcbtn" id="hcGas" style="right:14px;background:#2F9E44"><span class="ic">⛽</span>Gas</button>`);
    const keys = { gas: false, brake: false };
    const bind = (id, k) => {
      const el = a.querySelector('#' + id);
      const on = e => { e.preventDefault(); keys[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (err) { } };
      const off = e => { keys[k] = false; el.classList.remove('on'); };
      el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off);
    };
    bind('hcGas', 'gas'); bind('hcBrake', 'brake');

    // Strecke
    const sr = (n => () => { n = (n * 1664525 + 1013904223) >>> 0; return n / 4294967296; })(M.seed * 7919);
    const ph = [sr() * 6, sr() * 6, sr() * 6, sr() * 6];
    const groundY = x => {
      if (x < 300) return 0;
      const ramp = Math.min(1, (x - 300) / 700);
      const A = M.amp * (40 + Math.min(140, x * 0.0085)) * ramp * K.D(1.15, 1.35, 1.6);
      return -A * (0.55 * Math.sin(x * 0.0045 + ph[0]) + 0.3 * Math.sin(x * 0.011 + ph[1]) + 0.15 * Math.sin(x * 0.027 + ph[2])) + A * 0.55 * Math.sin(ph[0]) * 0;
    };
    const slope = x => (groundY(x + 2) - groundY(x - 2)) / 4;

    // Gegenstände entlang der Strecke (in Abschnitten erzeugt)
    const items = [];
    let genTo = 400, nextFuel = 200 * PX;
    const rnd = (k => () => { k = (k * 1103515245 + 12345) >>> 0; return k / 4294967296; })(M.seed * 31 + Date.now() % 9973);
    function pickFm(m) {
      const w = [[5, 60], [10, m > 150 ? 22 : 0], [15, m > 300 ? 14 : 0], [20, m > 450 ? 10 : 0], [100, m > 650 ? 3 : 0], [500, m > 1100 ? 0.7 : 0]];
      let t = w.reduce((s, x) => s + x[1], 0), r = rnd() * t;
      for (const [v, p] of w) { if ((r -= p) < 0) return v; }
      return 5;
    }
    function generate(to) {
      while (genTo < to) {
        const x0 = genTo, m = x0 / PX;
        if (x0 >= nextFuel) { items.push({ k: 'fuel', x: x0, y: groundY(x0) - 26 }); nextFuel += (230 + m * 0.12) * PX * K.D(1.1, 1.25, 1.45); }
        else if (rnd() < 0.42) {
          const v = pickFm(m);
          if (v >= 100) items.push({ k: 'fm', v, x: x0, y: groundY(x0) - 60 - rnd() * 40 });
          else for (let i = 0; i < 5; i++) { const x = x0 + i * 30; items.push({ k: 'fm', v, x, y: groundY(x) - 34 }); }
        } else if (rnd() < 0.08) items.push({ k: 'coin', x: x0, y: groundY(x0) - 40 });
        genTo += 200;
      }
    }

    // Fahrzeug: zwei Räder (Verlet) mit fester Achse
    const r0 = V.r[0], r1 = V.r[1];
    const sx = 120;
    const wh = [
      { x: sx, y: groundY(sx) - r0, ox: sx, oy: groundY(sx) - r0, r: r0, g: false, rot: 0 },
      { x: sx + V.base, y: groundY(sx + V.base) - r1, ox: sx + V.base, oy: groundY(sx + V.base) - r1, r: r1, g: false, rot: 0 },
    ];
    let t = 0, fuel = T.tank, dist = 0, maxX = sx, fmRun = 0, coinsRun = 0, flipsRun = 0, ended = false, stillT = 0;
    let air = false, airStart = 0, angAcc = 0, lastAng = 0, camX = 0, camY = groundY(sx) - 200, trail = [];
    const pops = [];
    const pop = (txt, col) => pops.push({ txt, col, t: 0 });

    // Pferdekopf für den Fahrersitz
    const headImg = new Image();
    (() => {
      let svg = horseSVG(S.horse, { anim: false, mood: 'happy', clean: S.stats.clean });
      const gg = horseSVG.geo, T = (x, y) => [170 + (x - 170) * gg.scale, 285 + (y - 285) * gg.scale];
      const [x1, y1] = T(gg.hx - gg.R * 1.7, gg.hy - gg.R * 1.9), [x2, y2] = T(gg.hx + gg.R * 2.2, gg.hy + gg.R * 2.1);
      svg = svg.replace('viewBox="0 -60 340 360"', `viewBox="${x1.toFixed(1)} ${y1.toFixed(1)} ${(x2 - x1).toFixed(1)} ${(y2 - y1).toFixed(1)}" width="200" height="${(200 * (y2 - y1) / (x2 - x1)).toFixed(0)}"`);
      headImg.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    })();

    // Motorgeräusch
    let eng = null;
    if (Snd.ok()) {
      const ac = Snd.ctx, o = ac.createOscillator(), o2 = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o2.type = 'square'; o.frequency.value = 55; o2.frequency.value = 27.5;
      f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.0001;
      o.connect(f); o2.connect(f); f.connect(g).connect(Snd.sfx); o.start(); o2.start();
      eng = { o, o2, f, g };
    }
    const engStop = () => { if (!eng) return; try { eng.g.gain.setTargetAtTime(0, Snd.ctx.currentTime, 0.05); setTimeout(() => { try { eng.o.stop(); eng.o2.stop(); } catch (e) { } }, 300); } catch (e) { } eng = null; };

    const center = () => ({ x: (wh[0].x + wh[1].x) / 2, y: (wh[0].y + wh[1].y) / 2 });
    const angle = () => Math.atan2(wh[1].y - wh[0].y, wh[1].x - wh[0].x);
    const local = (lx, ly) => { const cc = center(), an = angle(), cs = Math.cos(an), sn = Math.sin(an); return { x: cc.x + lx * cs - ly * sn, y: cc.y + lx * sn + ly * cs }; };
    const rotateAll = da => {
      const cc = center(), cs = Math.cos(da), sn = Math.sin(da);
      for (const w of wh) { const dx = w.x - cc.x, dy = w.y - cc.y; w.x = cc.x + dx * cs - dy * sn; w.y = cc.y + dx * sn + dy * cs; }
    };
    const headLocal = { x: V.base * 0.02, y: -(Math.max(r0, r1) + 52) };
    const roof = [{ x: -V.base * 0.45, y: -(Math.max(r0, r1) + 26) }, { x: V.base * 0.45, y: -(Math.max(r0, r1) + 26) }];

    function end(reason) {
      if (ended) return;
      ended = true; C().paused = true; engStop();
      const m = Math.floor(dist);
      const rec = m > (H.best[M.id] || 0); if (rec) H.best[M.id] = m;
      // Schwerer = mehr Fahrzeugmünzen
      const bonus = Math.round(fmRun * (K.DIFF_MULT[K.diff()] - 1)); H.fm += bonus; fmRun += bonus;
      save();
      Snd.play(reason === 'crash' ? 'hurt' : 'nope');
      const why = reason === 'crash' ? 'Kopf auf dem Boden 😵‍💫 – Puh, alles gut!' : 'Tank leer! ⛽';
      setTimeout(() => K.finish('hill', m, coinsRun, `${why}<br>🏁 ${fmt(m)} m${rec ? ' · neuer Rekord!' : ''} auf ${M.name}<br>${fmIcon(16)} +${fmt(fmRun)} Fahrzeugmünzen${flipsRun ? ` · ${flipsRun}× Salto` : ''}`), 900);
    }

    function physics(dt) {
      const g = M.g, grip = T.grip * M.grip;
      const gas = keys.gas && fuel > 0, brake = keys.brake;
      for (const w of wh) {
        const vx = (w.x - w.ox) * 0.999, vy = (w.y - w.oy) * 0.999;
        w.ox = w.x; w.oy = w.y;
        w.x += vx; w.y += vy + g * dt * dt;
      }
      // Antrieb am Boden
      for (const w of wh) {
        if (!w.g) continue;
        const s = slope(w.x), n = Math.hypot(1, s), tx = 1 / n, ty = s / n;
        const vt = ((w.x - w.ox) * tx + (w.y - w.oy) * ty) / dt;
        if (gas && vt < T.vmax) {
          const boost = vt < T.vmax * 0.4 ? T.launch : 1;
          const acc = T.power * boost * Math.min(1.5, 0.35 + 0.65 * grip) * dt * dt * 0.5; w.x += tx * acc; w.y += ty * acc;
        }
        if (brake) {
          if (vt > 20) { const k = 0.06 * Math.min(1, grip); w.ox += (w.x - w.ox) * k; w.oy += (w.y - w.oy) * k; }
          else if (vt > -T.vmax * 0.35) { const acc = T.power * 0.35 * dt * dt * 0.5; w.x -= tx * acc; w.y -= ty * acc; }
        }
      }
      // Kippen: in der Luft stark, am Boden leicht (Wheelie)
      const inAir = !wh[0].g && !wh[1].g;

  // ================= Hufe auskratzen =================
  function Hufe() {
    const { c, ctx, W, H } = K.makeCanvas();
    const TL = D(45, 40, 35), STONES = D(6, 8, 10), wob = D(0, 1, 2);
    const R = Math.min(W * 0.4, (H - 120) * 0.42), hx0 = W / 2, hy0 = H * 0.52;
    let hoof = 0, stones = [], t = 0, score = 0, ouch = 0, shake = 0, done = false, pick = null, msg = '', msgT = 0, next = 0, ouchCount = 0;
    const names = ['vorne links', 'vorne rechts', 'hinten links', 'hinten rechts'];
    let ho = { x: hx0, y: hy0, a: 0 };
    // Huf-Koordinaten: x,y in Einheiten von R; Spitze oben (y<0), Ballen unten
    const inHoof = (x, y) => (x * x) / 0.82 + (y * y) / 1 < 0.72;
    const inFrog = (x, y) => y > -0.25 && y < 0.78 && Math.abs(x) < (y + 0.25) * 0.28 + 0.03;
    function layout() {
      stones = [];
      let tries = 0;
      while (stones.length < STONES && tries++ < 500) {
        const x = (Math.random() * 2 - 1) * 0.72, y = (Math.random() * 2 - 1) * 0.8;
        if (!inHoof(x, y)) continue;
        if (inFrog(x, y) || Math.abs(x) < 0.1 + (y + 0.25) * 0.3 && y > -0.32) continue;
        if (stones.some(s => Math.hypot(s.x - x, s.y - y) < 0.24)) continue;
        const gold = Math.random() < 0.12, dirt = !gold && Math.random() < 0.4;
        stones.push({ x, y, r: 0.09 + Math.random() * 0.05, hp: (dirt ? 40 : 70) * D(1, 1.25, 1.5), max: 0, gold, dirt, out: false, fx: 0, fy: 0, vx: 0, vy: 0, rot: Math.random() * 6 });
      }
      stones.forEach(s => s.max = s.hp);
    }
    layout();
    const toLocal = p => {
      const dx = p.x - ho.x, dy = p.y - ho.y, cs = Math.cos(-ho.a), sn = Math.sin(-ho.a);
      return { x: (dx * cs - dy * sn) / R, y: (dx * sn + dy * cs) / R };
    };
    const posOf = e => { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
    let last = null;
    const down = e => { e.preventDefault(); if (done || C().paused) return; last = posOf(e); pick = last; try { c.setPointerCapture(e.pointerId); } catch (err) { } };
    const move = e => {
      if (!last || done || C().paused || next > 0) return;
      const p = posOf(e), d = Math.hypot(p.x - last.x, p.y - last.y);
      pick = p;
      // ein paar Zwischenpunkte, damit schnelle Wischer nichts überspringen
      const steps = Math.max(1, Math.ceil(d / 8));
      for (let i = 1; i <= steps; i++) {
        const q = { x: last.x + (p.x - last.x) * i / steps, y: last.y + (p.y - last.y) * i / steps }, L = toLocal(q);
        if (inFrog(L.x, L.y) && ouch <= 0) {
          ouch = 0.9; shake = 0.4; ouchCount++; score = Math.max(0, score - 3); Snd.play('hurt'); Snd.play('grunt');
          msg = 'Autsch! Nicht der Strahl! −3'; msgT = 1.1; break;
        }
        for (const s of stones) {
          if (s.out) continue;
          if (Math.hypot(L.x - s.x, L.y - s.y) < s.r + 0.08) {
            s.hp -= d / steps; s.wig = 0.15;
            if (Math.random() < 0.25) Snd.play('scrape');
            if (s.hp <= 0) { s.out = true; s.vx = (Math.random() - 0.5) * 600; s.vy = -300 - Math.random() * 250; s.fx = ho.x + s.x * R; s.fy = ho.y + s.y * R; const pts = s.gold ? 3 : 1; score += pts; Snd.play(s.gold ? 'sparkle' : 'plop'); }
          }

    };

    c.addEventListener('pointerdown', down); c.addEventListener('pointermove', move); c.addEventListener('pointerup', up); c.addEventListener('pointercancel', up);
    const end = (all) => {
      done = true; C().paused = true;
      setTimeout(() => K.finish('hufe', score, Math.ceil(score / 2), all ? `Alle 4 Hufe sauber! 🐴✨ ${score} Punkte${ouchCount ? ` · ${ouchCount}× Autsch` : ''}` : `${hoof} von 4 Hufen geschafft · ${score} Punkte`), 600);
    };
    K.loop(dt => {
      t += dt; ouch -= dt; shake = Math.max(0, shake - dt); msgT -= dt;
      if (t >= TL && !done) { end(false); return; }
      if (next > 0) { next -= dt; if (next <= 0) { if (hoof >= 4) { end(true); return; } layout(); } }
      else if (!done && stones.every(s => s.out)) {
        hoof++; score += 5; msg = hoof >= 4 ? 'Fertig! 🎉' : `Huf ${hoof} sauber! +5`; msgT = 1.2; next = 1.2; Snd.play('win');
      }
      // Pferd zappelt ein bisschen (Mittel/Schwer)
      const wv = wob ? Math.sin(t * (1.2 + wob * 0.5)) * W * 0.03 * wob : 0;
      ho = { x: hx0 + wv + (shake ? Math.sin(t * 60) * 8 : 0), y: hy0 + (wob ? Math.cos(t * 1.7) * H * 0.012 * wob : 0), a: wob ? Math.sin(t * 0.9) * 0.12 * wob : 0 };

      // Hintergrund: Stallgasse

      for (let y = 0; y < H; y += 34) { ctx.fillStyle = y % 68 ? '#BE9670' : '#C59E77'; ctx.fillRect(0, y, W, 32); }

      ctx.fillStyle = byId(COATS, S.horse.coat).body || '#8B5A2B';

      ctx.strokeStyle = 'rgba(120,90,60,.25)'; ctx.lineWidth = 2; for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(0, 0, R * (0.3 + k * 0.1), R * (0.36 + k * 0.11), 0, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }

      // Hufeisen
      ctx.strokeStyle = '#9AA5B1'; ctx.lineWidth = R * 0.13; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.ellipse(0, 0, R * 0.8, R * 0.93, 0, Math.PI * 0.72, Math.PI * 2.28); ctx.stroke();
      ctx.fillStyle = '#5C6670'; for (let k = 0; k < 8; k++) { const a = Math.PI * (0.82 + k * 0.195); if (k === 4) continue; ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.8, Math.sin(a) * R * 0.93, R * 0.025, 0, 7); ctx.fill(); }
      // Steinchen & Dreck
      for (const s of stones) {
        if (s.out) continue;
        const wg = s.wig > 0 ? (s.wig -= dt, Math.sin(t * 70) * 2) : 0;
        const x = s.x * R + wg, y = s.y * R, r = s.r * R;
        if (s.dirt) { ctx.fillStyle = '#6B4423'; ctx.beginPath(); ctx.ellipse(x, y, r * 1.3, r, s.rot, 0, 7); ctx.fill(); ctx.fillStyle = '#7F5530'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.2, r * 0.5, 0, 7); ctx.fill(); }
        else { ctx.fillStyle = s.gold ? '#F2C94C' : '#8E8B9C'; ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.8, s.rot, 0, 7); ctx.fill(); ctx.fillStyle = s.gold ? '#FFF3B0' : '#B7B4C2'; ctx.beginPath(); ctx.arc(x - r * 0.3, y - r * 0.25, r * 0.35, 0, 7); ctx.fill(); }

  // ================= Futter sortieren =================

      const fly = buff.fly > 0;
      const yy = fly ? 4.2 + Math.sin(t * 3) * 0.25 : py;
      const shake = bumpT > 0 ? Math.sin(bumpT * 60) * 0.12 + bumpDir * bumpT * 0.6 : 0;
      const ground = proj(px + shake, 0, z), p = proj(px + shake, yy, z);
      if (!p) return;
      const s = p.s * 1.3, ducking = duck > 0 && py < 2.7 && vy === 0, crashed = done;
      const gal = (done ? 0 : Math.sin(t * speed * 0.9)), lean = (lane * LANE - px) * 0.12 + (crashed ? 0.9 : 0);
      // Schatten
      ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(ground.x, ground.y, s * 0.75 / (1 + yy * 0.25), s * 0.2 / (1 + yy * 0.25), 0, 0, 7); ctx.fill();
      // Schutzschild
      if (buff.shield > 0) { ctx.fillStyle = `rgba(252,196,25,${0.25 + Math.sin(t * 10) * 0.1})`; ctx.beginPath(); ctx.arc(p.x, p.y - s * 1.1, s * 1.35, 0, 7); ctx.fill(); }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(lean * 0.3);
      const bodyH = ducking ? s * 0.75 : s * 1.0, legH = ducking ? s * 0.3 : s * 0.62;
      const legCol = coat.legs || coat.body;
      // Beine (hinten)
      ctx.fillStyle = legCol;
      for (const [sx, ph] of [[-0.28, 0], [0.28, Math.PI]]) {
        const lift = vy !== 0 || fly ? 0.15 : Math.max(0, Math.sin(t * speed * 0.9 + ph)) * 0.25;
        ctx.fillRect(sx * s - s * 0.09, -legH - s * 0.05, s * 0.18, legH * (1 - lift));
        ctx.fillStyle = '#3B2A20'; ctx.fillRect(sx * s - s * 0.1, -legH * lift - s * 0.1, s * 0.2, s * 0.1); ctx.fillStyle = legCol;
      }
      // Körper (Hinterteil)
      const by = -legH - bodyH * 0.55;
      ctx.fillStyle = coat.body;
      ctx.beginPath(); ctx.ellipse(-s * 0.2, by, s * 0.32, bodyH * 0.55, 0, 0, 7); ctx.ellipse(s * 0.2, by, s * 0.32, bodyH * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(-s * 0.015, by - bodyH * 0.4, s * 0.03, bodyH * 0.8);
      // Rücken/Hals & Kopf
      const hy = by - bodyH * 0.55 - (ducking ? 0 : s * 0.25) + gal * s * 0.03;
      ctx.fillStyle = coat.body; ctx.beginPath(); ctx.ellipse(0, hy + s * 0.15, s * 0.22, s * 0.32, 0, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, hy - s * 0.18, s * 0.17, s * 0.2, 0, 0, 7); ctx.fill();
      // Ohren
      ctx.beginPath(); ctx.moveTo(-s * 0.15, hy - s * 0.28); ctx.lineTo(-s * 0.1, hy - s * 0.52); ctx.lineTo(-s * 0.03, hy - s * 0.3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(s * 0.15, hy - s * 0.28); ctx.lineTo(s * 0.1, hy - s * 0.52); ctx.lineTo(s * 0.03, hy - s * 0.3); ctx.fill();
      // Mähne
      ctx.fillStyle = maneC; ctx.beginPath(); ctx.ellipse(gal * s * 0.03, hy + s * 0.05, s * 0.08, s * 0.38, 0, 0, 7); ctx.fill();
      // Flügel
      if (fly) {
        ctx.fillStyle = 'rgba(255,255,255,.95)'; const fl = Math.sin(t * 14) * 0.5;
        for (const sd of [-1, 1]) { ctx.save(); ctx.translate(sd * s * 0.3, by - bodyH * 0.3); ctx.rotate(sd * (-0.6 + fl)); ctx.beginPath(); ctx.ellipse(sd * s * 0.45, 0, s * 0.5, s * 0.16, 0, 0, 7); ctx.fill(); ctx.restore(); }
      }
      // Schweif
      ctx.strokeStyle = maneC; ctx.lineWidth = s * 0.16; ctx.lineCap = 'round';
      const sw2 = Math.sin(t * 9) * s * 0.12 + (lane * LANE - px) * -s * 0.1;
      ctx.beginPath(); ctx.moveTo(0, by - bodyH * 0.35); ctx.quadraticCurveTo(sw2, by + bodyH * 0.1, sw2 * 1.4, by + bodyH * 0.55); ctx.stroke();
      ctx.restore();
    }

    K.loop(dt => {
      t += dt; msgT -= dt; hint -= dt; bumpT = Math.max(0, bumpT - dt);
      if (!done) {
        speed = Math.min(VMAX, speed + ACC * dt);
        z += speed * dt;
        stumbleT = Math.max(0, stumbleT - dt);
        const wasFly = buff.fly > 0;
        for (const k in buff) buff[k] = Math.max(0, buff[k] - dt);
        if (wasFly && buff.fly <= 0) { py = 4.2; vy = 0; }   // nach dem Fliegen sanft landen
        // seitlich gleiten
        const tx = lane * LANE; px += (tx - px) * Math.min(1, dt * 14);
        // springen
        if (buff.fly > 0) { py = 0; vy = 0; }
        else {
          const fl = floorAt();
          if (py > fl || vy > 0) { vy -= GRAV * (dropping ? 1.6 : 1) * dt; py += vy * dt; if (py <= fl) { py = fl; vy = 0; if (dropping) { duck = 0.6; dropping = false; } Snd.play('land'); } }
          else py = fl;
        }
        duck = Math.max(0, duck - dt);
        while (genZ < z + FAR) genRow();
        genDeco();
        // fahrende Wagen kommen entgegen
        for (const o of obs) if (o.moving && o.z - z < 60) o.z -= speed * 0.45 * dt;
        // Zusammenstoß (vorne)
        if (buff.fly <= 0) {
          for (const o of obs) {
            if (o.hit || Math.abs(o.lane * LANE - px) > LANE * 0.55) continue;
            if (o.z < z + 0.5 && o.z + o.len > z - 0.3 && blocks(o)) {
              if (buff.shield > 0) { o.hit = true; Snd.play('sparkle'); continue; }
              crash(o.k === 'wagen' ? 'Gegen den Heuwagen!' : o.k === 'balken' ? 'Ducken vergessen!' : 'Hängengeblieben!');
              break;
            }
          }
        }
        // Einsammeln
        const ey = buff.fly > 0 ? 4.2 : py;
        for (let i = items.length - 1; i >= 0; i--) {
          const it = items[i];
          if (it.z < z - 2) { items.splice(i, 1); continue; }
          if (Math.abs(it.z - z) < 0.9 && Math.abs(it.lane * LANE - px) < LANE * 0.55 && Math.abs(it.y - (ey + 0.9)) < 1.6) {
            items.splice(i, 1);
            if (it.k === 'coin') { coins++; Snd.tone(1320 + (coins % 5) * 60, 0.06, 'square', 0.06); }
            else {
              buff[it.b] = BUFFS[it.b].dur; msg = BUFFS[it.b].icon + ' ' + BUFFS[it.b].name; msgT = 1.3; Snd.play('sparkle');
              if (it.b === 'fly') { py = 0; vy = 0; for (const l of [-1, 0, 1]) for (let k = 0; k < 6; k++) items.push({ k: 'coin', lane: l, z: z + 14 + k * 9 + l * 3, y: 4.6 }); }
            }
          }
        }
        // Magnet beim Fliegen: Münzen in der Luft
        while (obs.length && obs[0].z + obs[0].len < z - CAMB) obs.shift();
        while (deco.length && deco[0].z < z - CAMB) deco.shift();
      } else crashT += dt;

      K.hud('🏁 ' + fmt(Math.floor(z)) + ' m', '🟡 ' + coins);

      // Himmel & Landschaft
      const g = ctx.createLinearGradient(0, 0, 0, horizon); g.addColorStop(0, '#74C0FC'); g.addColorStop(1, '#D0EBFF');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, horizon + 2);
      ctx.fillStyle = '#8CE99A'; ctx.beginPath(); ctx.moveTo(0, horizon);
      for (let x = 0; x <= W; x += 20) ctx.lineTo(x, horizon - 18 - Math.sin(x * 0.012 + 1) * 14 - Math.sin(x * 0.031) * 6);
      ctx.lineTo(W, horizon); ctx.fill();
      ctx.fillStyle = '#69DB7C'; ctx.fillRect(0, horizon, W, H - horizon);
      // Spuren
      const near = z - CAMB + 0.4;
      const corner = (x, zz) => proj(x, 0, zz);
      const l0 = corner(-LANE * 1.55, near), r0 = corner(LANE * 1.55, near), l1 = corner(-LANE * 1.55, z + FAR), r1 = corner(LANE * 1.55, z + FAR);
      ctx.fillStyle = '#C69C6D'; ctx.beginPath(); ctx.moveTo(l0.x, l0.y); ctx.lineTo(r0.x, r0.y); ctx.lineTo(r1.x, r1.y); ctx.lineTo(l1.x, l1.y); ctx.fill();
      // Querbretter / Hufspuren zum Tempo-Gefühl
      ctx.fillStyle = 'rgba(120,80,40,.25)';
      for (let k = Math.ceil(near / 3) * 3; k < z + FAR; k += 3) {
        const a = corner(-LANE * 1.55, k), b = corner(LANE * 1.55, k), a2 = corner(-LANE * 1.55, k + 0.6), b2 = corner(LANE * 1.55, k + 0.6);
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(b2.x, b2.y); ctx.lineTo(a2.x, a2.y); ctx.fill();
      }
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      for (const lx of [-LANE / 2, LANE / 2]) { const a = corner(lx, near), b = corner(lx, z + FAR); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      ctx.strokeStyle = '#8B5A2B'; ctx.lineWidth = 4;
      for (const lx of [-LANE * 1.55, LANE * 1.55]) { const a = corner(lx, near), b = corner(lx, z + FAR); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
      // alles von hinten nach vorne
      const list = [];
      for (const d of deco) if (d.z < z + FAR) list.push({ z: d.z, f: () => drawDeco(d) });
      for (const o of obs) if (o.z < z + FAR && !o.hit) list.push({ z: o.k === 'wagen' ? Math.max(o.z, z - 2) + 0.01 : o.z, f: () => drawObs(o) });
      for (const it of items) if (it.z < z + FAR) list.push({ z: it.z, f: () => drawItem(it) });
      list.push({ z: z - 0.01, f: drawHorse });
      list.sort((a, b) => b.z - a.z);
      for (const e of list) e.f();
      // Hund beim Stolpern
      if (stumbleT > 0 && !done) {
        const p = proj(px - 0.6, 0, z - 2.6); if (p) { ctx.fillStyle = '#000'; ctx.font = `${Math.round(p.s * 1.1)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText('🐕', p.x, p.y + Math.abs(Math.sin(t * 14)) * -p.s * 0.2); }
      }
      // Extras-Anzeige
      let bx = 12;
      for (const k in buff) if (buff[k] > 0) {
        const b = BUFFS[k];
        ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(bx + 22, 34, 22, 0, 7); ctx.fill();
        ctx.strokeStyle = b.col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(bx + 22, 34, 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * buff[k] / b.dur); ctx.stroke();
        ctx.fillStyle = '#000'; ctx.font = `22px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.icon, bx + 22, 35);
        bx += 52;
      }
      if (stumbleT > 0 && !done) big(ctx, '⚠️', W - 30, 34, 26);
      if (msgT > 0) { ctx.globalAlpha = Math.min(1, msgT * 2); big(ctx, msg, W / 2, H * 0.2, Math.min(30, W * 0.075), done ? '#FFC9C9' : '#fff'); ctx.globalAlpha = 1; }
      if (hint > 0 && !done) { ctx.globalAlpha = Math.min(1, hint); big(ctx, '← → wischen · ↑ springen · ↓ ducken', W / 2, H * 0.9, Math.min(20, W * 0.05)); ctx.globalAlpha = 1; }
    });
    Games._dbgR = { obs, items, buff, state: () => ({ z, lane, px, py, duck, done, coins, speed }), move, jump, down };
    return { stop() { c.removeEventListener('pointerdown', pd); c.removeEventListener('pointermove', pm); c.removeEventListener('pointerup', pu); c.removeEventListener('pointercancel', pu); window.removeEventListener('keydown', kd); } };
  }

  Object.assign(Games.FNS, { runner: Runner });
})();

</script>
