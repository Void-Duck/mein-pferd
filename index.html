<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mein Pferd">
<meta name="theme-color" content="#7CC7F2">
<title>Mein Pferd</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root {
  --pink: #FF6FA5; --pink-d: #E04F88; --violet: #8B6CFF; --mint: #3CCB9A; --sun: #FFC93C;
  --ink: #3A2D4A; --ink2: #6E5F80; --card: rgba(255, 255, 255, .86); --line: rgba(58, 45, 74, .1);
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; position: fixed; inset: 0; background: #7CC7F2; }
body { font-family: var(--font); color: var(--ink); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; overscroll-behavior: none; }
button { font-family: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
input { font-family: inherit; }
.hidden { display: none !important; }
#app { position: fixed; inset: 0; overflow: hidden; }

/* ---------- Szene ---------- */
#sceneBg { position: absolute; inset: 0; z-index: 0; }
#sceneBg svg, .scene-svg { width: 100%; height: 100%; display: block; }
.cloud { animation: drift 30s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translateX(18px); } }
.snow { animation: snow 9s linear infinite; }
@keyframes snow { to { transform: translateY(620px); } }
.firefly { animation: fly 3.2s ease-in-out infinite alternate; }
@keyframes fly { 0% { opacity: .1; transform: translate(0, 0); } 100% { opacity: 1; transform: translate(10px, -14px); } }
.twinkle { animation: twinkle 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.1); } }
.floaty { animation: floaty 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
@keyframes floaty { 0% { opacity: 0; transform: translateY(16px) scale(.6); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-30px) scale(1); } }

/* ---------- Pferd-Animationen ---------- */
.horse-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.breathe { animation: breathe 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes breathe { 50% { transform: scale(1.008, 1.018); } }
.tail { animation: tail 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 90% 4%; }
@keyframes tail { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(7deg); } 60% { transform: rotate(-3deg); } }
.ear { transform-box: fill-box; transform-origin: 50% 100%; }
.twitch .ear { animation: twitch .5s ease-in-out; }
@keyframes twitch { 30% { transform: rotate(-18deg); } 60% { transform: rotate(8deg); } }
.eye { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .08s; }
.blink .eye { transform: scaleY(.08); }
.headgrp { transform-box: fill-box; transform-origin: 12% 96%; transition: transform .35s; }
.eating .headgrp { animation: eat .5s ease-in-out 4 alternate; }
@keyframes eat { 0% { transform: rotate(14deg); } 100% { transform: rotate(20deg); } }
.nope .headgrp { animation: nope .9s ease-in-out; }
@keyframes nope { 20% { transform: rotate(-6deg); } 40% { transform: rotate(6deg); } 60% { transform: rotate(-6deg); } 80% { transform: rotate(4deg); } }
.hop { animation: hop .7s cubic-bezier(.3, .7, .4, 1); }
@keyframes hop { 30% { transform: translateY(-9%) rotate(-3deg); } 60% { transform: translateY(0) rotate(1deg); } 75% { transform: translateY(-3%); } }
.shiver { animation: shiver .35s linear 3; }
@keyframes shiver { 25% { transform: translateX(-1.5%); } 75% { transform: translateX(1.5%); } }

/* ---------- Hauptbildschirm ---------- */
#main { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 1; }
.top { padding: calc(var(--sat) + 8px) 12px 6px; display: flex; flex-direction: column; gap: 8px; position: relative; z-index: 5; }
.topbar { display: flex; align-items: center; gap: 8px; }
.namepill { flex: 1; min-width: 0; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; padding: 7px 12px; font-weight: 800; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
.namepill small { font-weight: 600; color: var(--ink2); font-size: 13px; margin-left: 4px; }
.coins { background: linear-gradient(180deg, #FFE27A, #FFC23C); border-radius: 18px; padding: 7px 12px; font-weight: 900; font-size: 18px; box-shadow: 0 2px 0 #E0A21F, 0 3px 10px rgba(0, 0, 0, .1); display: flex; align-items: center; gap: 5px; color: #6B4A00; }
.coins.bump { animation: bump .45s; }
@keyframes bump { 40% { transform: scale(1.18); } }
.iconbtn { width: 40px; height: 40px; border-radius: 14px; background: var(--card); font-size: 20px; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); flex: none; }
.bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.bar { background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 14px; padding: 5px 7px 6px; box-shadow: 0 2px 8px rgba(0, 0, 0, .07); }
.bar .lbl { display: flex; justify-content: space-between; font-size: 12px; font-weight: 800; color: var(--ink2); margin-bottom: 3px; }
.bar .track { height: 11px; background: rgba(58, 45, 74, .1); border-radius: 8px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 8px; transition: width .5s, background-color .5s; position: relative; }
.bar .fill::after { content: ""; position: absolute; left: 4px; right: 4px; top: 2px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, .45); }
.bar.low { animation: lowpulse 1.2s ease-in-out infinite; }
@keyframes lowpulse { 50% { box-shadow: 0 0 0 3px rgba(255, 80, 100, .35); } }

#track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; width: 300%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
#track.dragging { transition: none; }
.panel { width: 33.3334%; height: 100%; position: relative; overflow: hidden; }

/* Pferd in der Mitte */
.stage { position: absolute; left: 0; right: 0; bottom: 0; top: 0; }
.horsebox { position: absolute; left: 50%; transform: translateX(-50%); touch-action: none; }
.horsebox > .hwrap { width: 100%; height: 100%; }
.bubble { position: absolute; background: #fff; border-radius: 18px; padding: 8px 13px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 14px rgba(0, 0, 0, .15); max-width: 70%; transform: translate(-50%, -100%) scale(.6); opacity: 0; transition: .25s; pointer-events: none; z-index: 4; text-align: center; }
.bubble.show { opacity: 1; transform: translate(-50%, -100%) scale(1); }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; border: 9px solid transparent; border-top-color: #fff; border-bottom: 0; transform: translateX(-50%); }
.tools { position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; gap: 6px; justify-content: center; z-index: 3; }
.tool { flex: 1; max-width: 76px; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 16px; padding: 6px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 11px; font-weight: 800; color: var(--ink2); box-shadow: 0 2px 8px rgba(0, 0, 0, .08); border: 2.5px solid transparent; transition: transform .15s; }
.tool .ic { font-size: 24px; line-height: 28px; height: 28px; display: grid; place-items: center; }
.tool.on { border-color: var(--pink); color: var(--pink-d); transform: translateY(-3px); }
.tool .price { font-size: 10px; color: #A07800; }
.sidebtns { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 8px; z-index: 3; }
.sidebtn { width: 52px; height: 52px; border-radius: 18px; background: var(--card); box-shadow: 0 2px 8px rgba(0, 0, 0, .1); display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 22px; line-height: 1; }
.sidebtn span { font-size: 10px; font-weight: 800; color: var(--ink2); margin-top: 3px; }
.fx { position: absolute; pointer-events: none; z-index: 6; font-size: 26px; will-change: transform, opacity; }
.fx.heart { animation: heartup 1.1s ease-out forwards; }
@keyframes heartup { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -170%) scale(1.15); opacity: 0; } }
.fx.bubbleFx { width: var(--s, 18px); height: var(--s, 18px); border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fff 0 18%, rgba(255, 255, 255, .35) 30%, var(--bc, rgba(170, 220, 255, .55)) 70%, rgba(255, 255, 255, .9) 100%); border: 1px solid rgba(255, 255, 255, .9); animation: bubbleup 1.2s ease-out forwards; }
@keyframes bubbleup { 0% { transform: translate(-50%, -50%) scale(.3); opacity: .2; } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { transform: translate(calc(-50% + var(--dx, 0px)), -260%) scale(1.1); opacity: 0; } }
.fx.spark { animation: spark .8s ease-out forwards; color: #FFD43B; font-size: 20px; }
@keyframes spark { 0% { transform: translate(-50%, -50%) scale(.3) rotate(0); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx, 0px)), calc(-50% + var(--dy, -30px))) scale(1.2) rotate(90deg); opacity: 0; } }
.fx.food { transition: transform .55s cubic-bezier(.4, -0.1, .6, 1), opacity .2s .5s; font-size: 40px; transform: translate(-50%, -50%); }
.fx.coinfly { transition: transform .7s cubic-bezier(.5, 0, .7, 1), opacity .2s .6s; font-size: 26px; transform: translate(-50%, -50%); }
.fx.plus { animation: plusup 1.1s ease-out forwards; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .25), 0 0 8px rgba(0, 0, 0, .2); white-space: nowrap; }
@keyframes plusup { 0% { transform: translate(-50%, 0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translate(-50%, -60px); opacity: 0; } }
.foam { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.fly { position: absolute; font-size: 18px; pointer-events: none; animation: buzz 2.4s ease-in-out infinite; z-index: 3; }
@keyframes buzz { 0% { transform: translate(0, 0); } 25% { transform: translate(30px, -16px); } 50% { transform: translate(8px, -36px); } 75% { transform: translate(-22px, -12px); } 100% { transform: translate(0, 0); } }

/* Seiten-Panels */
.sheetcard { position: absolute; left: 10px; right: 10px; bottom: 8px; top: 8px; background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); overflow: hidden; display: flex; flex-direction: column; }
.sheetcard h2 { margin: 14px 16px 2px; font-size: 22px; font-weight: 900; }
.sheetcard .sub { margin: 0 16px 10px; color: var(--ink2); font-size: 14px; font-weight: 600; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; flex: 1; padding: 4px 12px 14px; touch-action: pan-y; }
.gamecard { display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 20px; padding: 12px; margin-bottom: 10px; box-shadow: 0 2px 0 var(--line), 0 3px 10px rgba(0, 0, 0, .05); width: 100%; text-align: left; }
.gamecard .gi { width: 62px; height: 62px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; flex: none; box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .12); }
.gamecard .gt { flex: 1; min-width: 0; }
.gamecard b { font-size: 17px; display: block; }
.gamecard .gd { font-size: 13px; color: var(--ink2); font-weight: 600; line-height: 1.25; }
.gamecard .gb { font-size: 12px; color: #A07800; font-weight: 800; margin-top: 3px; }
.gamecard .play { background: var(--pink); color: #fff; font-weight: 900; border-radius: 14px; padding: 9px 12px; font-size: 15px; box-shadow: 0 3px 0 var(--pink-d); flex: none; }
.bonus { background: linear-gradient(135deg, #FFF1B8, #FFD6EA); border-radius: 20px; padding: 12px 14px; margin-bottom: 10px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.bonus .big { font-size: 30px; }

.foodgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.food { background: #fff; border-radius: 18px; padding: 8px 4px 7px; text-align: center; box-shadow: 0 2px 0 var(--line), 0 3px 10px rgba(0, 0, 0, .05); position: relative; }
.food .fi { font-size: 34px; line-height: 40px; }
.food .fn { font-weight: 800; font-size: 13px; }
.food .fs { font-size: 11px; color: var(--ink2); font-weight: 700; }
.food .fp { font-size: 12px; font-weight: 900; color: #A07800; margin-top: 2px; }
.food .fp.free { color: var(--mint); }
.food:active, .gamecard:active, .tool:active, .item:active { transform: scale(.95); }
.food.poor { opacity: .5; }

/* Navigation unten */
.tabs { display: flex; gap: 6px; padding: 6px 12px calc(var(--sab) + 8px); position: relative; z-index: 5; }
.tab { flex: 1; background: var(--card); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 18px; padding: 7px 0 6px; font-weight: 800; font-size: 12px; color: var(--ink2); display: flex; flex-direction: column; align-items: center; gap: 1px; box-shadow: 0 2px 8px rgba(0, 0, 0, .08); }
.tab .ic { font-size: 22px; line-height: 26px; }
.tab.on { background: #fff; color: var(--pink-d); box-shadow: 0 0 0 2.5px var(--pink), 0 4px 12px rgba(0, 0, 0, .12); }
.dots { display: flex; gap: 6px; justify-content: center; position: absolute; left: 0; right: 0; bottom: calc(var(--sab) + 76px); z-index: 4; pointer-events: none; }

/* ---------- Bottom-Sheet (Shop) ---------- */
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: #FFF8FC; border-radius: 26px 26px 0 0; z-index: 20; box-shadow: 0 -8px 30px rgba(0, 0, 0, .18); display: flex; flex-direction: column; transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding-bottom: var(--sab); }
.sheet:not(.open) { visibility: hidden; transition: transform .32s cubic-bezier(.2, .8, .2, 1), visibility 0s .32s; }
.sheet.open { transform: translateY(0); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: rgba(0, 0, 0, .15); margin: 8px auto 4px; }
.sheethead { display: flex; align-items: center; gap: 8px; padding: 2px 12px 8px; }
.sheethead h3 { margin: 0; font-size: 20px; flex: 1; font-weight: 900; }
.seg { display: flex; gap: 6px; padding: 0 12px 10px; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; white-space: nowrap; box-shadow: 0 1px 0 var(--line); color: var(--ink2); }
.seg button.on { background: var(--pink); color: #fff; box-shadow: 0 3px 0 var(--pink-d); }
.itemgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.item { background: #fff; border-radius: 18px; padding: 8px 4px; text-align: center; box-shadow: 0 2px 0 var(--line); border: 2.5px solid transparent; position: relative; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.item.on { border-color: var(--mint); }
.item .pv { width: 100%; height: 54px; display: grid; place-items: center; font-size: 30px; overflow: hidden; border-radius: 12px; }
.item .pv svg { height: 100%; width: auto; }
.item .nm { font-size: 12px; font-weight: 800; line-height: 1.15; }
.item .pr { font-size: 12px; font-weight: 900; color: #A07800; }
.item .pr.own { color: var(--mint); }
.item .check { position: absolute; top: 4px; right: 6px; font-size: 14px; }
.sectionlbl { font-size: 13px; font-weight: 900; color: var(--ink2); margin: 10px 2px 6px; text-transform: uppercase; letter-spacing: .04em; }
.swatch { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, .2); }

/* ---------- Erstellen ---------- */
#creator { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; background: #FFF8FC; }
.cprev { position: relative; height: 40%; min-height: 220px; overflow: hidden; flex: none; }
.cprev .horsebox { bottom: 10%; }
.chead { position: absolute; top: calc(var(--sat) + 10px); left: 12px; right: 12px; display: flex; gap: 8px; align-items: center; z-index: 2; }
.chead .ttl { flex: 1; background: var(--card); border-radius: 16px; padding: 8px 12px; font-weight: 900; font-size: 17px; }
.cbody { flex: 1; display: flex; flex-direction: column; min-height: 0; border-radius: 26px 26px 0 0; margin-top: -22px; background: #FFF8FC; position: relative; z-index: 3; box-shadow: 0 -6px 20px rgba(0, 0, 0, .08); }
.steps { display: flex; gap: 5px; justify-content: center; padding: 12px 0 4px; }
.steps i { width: 26px; height: 6px; border-radius: 3px; background: rgba(0, 0, 0, .1); }
.steps i.on { background: var(--pink); }
.cbody h2 { margin: 6px 16px 2px; font-size: 22px; font-weight: 900; }
.cbody .sub { margin: 0 16px 8px; color: var(--ink2); font-size: 14px; font-weight: 600; }
.cfoot { display: flex; gap: 8px; padding: 8px 12px calc(var(--sab) + 12px); }
.btn { flex: 1; border-radius: 18px; padding: 14px; font-weight: 900; font-size: 17px; background: #fff; box-shadow: 0 3px 0 var(--line); }
.btn.pri { background: var(--pink); color: #fff; box-shadow: 0 4px 0 var(--pink-d); }
.btn.pri:disabled { opacity: .5; }
.opt { background: #fff; border-radius: 18px; padding: 6px 4px 8px; text-align: center; border: 2.5px solid transparent; box-shadow: 0 2px 0 var(--line); font-size: 12px; font-weight: 800; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.opt.on { border-color: var(--pink); background: #FFF0F6; }
.opt .pv { width: 100%; height: 86px; }
.opt .pv svg { width: 100%; height: 100%; }
.opt small { font-weight: 600; color: var(--ink2); font-size: 11px; line-height: 1.2; }
.optgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: #fff; border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: 14px; border: 2.5px solid transparent; box-shadow: 0 2px 0 var(--line); display: flex; align-items: center; gap: 6px; }
.chip.on { border-color: var(--pink); background: #FFF0F6; }
.chip .dot { width: 16px; height: 16px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .15); }
.chip .lock { font-size: 11px; color: #A07800; }
.nameinput { display: flex; gap: 8px; margin: 4px 0 10px; }
.nameinput input { flex: 1; font-size: 22px; font-weight: 800; padding: 12px 14px; border-radius: 16px; border: 2.5px solid var(--pink); outline: none; background: #fff; color: var(--ink); min-width: 0; -webkit-user-select: text; user-select: text; }

/* ---------- Minispiel ---------- */
#game { position: absolute; inset: 0; z-index: 40; background: #9AD8FF; display: flex; flex-direction: column; }
.ghud { display: flex; gap: 8px; align-items: center; padding: calc(var(--sat) + 8px) 12px 8px; position: relative; z-index: 2; }
.ghud .gtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 900; font-size: 18px; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .18); }
.pill { background: rgba(255, 255, 255, .9); border-radius: 14px; padding: 6px 11px; font-weight: 900; font-size: 16px; white-space: nowrap; }
#garea { flex: 1; position: relative; overflow: hidden; touch-action: none; }
#garea canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.gover { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(40, 20, 60, .35); z-index: 5; padding: 20px; }
.gbox { background: #fff; border-radius: 26px; padding: 22px 20px 18px; text-align: center; width: min(340px, 100%); box-shadow: 0 10px 40px rgba(0, 0, 0, .25); animation: pop .35s cubic-bezier(.3, 1.5, .5, 1); }
@keyframes pop { from { transform: scale(.7); opacity: 0; } }
.gbox h2 { margin: 4px 0 6px; font-size: 26px; font-weight: 900; }
.gbox p { margin: 4px 0; font-weight: 700; color: var(--ink2); }
.gbox .won { font-size: 30px; font-weight: 900; color: #A07800; margin: 10px 0; }
.gbox .row { display: flex; gap: 8px; margin-top: 14px; }
.gbox .emoji { font-size: 54px; }
.memgrid { position: absolute; inset: 10px; display: grid; gap: 8px; align-content: center; justify-content: center; }
.mcard { perspective: 600px; }
.mcard .in { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .35s; }
.mcard.up .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .fa, .mcard .ba { position: absolute; inset: 0; border-radius: 14px; display: grid; place-items: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 3px 0 rgba(0, 0, 0, .12); }
.mcard .ba { background: linear-gradient(135deg, #B07CFF, #FF7DB8); font-size: 26px; color: #fff; }
.mcard .fa { background: #fff; transform: rotateY(180deg); font-size: 34px; }
.mcard.done .fa { background: #E7FFF3; }
.holes { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 20px 14px 30px; align-content: center; }
.hole { position: relative; aspect-ratio: 1/1; overflow: hidden; border-radius: 50% 50% 18px 18px; }
.hole .dirt { position: absolute; left: 6%; right: 6%; bottom: 6%; height: 30%; background: #7A4E2C; border-radius: 50%; box-shadow: inset 0 6px 0 rgba(0, 0, 0, .3); }
.hole .pop { position: absolute; left: 50%; bottom: 18%; font-size: min(15vw, 64px); transform: translate(-50%, 110%); transition: transform .14s ease-out; }
.hole .pop.up { transform: translate(-50%, 0); }
.hole .front { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: #5FAE4E; border-radius: 0 0 18px 18px; }
.hole .pop.hit { animation: hit .3s forwards; }
@keyframes hit { to { transform: translate(-50%, -30%) scale(1.4); opacity: 0; } }

/* ---------- Dialoge ---------- */
#modal { position: absolute; inset: 0; z-index: 50; background: rgba(40, 20, 60, .4); display: grid; place-items: center; padding: 20px; }
#toast { position: absolute; left: 50%; top: calc(var(--sat) + 70px); transform: translate(-50%, -20px); background: #3A2D4A; color: #fff; padding: 10px 16px; border-radius: 16px; font-weight: 800; z-index: 60; opacity: 0; transition: .25s; pointer-events: none; max-width: 90%; text-align: center; font-size: 15px; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
.setrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-weight: 800; text-align: left; }
.setrow input { font-size: 16px; padding: 8px 10px; border-radius: 12px; border: 2px solid var(--line); width: 140px; font-weight: 700; -webkit-user-select: text; user-select: text; }
.toggle { width: 54px; height: 32px; border-radius: 16px; background: #ddd; position: relative; transition: .2s; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: .2s; }
.toggle.on { background: var(--mint); }
.toggle.on::after { left: 25px; }
.leaf { animation: leaf 10s linear infinite; }
@keyframes leaf { 0% { transform: translate(0, 0) rotate(0); } 25% { transform: translate(-18px, 150px) rotate(120deg); } 50% { transform: translate(10px, 310px) rotate(220deg); } 75% { transform: translate(-22px, 460px) rotate(300deg); } 100% { transform: translate(-6px, 620px) rotate(400deg); } }

/* ---------- Tag & Nacht ---------- */
#tint, #nightsky, #lamp { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 2s, background 2s; }
#tint { mix-blend-mode: multiply; }
#lamp { background: radial-gradient(ellipse at 50% 8%, rgba(255, 214, 120, .55), rgba(255, 214, 120, 0) 55%); mix-blend-mode: screen; }
body[data-phase=dawn] #tint { opacity: .4; background: linear-gradient(#FFB0A0, #FFDCC0 60%, #FFF0E0); }
body[data-phase=dusk] #tint { opacity: .5; background: linear-gradient(#FF8A5C, #FFC28A 55%, #FFE2C4); }
body[data-phase=evening] #tint { opacity: .72; background: linear-gradient(#4A3F8F, #8A6FB8 55%, #B89AC8); }
body[data-phase=night] #tint { opacity: .86; background: linear-gradient(#121A48, #26336E 55%, #34477E); }
body[data-phase=evening] #nightsky { opacity: .45; }
body[data-phase=night] #nightsky { opacity: 1; }
body.indoor #nightsky { opacity: 0 !important; }
body.indoor[data-phase=night] #tint { opacity: .55; }
body.indoor[data-phase=evening] #tint { opacity: .4; }
body.indoor[data-phase=night] #lamp, body.indoor[data-phase=evening] #lamp { opacity: 1; }
body[data-phase=night] .sun, body[data-phase=evening] .sun { opacity: 0; }
.horsebox { transition: filter 2s; }
body[data-phase=night] .horsebox { filter: brightness(.8) saturate(.85); }
body[data-phase=evening] .horsebox { filter: brightness(.9) saturate(.95); }
body[data-phase=dusk] .horsebox { filter: sepia(.12) saturate(1.1); }
body.indoor[data-phase=night] .horsebox { filter: brightness(.92); }

</style>

// ===== Das Pferd als SVG zeichnen =====
// horseSVG(horse, opts) liefert einen SVG-String.
// horse: { breed, coat, mane, maneStyle, face, legs, eye, equip: {slot: itemId} }
// opts:  { mood: 'happy'|'ok'|'sad', clean: 0..100, pose: 'stand'|'run1'|'run2'|'jump', eyes: 'open'|'closed', anim: true }

let _hid = 0;

function hexToRgb(h) {
  h = h.replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}
// amt > 0 heller, amt < 0 dunkler
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  if (amt >= 0) return rgbToHex(r + (255 - r) * amt, g + (255 - g) * amt, b + (255 - b) * amt);
  return rgbToHex(r * (1 + amt), g * (1 + amt), b * (1 + amt));
}
function mix(a, b, t) {
  const A = hexToRgb(a), B = hexToRgb(b);
  return rgbToHex(A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, A[2] + (B[2] - A[2]) * t);
}
function lum(hex) { const [r, g, b] = hexToRgb(hex); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; }

// kleiner deterministischer Zufall (gleiche Flecken bei jedem Zeichnen)
function rng(seed) {
  let s = seed >>> 0;
  return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; };
}

const RAINBOW = ['#FF5E7E', '#FF9F43', '#FFD93D', '#6BCB77', '#4D96FF', '#9B6BFF'];

const byId = (list, id) => list.find(x => x.id === id) || list[0];

function f(n) { return Math.round(n * 10) / 10; }

function starPath(x, y, r, r2) {
  r2 = r2 || r * 0.45;
  let d = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r2;
    d += (i === 0 ? 'M' : 'L') + f(x + Math.cos(a) * rr) + ',' + f(y + Math.sin(a) * rr);
  }
  return d + 'Z';
}
function heartPath(x, y, s) {
  return `M${f(x)},${f(y + s * 0.35)} C${f(x - s * 0.1)},${f(y + s * 0.2)} ${f(x - s * 0.55)},${f(y - s * 0.05)} ${f(x - s * 0.5)},${f(y - s * 0.35)} C${f(x - s * 0.45)},${f(y - s * 0.62)} ${f(x - s * 0.08)},${f(y - s * 0.6)} ${f(x)},${f(y - s * 0.3)} C${f(x + s * 0.08)},${f(y - s * 0.6)} ${f(x + s * 0.45)},${f(y - s * 0.62)} ${f(x + s * 0.5)},${f(y - s * 0.35)} C${f(x + s * 0.55)},${f(y - s * 0.05)} ${f(x + s * 0.1)},${f(y + s * 0.2)} ${f(x)},${f(y + s * 0.35)}Z`;
}

function horseSVG(horse, opts = {}) {
  const id = 'h' + (++_hid);
  const B = byId(BREEDS, horse.breed);
  const C = byId(COATS, horse.coat);
  const mood = opts.mood || 'happy';
  const clean = opts.clean == null ? 100 : opts.clean;
  const pose = opts.pose || 'stand';
  const anim = opts.anim !== false;
  const eq = horse.equip || {};
  const item = slot => eq[slot] ? ITEMS.find(i => i.id === eq[slot]) : null;

  const G = 285;
  const body = C.body;
  const dark = lum(body) < 0.3;
  const bodyShade = shade(body, -0.18);
  const bodyLight = shade(body, 0.12);
  const maneSel = byId(MANE_COLORS, horse.mane || 'natur');
  const maneCol = maneSel.color && maneSel.color !== 'rainbow' ? maneSel.color : C.mane;
  const rainbow = maneSel.color === 'rainbow';
  const maneDark = shade(maneCol, lum(maneCol) > 0.7 ? -0.12 : -0.22);
  const eyeCol = byId(EYE_COLORS, horse.eye || 'braun').color;
  const muzzle = C.muzzle || shade(body, -0.1);

  // --- Geometrie ---
  const legLen = 72 * B.leg;
  const rx = 80 * B.len, ry = 46 * B.body;
  const cx = 158, cy = G - legLen - ry * 0.45;
  const lw = 16 * B.legW;
  const hs = B.head;
  const R = 36 * hs;
  const hx = cx + rx * 0.92 + 8, hy = cy - ry - 38;
  const mx = hx + 30 * hs, my = hy + 22 * hs, mrx = 25 * hs, mry = 20 * hs;
  const A = { x: cx + rx * 0.3, y: cy - ry * 0.86 };
  const backY = x => cy - ry * Math.sqrt(Math.max(0, 1 - Math.pow((x - cx) / rx, 2)));

  const lowerCol = C.legs || null;
  const sockH = legMark === 'stiefel' ? 50 : 28;
  const pintoLegs = C.pattern === 'pinto' && legMark === 'keine';
  const hasSock = (front, near) => {
    if (pintoLegs) return near || !front;
    if (legMark === 'socken' || legMark === 'stiefel') return true;
    if (legMark === 'vorne') return front;
    if (legMark === 'hinten') return !front;
    return false;
  };
  const white = '#F7F4EF';

  const poses = { stand: [0, 0, 0, 0], run1: [24, -16, -30, 16], run2: [-16, 22, 18, -28], jump: [40, 30, -62, -50] };
  const P = poses[pose] || poses.stand;

  function leg(x, front, near, angle) {
    const top = cy + ry * 0.15;
    const fill = near ? body : bodyShade;
    const w = lw * (front ? 0.95 : 1.05);
    const sock = hasSock(front, near);
    let lc = sock ? white : lowerCol;
    if (lc && !near) lc = shade(lc, -0.15);
    const hoof = sock || lum(body) > 0.7 ? '#9A8A7C' : '#3E322B';
    const fe = B.feather;
    let s = `<g transform="rotate(${angle} ${f(x)} ${f(top)})">`;
    // Oberschenkel etwas breiter
    s += `<path d="M${f(x - w * 0.75)},${f(top - 6)} Q${f(x - w * 0.6)},${f(top + legLen * 0.45)} ${f(x - w * 0.5)},${f(G - 22)} L${f(x - w * 0.5)},${f(G - 9)} L${f(x + w * 0.5)},${f(G - 9)} L${f(x + w * 0.5)},${f(G - 22)} Q${f(x + w * 0.6)},${f(top + legLen * 0.45)} ${f(x + w * 0.75)},${f(top - 6)} Z" fill="${fill}"/>`;
    if (lc) {
      const h = sock ? sockH * B.leg : 34 * B.leg;
      s += `<path d="M${f(x - w * 0.5)},${f(G - 9 - h)} Q${f(x)},${f(G - 13 - h)} ${f(x + w * 0.5)},${f(G - 9 - h)} L${f(x + w * 0.5)},${f(G - 9)} L${f(x - w * 0.5)},${f(G - 9)} Z" fill="${lc}"/>`;
    }
    // Huf
    s += `<path d="M${f(x - w * 0.55)},${f(G - 11)} L${f(x + w * 0.55)},${f(G - 11)} L${f(x + w * 0.66)},${f(G)} Q${f(x)},${f(G + 2)} ${f(x - w * 0.66)},${f(G)} Z" fill="${near ? hoof : shade(hoof, -0.2)}"/>`;
    // Bandagen
    const band = item('beine');
    if (band) {
      const bc = near ? band.color : shade(band.color, -0.15), bh = 30 * B.leg, by = G - 11 - bh;
      s += `<rect x="${f(x - w * 0.6)}" y="${f(by)}" width="${f(w * 1.2)}" height="${f(bh)}" rx="${f(w * 0.3)}" fill="${bc}"/>`;
      for (let k = 1; k < 4; k++) s += `<path d="M${f(x - w * 0.6)},${f(by + bh * k / 4 - 3)} L${f(x + w * 0.6)},${f(by + bh * k / 4 + 2)}" stroke="${shade(bc, -0.18)}" stroke-width="1.6"/>`;
      if (band.glitter) for (let k = 0; k < 4; k++) s += `<circle cx="${f(x - w * 0.3 + (k % 2) * w * 0.55)}" cy="${f(by + 5 + k * bh / 4.5)}" r="1.6" fill="#FFFFFF"/>`;

      const fc = near ? fc0 : shade(fc0, -0.1);
      const fh = 10 + 20 * fe, fw = w * 0.55 + 7 * fe;
      s += `<path d="M${f(x - w * 0.45)},${f(G - 8 - fh)} Q${f(x - fw - 2)},${f(G - 10)} ${f(x - fw)},${f(G - 2)} Q${f(x - fw * 0.55)},${f(G - 6)} ${f(x - fw * 0.35)},${f(G + 1)} Q${f(x - fw * 0.1)},${f(G - 5)} ${f(x + fw * 0.15)},${f(G + 1)} Q${f(x + fw * 0.4)},${f(G - 5)} ${f(x + fw * 0.65)},${f(G)} Q${f(x + fw + 2)},${f(G - 10)} ${f(x + w * 0.45)},${f(G - 8 - fh)} Z" fill="${fc}"/>`;
    }
    s += '</g>';
    return s;
  }

  // --- Schweif ---
  const T = { x: cx - rx * 0.93, y: cy - ry * (B.tailHigh ? 0.78 : 0.5) };
  const L = 108 * B.tail * (B.leg * 0.4 + 0.6);
  function tailSVG() {
    const cols = rainbow ? RAINBOW : [maneCol];
    let s = `<g class="${anim ? 'tail' : ''}">`;
    const strands = rainbow ? 6 : 3;
    for (let i = 0; i < strands; i++) {
      const c = cols[i % cols.length];
      const o = (i - (strands - 1) / 2) * (rainbow ? 4 : 7);
      const tipX = T.x - 22 + o * 0.8 - (B.tailHigh ? 8 : 0), tipY = T.y + L + Math.abs(o) * -0.6;
      s += `<path d="M${f(T.x + 6)},${f(T.y - 4)} C${f(T.x - 26 + o)},${f(T.y - 6 - (B.tailHigh ? 14 : 0))} ${f(T.x - 36 + o)},${f(T.y + L * 0.45)} ${f(tipX)},${f(tipY)} C${f(T.x - 12 + o)},${f(T.y + L * 0.78)} ${f(T.x - 2 + o * 0.5)},${f(T.y + L * 0.42)} ${f(T.x + 9)},${f(T.y + 10)} Z" fill="${i === 0 && !rainbow ? maneDark : c}"/>`;
    }
    if (!rainbow) s += `<path d="M${f(T.x - 4)},${f(T.y + 6)} C${f(T.x - 22)},${f(T.y + L * 0.3)} ${f(T.x - 24)},${f(T.y + L * 0.6)} ${f(T.x - 20)},${f(T.y + L * 0.85)}" stroke="${shade(maneCol, 0.25)}" stroke-width="2.2" fill="none" stroke-linecap="round" opacity=".7"/>`;
    const tb = item('schweif');
    if (tb) s += bowAt(T.x - 6, T.y + 14, tb.color, 30);
    s += '</g>';
    return s;
  }

  // --- Mähne ---
  function bez(p0, p1, p2, t) {
    const u = 1 - t;
    return { x: u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x, y: u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y };
  }
  const M0 = { x: hx - R * 0.42, y: hy - R * 0.85 }, M1 = { x: A.x + 4, y: hy + 6 }, M2 = { x: A.x - 10, y: A.y + 8 };
  function maneSVG() {
    const style = horse.maneStyle || 'offen';
    const N = 8;
    let back = '', front = '';
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      const p = bez(M0, M1, M2, t);
      const c = rainbow ? RAINBOW[i % RAINBOW.length] : maneCol;
      const r = (12.5 - t * 3) * Math.min(1.35, B.mane);
      if (style === 'zoepfe') {
        back += `<circle cx="${f(p.x - 4)}" cy="${f(p.y)}" r="${f(r * 0.62)}" fill="${c}"/>`;
        back += `<path d="M${f(p.x - 4 - r * 0.5)},${f(p.y + r * 0.35)} L${f(p.x - 4 + r * 0.5)},${f(p.y + r * 0.35)}" stroke="${shade(c, -0.25)}" stroke-width="2"/>`;
      } else {
        back += `<circle cx="${f(p.x - r * 0.35)}" cy="${f(p.y - r * 0.15)}" r="${f(r)}" fill="${rainbow ? c : maneDark}"/>`;
      }
    }
    if (style !== 'zoepfe') {
      for (let i = 0; i < N; i++) {
        const t = i / (N - 1);
        const p = bez(M0, M1, M2, t);
        const c = rainbow ? RAINBOW[i % RAINBOW.length] : maneCol;
        const len = (B.longMane ? 44 : 20) * B.mane * (1 - t * 0.35);
        const w = 10 * Math.min(1.3, B.mane);
        if (style === 'lockig') {
          for (let k = 0; k < 3; k++) {
            front += `<circle cx="${f(p.x + 2 + k * 3)}" cy="${f(p.y + k * len * 0.32)}" r="${f(w * (0.85 - k * 0.12))}" fill="${c}"/>`;
            front += `<path d="M${f(p.x - 2 + k * 3)},${f(p.y + k * len * 0.32)} a4,4 0 1,0 7,0" stroke="${shade(c, -0.2)}" stroke-width="1.6" fill="none"/>`;
          }
        } else {
          front += `<path d="M${f(p.x - w)},${f(p.y - 4)} Q${f(p.x - w * 0.6)},${f(p.y + len * 0.6)} ${f(p.x + 6)},${f(p.y + len)} Q${f(p.x + w * 0.9)},${f(p.y + len * 0.45)} ${f(p.x + w)},${f(p.y - 6)} Z" fill="${c}"/>`;
        }
      }
      if (!rainbow) {
        const p = bez(M0, M1, M2, 0.45);
        front += `<path d="M${f(p.x - 2)},${f(p.y)} q4,10 6,${f(14 * B.mane)}" stroke="${shade(maneCol, 0.3)}" stroke-width="2" fill="none" stroke-linecap="round" opacity=".6"/>`;
      }
    }
    return { back, front };
  }
  function forelockSVG() {
    const style = horse.maneStyle || 'offen';
    const fx = hx - R * 0.25, fy = hy - R * 0.92;
    let s = '';
    const n = 3;
    for (let i = 0; i < n; i++) {
      const c = rainbow ? RAINBOW[(i * 2) % 6] : (i === 1 ? shade(maneCol, 0.08) : maneCol);
      const ox = i * 7 - 6, len = 20 * Math.min(1.3, B.mane) + (style === 'lockig' ? -4 : 0);
      if (style === 'lockig') {
        s += `<circle cx="${f(fx + ox + 4)}" cy="${f(fy + 8)}" r="${f(8 * Math.min(1.3, B.mane))}" fill="${c}"/>`;
      } else {
        s += `<path d="M${f(fx + ox - 8)},${f(fy)} Q${f(fx + ox + 2)},${f(fy + len * 0.5)} ${f(fx + ox + 14)},${f(fy + len)} Q${f(fx + ox + 10)},${f(fy + len * 0.35)} ${f(fx + ox + 8)},${f(fy - 3)} Z" fill="${c}"/>`;
      }
    }
    return s;
  }

  // --- Ohren ---
  const earRot = { happy: [-4, -16], ok: [-18, -30], sad: [-68, -78] }[mood] || [-10, -20];
  function ear(x, y, rot, near) {
    const fill = near ? body : bodyShade;
    const inner = dark ? shade(body, 0.28) : mix(body, '#F2A8A0', 0.55);
    const s = hs * 1.05;
    return `<g transform="translate(${f(x)} ${f(y)}) rotate(${rot}) scale(${f(s)})"><g class="${anim && near ? 'ear' : ''}">` +
      `<path d="M-9,4 Q-10,-22 0,-32 Q10,-22 9,4 Z" fill="${fill}"/>` +
      `<path d="M-4.5,1 Q-5,-15 0,-23 Q5,-15 4.5,1 Z" fill="${inner}"/></g></g>`;
  }

  // --- Abzeichen im Gesicht ---
  function faceMark() {
    const m = horse.face || 'keins';
    if (m === 'stern') return `<path d="${starPath(hx + 6 * hs, hy - R * 0.5, 7 * hs, 3.2 * hs)}" fill="${white}"/>`;
    if (m === 'flocke') return `<ellipse cx="${f(mx + mrx * 0.45)}" cy="${f(my - mry * 0.15)}" rx="${f(6 * hs)}" ry="${f(4 * hs)}" fill="${white}"/>`;
    if (m === 'blesse' || m === 'laterne') {
      const w = (m === 'blesse' ? 9 : 22) * hs;
      return `<path d="M${f(hx + 4 * hs)},${f(hy - R * 0.85)} Q${f(hx + 16 * hs)},${f(hy + 2)} ${f(mx + mrx * 0.55)},${f(my + mry * 0.2)}" stroke="${white}" stroke-width="${f(w)}" stroke-linecap="round" fill="none"/>`;
    }

  // --- Fellmuster ---
  function pattern() {
    const r = rng(7);
    let s = '';
    if (C.pattern === 'pinto') {

  const scale = B.scale;
  horseSVG.geo = { hx, hy, R, cx, cy, rx, ry, scale, mx, my, T, A, G, legLen };

  s += `</g>`; // headgrp
  if (clean >= 92) s += `<path d="${starPath(cx + rx * 0.2, cy - ry * 0.55, 6, 1.8)}" fill="#FFFFFF" opacity=".9"/>`;
  s += `</g></g>`;
  s += aura();
  s += '</svg>';
  return s;
}

// ---------- Cloud-Sicherung (nur wenn als Claude-Artefakt geöffnet, sonst ohne Wirkung) ----------
// Browser löschen den Speicher eingebetteter Seiten oft beim Schließen des Tabs.
// Darum wird der Spielstand dort zusätzlich im eigenen Claude-Konto gesichert (privat).
const Cloud = {
  doc: null, db: null, ok: false, t: 0, busy: false, again: false, lastJson: '', connecting: null,
  available() { return !!(window.claude && window.claude.use); },
  // Verbinden und gespeicherten Stand holen. Liefert den Stand oder null.
  connect() { if (!this.connecting) this.connecting = this._connect(); return this.connecting; },
  async _connect() {
    if (!this.available()) return null;
    try {
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      if (!db || !user) return null;
      const id = await user.id();
      if (!id) return null;
      this.db = db;
      this.doc = db.collection('data/users/' + id).doc('spielstand');
      const snap = await this.doc.get();
      this.ok = true;
      const d = snap && snap.exists ? snap.data() : null;
      if (d && typeof d.json === 'string') { this.lastJson = d.json; const st = JSON.parse(d.json); if (st && st.v) return st; }
    } catch (e) { this.doc = null; this.ok = false; }
    return null;
  },
  push(now) {
    if (!this.doc || !S || !S.horse) return;
    clearTimeout(this.t);
    if (now) this.write(); else this.t = setTimeout(() => this.write(), 1200);
  },
  async write() {
    if (!this.doc) return;
    if (this.busy) { this.again = true; return; }
    const json = JSON.stringify(S);
    if (json === this.lastJson) return;
    this.busy = true;
    try {
      await this.doc.set({ json, last: S.last || Date.now() });
      this.lastJson = json;
      const key = nameKey(S.horse.name);
      if (this.db && key) await this.db.doc('pferde/' + key).set({ json, last: S.last || Date.now(), name: S.horse.name });
    }
    catch (e) { if (e && (e.code === 'revoked' || e.code === 'invalid_argument' || e.code === 'not_granted')) this.doc = null; }
    this.busy = false;
    if (this.again) { this.again = false; this.write(); }
  },
};
// Schlüssel aus dem Pferdenamen: „Sternchen“ → sternchen, „Müsli Maus“ → muesli-maus
function nameKey(n) {
  const k = String(n || '').toLowerCase().replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
  return k || null;
}
// Pferd nach Namen in der Cloud suchen
async function findByName(name) {
  const key = nameKey(name);
  if (!key || !Cloud.available()) return null;
  await Promise.race([Cloud.connect(), new Promise(r => setTimeout(r, 8000))]);
  if (!Cloud.db) return null;
  try {
    const snap = await Cloud.db.doc('pferde/' + key).get();
    const d = snap && snap.exists ? snap.data() : null;
    if (d && typeof d.json === 'string') { const st = JSON.parse(d.json); if (st && st.horse) return st; }
  } catch (e) { }
  return null;
}
// Wo läuft das Spiel gerade?
function runMode() {
  if (Cloud.available()) return 'claude';
  if (location.protocol === 'file:') return 'android';
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) return 'homescreen';
  return 'browser';
}
const RUN_NAMES = { android: 'Android-App', claude: 'Claude-Link', homescreen: 'Home-Bildschirm-App', browser: 'Browser-Tab' };
// Liest den Stand aus der Cloud, mit Zeitlimit; übernimmt ihn, wenn er neuer ist
async function syncFromCloud(maxMs) {
  if (!Cloud.available()) return false;
  const remote = await Promise.race([Cloud.connect(), new Promise(r => setTimeout(() => r('timeout'), maxMs))]);
  if (!remote || remote === 'timeout' || !remote.horse) return false;
  if (S.horse && (remote.last || 0) <= (S.last || 0)) return false;
  S = Object.assign(defaultState(), remote);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  return true;
}
// Balken sinken mit der Zeit (sanft: nie unter FLOOR)
function applyDecay() {
  const now = Date.now();
  const hrs = Math.max(0, (now - (S.last || now)) / 3600000);
  S.last = now;
  if (!S.horse || hrs <= 0) return;
  for (const k of ['hunger', 'fun', 'clean']) {
    const v = S.stats[k];
    if (v > FLOOR) S.stats[k] = Math.max(FLOOR, v - DECAY[k] * hrs);
  }
}
function moodOf() {
  const { hunger, fun, clean } = S.stats;
  const min = Math.min(hunger, fun, clean), avg = (hunger + fun + clean) / 3;
  if (min < 25 || avg < 38) return 'sad';
  if (avg >= 62 && min >= 40) return 'happy';
  return 'ok';
}

  if (h >= 19.75) return 'evening';
  if (h >= 18) return 'dusk';
  return 'day';
}

// ---------- Ton ----------
const Snd = {
  ctx: null,
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  },
  tone(freq, dur, type = 'sine', vol = 0.15, slide = 0, delay = 0) {
    const c = this.ctx; if (!c || !S.sound) return;
    const t = c.currentTime + delay, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol = 0.12, f1 = 1200, f2 = 0, type = 'bandpass', delay = 0) {
    const c = this.ctx; if (!c || !S.sound) return;
    const t = c.currentTime + delay, len = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const flt = c.createBiquadFilter(); flt.type = type; flt.frequency.setValueAtTime(f1, t); if (f2) flt.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(flt).connect(g).connect(c.destination); src.start(t); src.stop(t + dur);
  },
  play(name) {
    if (!this.ctx || !S.sound) return;
    switch (name) {
      case 'coin': this.tone(988, 0.08, 'square', 0.07); this.tone(1319, 0.18, 'square', 0.07, 0, 0.07); break;
      case 'pop': this.tone(520, 0.1, 'sine', 0.18, 500); break;
      case 'click': this.tone(700, 0.05, 'triangle', 0.08); break;
      case 'eat': for (let i = 0; i < 3; i++) this.noise(0.07, 0.2, 900, 0, 'lowpass', i * 0.16); break;
      case 'splash': this.noise(0.35, 0.12, 2500, 600, 'bandpass'); break;
      case 'brush': this.noise(0.12, 0.05, 4000, 2500, 'highpass'); break;
      case 'jump': this.tone(300, 0.22, 'sine', 0.16, 500); break;
      case 'hurt': this.tone(220, 0.25, 'square', 0.08, -130); break;
      case 'nope': this.tone(330, 0.12, 'triangle', 0.1); this.tone(260, 0.18, 'triangle', 0.1, 0, 0.13); break;
      case 'win': [523, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.22, 'triangle', 0.14, 0, i * 0.11)); break;
      case 'flip': this.tone(880, 0.06, 'sine', 0.08, 200); break;
      case 'sparkle': [1568, 2093, 2637, 3136].forEach((f, i) => this.tone(f, 0.12, 'sine', 0.05, 0, i * 0.06)); break;
      case 'neigh': {
        const c = this.ctx, t = c.currentTime, o = c.createOscillator(), lfo = c.createOscillator(), lg = c.createGain(), g = c.createGain(), flt = c.createBiquadFilter();
        o.type = 'sawtooth'; o.frequency.setValueAtTime(620, t); o.frequency.linearRampToValueAtTime(900, t + 0.15); o.frequency.exponentialRampToValueAtTime(380, t + 1.0);
        lfo.frequency.value = 16; lg.gain.value = 55; lfo.connect(lg).connect(o.frequency);
        flt.type = 'lowpass'; flt.frequency.value = 2200;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.09, t + 0.06); g.gain.setValueAtTime(0.09, t + 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + 1.05);
        o.connect(flt).connect(g).connect(c.destination); o.start(t); lfo.start(t); o.stop(t + 1.1); lfo.stop(t + 1.1);
        break;
      }
    }
  },
};

function setupSwipe() {
  const tr = $('#track');
  let sx = 0, sy = 0, dx = 0, mode = null, id = null, t0 = 0;
  tr.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-noswipe]')) return;
    sx = e.clientX; sy = e.clientY; dx = 0; mode = 'wait'; id = e.pointerId; t0 = performance.now();
  });
  tr.addEventListener('pointermove', e => {
    if (e.pointerId !== id || !mode) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (mode === 'wait') {
      if (Math.abs(mx) > 12 && Math.abs(mx) > Math.abs(my) * 1.2) { mode = 'drag'; tr.classList.add('dragging'); try { tr.setPointerCapture(id); } catch (err) { } }
      else if (Math.abs(my) > 12) { mode = null; return; }
    }
    if (mode === 'drag') {

      if ((panel === 0 && dx > 0) || (panel === 2 && dx < 0)) dx *= 0.3;
      tr.style.transform = `translateX(calc(${-panel * 33.3334}% + ${dx}px))`;
    }
  });
  const end = e => {

    if (mode === 'drag') {

      const v = dx / Math.max(1, performance.now() - t0);
      const w = tr.parentElement.getBoundingClientRect().width;
      if (dx < -w * 0.2 || v < -0.5) goPanel(panel + 1);
      else if (dx > w * 0.2 || v > 0.5) goPanel(panel - 1);
      else goPanel(panel);
      suppressClick = true; setTimeout(() => suppressClick = false, 50);

}

        fx('spark', e.clientX, e.clientY, Math.random() < 0.5 ? '✦' : '·', { '--dx': (Math.random() * 40 - 20) + 'px', '--dy': (-10 - Math.random() * 30) + 'px', color: gold ? '#FFC107' : up.id === 'buerste_weich' ? '#8FC8FF' : '#FFD43B' });
        if (gold && Math.random() < 0.2) Snd.play('sparkle'); else Snd.play('brush');
        gainClean(0.6 * pw, 0.35 * pw);
      }
    }
  });
  const up = e => {
    if (!down) return;
    down = false;
    if (tool === 'hand' && moved < 14) pet(e.clientX, e.clientY);
  };

  box.addEventListener('pointercancel', () => down = false);
}
let cleanMsgT = 0;
function gainClean(c, f) {
  const before = S.stats.clean;
  S.stats.clean = clamp(S.stats.clean + c, 0, 100);
  if (f && S.stats.fun < 90) S.stats.fun = clamp(S.stats.fun + f, 0, 100);
  if (before < 100 && S.stats.clean >= 100) { say('Blitzeblank! ✨ Danke!'); Snd.play('sparkle'); views.center.anim('hop', 800); }
  else if (S.stats.clean >= 100 && Date.now() - cleanMsgT > 4000) { cleanMsgT = Date.now(); say('Ich bin schon ganz sauber! 😊', 1800); }
  save(); renderBars(); refreshHorses();
}
function pet(x, y) {
  const now = Date.now();
  while (petLog.length && now - petLog[0] > 60000) petLog.shift();
  petLog.push(now);
  for (let i = 0; i < 3; i++) setTimeout(() => fx('heart', x + (Math.random() * 30 - 15), y, ['💖', '💕', '💗'][i], { '--dx': (Math.random() * 50 - 25) + 'px' }), i * 120);
  views.center.closeEyes(800);
  const pw = toolPower('hand');
  if (petLog.length > 14 + Math.round(pw * 4)) { say('Genug geknuddelt! 😄', 1600); return; }
  change({ fun: Math.round(3 * pw) });
  Snd.play('pop');
  if (Math.random() < 0.25) { Snd.play('neigh'); views.center.anim('hop', 750); }
  if (Math.random() < 0.3) say(['Hihi! 😊', 'Das ist schön!', 'Mehr! 💕', 'Kraul weiter!'][Math.floor(Math.random() * 4)], 1500);
}

function itemPreview(it) {
  // Mini-Pferd nur mit diesem Teil, auf die passende Stelle gezoomt
  const h = Object.assign({}, S.horse, { equip: { [it.slot]: it.id } });
  let svg = horseSVG(h, { anim: false, mood: 'happy' });
  const g = horseSVG.geo;
  const T = (x, y) => [170 + (x - 170) * g.scale, 285 + (y - 285) * g.scale];
  let vb;
  if (it.slot === 'ruecken') { const [x, y] = T(g.cx - g.rx * 1.05, g.cy - g.ry * 1.5); vb = [x, y, g.rx * 2.1 * g.scale, g.ry * 2.4 * g.scale]; }
  else if (it.slot === 'aura') vb = [0, -40, 340, 340];
  else if (it.slot === 'beine') { const [x, y] = T(g.cx - g.rx * 1.0, g.G - g.legLen * 1.1); vb = [x, y, g.rx * 2.1 * g.scale, g.legLen * 1.25 * g.scale]; }
  else if (it.slot === 'schweif') { const [x, y] = T(g.T.x - 50, g.T.y - 25); vb = [x, y, 90 * g.scale, 90 * g.scale]; }
  else if (it.slot === 'hals') { const [x, y] = T(g.A.x - 25, g.A.y - 25); vb = [x, y, (g.cx + g.rx * 1.1 - g.A.x + 35) * g.scale, (g.cx + g.rx * 1.1 - g.A.x + 35) * g.scale]; }
  else { const top = it.id === 'horn' ? 2.2 : it.slot === 'kopf' ? 1.75 : 1.25; const [x, y] = T(g.hx - g.R * 1.25, g.hy - g.R * top); const sz = g.R * (top + 1.9) * g.scale; vb = [x, y, sz, sz]; }
  return svg.replace('viewBox="0 -60 340 360"', `viewBox="${vb.map(n => n.toFixed(1)).join(' ')}"`);
}

function exportCode() {
  const json = JSON.stringify(S);
  return 'PFERD1:' + btoa(unescape(encodeURIComponent(json)));
}
function importCode(code) {
  code = String(code || '');
  const i = code.indexOf('PFERD1:');
  const parts = (i >= 0 ? code.slice(i + 7) : code).split(/\s+/).map(t => t.replace(/[^A-Za-z0-9+/=]/g, '')).filter(Boolean);
  // Teile nacheinander zusammensetzen, bis ein gültiger Spielstand herauskommt (Text drumherum stört so nicht)
  let acc = '';
  for (const t of parts) {
    acc += t;
    let b = acc.replace(/=+$/, ''); while (b.length % 4) b += '=';
    try { const st = JSON.parse(decodeURIComponent(escape(atob(b)))); if (st && st.v && st.horse) return st; } catch (e) { }
  }
  return null;
}

// ===== Minispiele =====

const Games = (() => {
  let cur = null;      // laufendes Spiel { id, stop(), running }
  let raf = 0;

  const area = () => $('#garea');
  function hud(score, extra) {
    $('#gScore').innerHTML = score;
    $('#gExtra').innerHTML = extra;
  }
  function makeCanvas() {
    const a = area(), c = document.createElement('canvas');
    a.appendChild(c);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = a.clientWidth, H = a.clientHeight;
    c.width = W * dpr; c.height = H * dpr;
    const ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { c, ctx, W, H };
  }
  const imgCache = {};
  function horseImg(pose, flip) {
    const k = JSON.stringify([S.horse, pose, Math.round(S.stats.clean / 10)]);
    if (imgCache[k]) return imgCache[k];
    const img = new Image();
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(horseSVG(S.horse, { pose, anim: false, mood: 'happy', clean: S.stats.clean }));
    imgCache[k] = img;
    return img;
  }
  // Pferd zeichnen: x = linke Kante, gy = Boden, w = Breite
  function drawHorse(ctx, img, x, gy, w, flip, rot) {
    const h = w * 360 / 340, top = gy - h * (345 / 360);
    ctx.save();
    if (flip || rot) {
      ctx.translate(x + w / 2, gy - h * 0.3);
      if (rot) ctx.rotate(rot);
      if (flip) ctx.scale(-1, 1);
      ctx.translate(-(x + w / 2), -(gy - h * 0.3));
    }
    if (img.complete && img.naturalWidth) ctx.drawImage(img, x, top, w, h);
    ctx.restore();
  }
  function emoji(ctx, ch, x, y, size) {
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, x, y);
  }
  function sky(ctx, W, H, t, a = '#7CC7F2', b = '#DDF3FF') {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, a); g.addColorStop(1, b);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  function cloud(ctx, x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.ellipse(x, y, 34 * s, 14 * s, 0, 0, 7); ctx.arc(x - 14 * s, y - 7 * s, 14 * s, 0, 7); ctx.arc(x + 10 * s, y - 12 * s, 18 * s, 0, 7); ctx.fill();
  }

  // ---------- Rahmen ----------
  function open(id) {
    const g = GAMES.find(x => x.id === id);
    Snd.play('click');
    closeShop();
    $('#game').classList.remove('hidden');
    $('#gTitle').textContent = g.icon + ' ' + g.name;
    area().innerHTML = '';
    area().style.background = '';
    hud('', '');
    startScreen(g);
  }
  function startScreen(g) {
    const a = area();
    let extra = '';
    if (g.id === 'memory') extra = `<div class="row" style="flex-direction:column"><button class="btn" data-diff="6">Leicht · 12 Karten</button><button class="btn pri" data-diff="8">Mittel · 16 Karten</button><button class="btn" data-diff="10">Schwer · 20 Karten</button></div>`;
    else extra = `<div class="row"><button class="btn pri" data-go="1">Los geht's!</button></div>`;
    const hint = { rennen: 'Tippe ganz schnell abwechselnd auf den linken und rechten Huf. Zweimal dieselbe Seite bremst!', werfen: 'Tippe, wenn die Kraft-Anzeige richtig steht. Trifft das Hufeisen den Pflock, gibt es 3 Punkte. 10 Würfe.', simon: 'Schau genau hin, welches Futter nacheinander leuchtet. Tippe es danach in derselben Reihenfolge an. Jede Runde kommt eins dazu.', quiz: '10 Fragen rund ums Pferd. Für jede richtige Antwort gibt es 2 Münzen.', springen: 'Tippe irgendwo auf den Bildschirm, damit dein Pferd springt. Sammle die Münzen in der Luft! Du hast 3 Herzen.', aepfel: 'Bewege dein Pferd mit dem Finger nach links und rechts. Fange 🍎 🥕 und ⭐ – aber keine 🐝 und 💩!', memory: 'Decke immer zwei Karten auf und finde alle Paare. Je weniger Züge, desto mehr Münzen!', karotten: 'Tippe schnell auf jede 🥕 und ⭐. Aber Vorsicht vor den 🐝 – die geben Minuspunkte!' }[g.id];
    a.insertAdjacentHTML('beforeend', `<div class="gover"><div class="gbox"><div class="emoji">${g.icon}</div><h2>${g.name}</h2><p>${hint}</p>${extra}</div></div>`);
    a.querySelector('.gover').onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      Snd.play('click');
      a.innerHTML = '';
      const games = { springen: Jump, aepfel: Catch, memory: Memory, karotten: Whack, rennen: Race, werfen: Throw, simon: Simon, quiz: Quiz };
      cur = games[g.id](b.dataset.diff ? +b.dataset.diff : 0);
      cur.id = g.id; cur.running = true;
    };
  }
  function finish(id, score, coins, text) {
    if (!cur) return;
    cur.running = false; cancelAnimationFrame(raf); cur.stop && cur.stop();
    let rec = false;
    if (id === 'memory') { if (coins > (S.best.memory || 0)) { S.best.memory = coins; rec = coins > 0; } }
    else if (id === 'rennen') { if (score === 1) { S.best.rennenSiege = (S.best.rennenSiege || 0) + 1; } }
    else if (score > (S.best[id] || 0)) { S.best[id] = score; rec = score > 0; }
    S.gamesPlayed++;
    // Spielen macht Spaß, aber hungrig (und draußen schmutzig)
    const dirty = ['springen', 'aepfel', 'rennen', 'werfen'].includes(id);
    S.stats.fun = clamp(S.stats.fun + 14, 0, 100);
    S.stats.hunger = clamp(S.stats.hunger - 5, 0, 100);

  // ---------- 1. Springreiten ----------
  function Jump() {

      ctx.fillRect(o.x + o.w - 3 * k, gy - o.h - 8 * k, 7 * k, o.h + 8 * k);
      const rails = o.type === 'high' ? 3 : 2;
      for (let i = 0; i < rails; i++) {
        const ry = gy - o.h + i * (o.h / rails);
        ctx.fillStyle = rail; ctx.fillRect(o.x - 6 * k, ry, o.w + 12 * k, 7 * k);
        ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(o.x - 6 * k, ry + 5 * k, o.w + 12 * k, 2 * k);
        if (rail === '#FFFFFF') { ctx.fillStyle = '#E5484D'; for (let s = 0; s < o.w + 12 * k; s += 14 * k) ctx.fillRect(o.x - 6 * k + s, ry, 7 * k, 7 * k); }

      // Hitbox Pferd (Beine/Körper)

  // ---------- 2. Äpfel fangen ----------
  function Catch() {

    const items = [], parts = [];

    const kinds = [
      { ch: '🍎', p: 1, w: 34 }, { ch: '🥕', p: 1, w: 28 }, { ch: '🍏', p: 1, w: 10 }, { ch: '⭐', p: 5, w: 6 },
      { ch: '🐝', p: -1, w: 12 }, { ch: '💩', p: -1, w: 10 },

      t += dt; timeLeft -= dt;

      const prev = x; x += (tx - x) * Math.min(1, dt * 12);
      const vx = (x - prev) / Math.max(dt, 0.001);

      ft += dt; if (ft > 0.1) { ft = 0; frame ^= 1; }
      const lvl = 1 + t / 25;
      spawnT -= dt;
      if (spawnT <= 0) { spawnT = Math.max(0.32, 0.95 / lvl) * (0.7 + Math.random() * 0.6); const k = pick(); items.push({ k, x: 20 + Math.random() * (W - 40), y: -30, v: H * (0.22 + Math.random() * 0.12) * lvl, rot: Math.random() * 6 }); }

        }

      hud('🍎 ' + score, '❤️'.repeat(Math.max(0, lives)) + '🤍'.repeat(3 - Math.max(0, lives)) + ' ⏱ ' + Math.max(0, Math.ceil(timeLeft)));

  // ---------- 3. Hufeisen-Memory ----------
  function Memory(pairs) {
    const a = area();
    a.style.background = 'linear-gradient(180deg,#E9DDFF,#FFE3F1)';
    const pool = ['🐴', '🦄', '🥕', '🍎', '🏆', '🎀', '⭐', '🌻', '🍀', '🌈'];
    const cards = shuffle(pool.slice(0, pairs).flatMap(e => [e, e]));
    const cols = pairs === 6 ? 3 : 4, rows = cards.length / cols;
    const W = a.clientWidth - 20, H = a.clientHeight - 20, gap = 8;
    const cw = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * 0.8, 120), ch = cw * 1.25;
    const shoe = `<svg width="60%" height="60%" viewBox="0 0 40 40"><path d="M8,6 C2,22 8,36 20,36 C32,36 38,22 32,6" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/><g fill="#B07CFF"><circle cx="8" cy="18" r="1.6"/><circle cx="11" cy="28" r="1.6"/><circle cx="32" cy="18" r="1.6"/><circle cx="29" cy="28" r="1.6"/></g></svg>`;
    a.innerHTML = `<div class="memgrid" style="grid-template-columns:repeat(${cols},${cw}px);grid-auto-rows:${ch}px">${cards.map((e, i) => `<div class="mcard" data-i="${i}"><div class="in"><div class="ba">${shoe}</div><div class="fa" style="font-size:${cw * 0.5}px">${e}</div></div></div>`).join('')}</div>`;
    let open = [], moves = 0, found = 0, lock = false, t0 = performance.now();
    const upd = () => hud('🔄 ' + moves, '✅ ' + found + '/' + pairs);
    upd();
    const timer = setInterval(() => { if (cur && !cur.paused) $('#gExtra').innerHTML = '✅ ' + found + '/' + pairs + ' ⏱ ' + Math.floor((performance.now() - t0) / 1000); }, 500);
    a.onclick = e => {
      const el = e.target.closest('.mcard');
      if (!el || lock || el.classList.contains('up') || el.classList.contains('done')) return;
      el.classList.add('up'); Snd.play('flip'); open.push(el);
      if (open.length === 2) {
        moves++; upd();
        const [x, y] = open;
        if (cards[x.dataset.i] === cards[y.dataset.i]) {
          setTimeout(() => { x.classList.add('done'); y.classList.add('done'); Snd.play('coin'); }, 300);
          open = []; found++; upd();
          if (found === pairs) {
            const secs = Math.round((performance.now() - t0) / 1000);
            const coins = pairs + Math.max(0, pairs * 3 - moves);
            setTimeout(() => finish('memory', moves, coins, `Alle ${pairs} Paare in ${moves} Zügen (${secs} Sek.)`), 800);
          }
        } else {

        }
      }
    };
    return { stop() { clearInterval(timer); a.onclick = null; } };
  }

      { name: 'Donner', horse: { breed: 'warmblut', coat: 'rappe', mane: 'natur', face: 'blesse', legs: 'socken', equip: { halfter: 'halfter_gruen' } }, speed: 0, pos: 0, skill: 0.85 + Math.random() * 0.12 },
    ];
    const mk = (h, pose) => { const img = new Image(); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(horseSVG(h, { pose, anim: false })); return img; };
    rivals.forEach(r => { r.imgs = [mk(r.horse, 'run1'), mk(r.horse, 'run2')]; r.stand = mk(r.horse, 'stand'); });
    const me = { name: S.horse.name, pos: 0, speed: 0, imgs: [horseImg('run1'), horseImg('run2')], stand: horseImg('stand') };
    let t = -3, last = '', frame = 0, ft = 0, done = false, place = 0, finishOrder = [];
    const LEN = 1; // Strecke 0..1
    const tap = e => {
      const b = e.target.closest('[data-k]'); if (!b) return;
      e.preventDefault();
      if (t < 0 || done) return;
      const k = b.dataset.k;
      b.animate([{ transform: 'scale(.92)' }, { transform: 'none' }], { duration: 120 });
      if (k !== last) { me.speed = Math.min(0.2, me.speed + 0.017); Snd.play('click'); }
      else me.speed *= 0.7;
      last = k;
    };
    bar.addEventListener('pointerdown', tap);
    hud('🥇🥈🥉', '');
    loop(dt => {
      const prevT = t; t += dt;
      if (prevT < 0 && Math.floor(prevT) !== Math.floor(t)) Snd.play(t >= 0 ? 'win' : 'pop');
      if (t >= 0 && !done) {
        me.speed *= Math.pow(0.55, dt); me.pos += me.speed * dt;
        rivals.forEach(r => {
          const target = 0.085 * r.skill + (me.pos - r.pos) * 0.05;
          r.speed += (Math.max(0.05, target) - r.speed) * dt * 1.5 + (Math.random() - 0.5) * 0.01;
          r.pos += r.speed * dt;
        });
        [me, ...rivals].forEach(h => { if (h.pos >= LEN && !finishOrder.includes(h)) finishOrder.push(h); });
        if (finishOrder.includes(me) && !done) {
          done = true; place = finishOrder.indexOf(me) + 1;
          const coins = [0, 16, 9, 4][place];
          cur.paused = true;
          setTimeout(() => finish('rennen', place, coins, place === 1 ? `🥇 ${S.horse.name} hat gewonnen! Zeit: ${t.toFixed(1)} Sek.` : `Platz ${place} · Zeit: ${t.toFixed(1)} Sek.`), 700);
        }
      }
      ft += dt; if (ft > 0.1) { ft = 0; frame ^= 1; }
      // Zeichnen
      sky(ctx, W, H, t, '#8FD3FF', '#E9F8FF');
      cloud(ctx, W * 0.2, H * 0.07, 0.8); cloud(ctx, W * 0.75, H * 0.11, 0.7);
      ctx.fillStyle = '#7CC96B'; ctx.fillRect(0, trackTop - 20, W, H);
      const x0 = W * 0.04, x1 = W - hw - W * 0.02;
      for (let i = 0; i < 3; i++) {
        const y = trackTop + i * lane;
        ctx.fillStyle = i % 2 ? '#D9B47A' : '#E3C08A'; ctx.fillRect(0, y, W, lane);
        ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(0, y, W, 3);
      }
      // Ziellinie
      const fx0 = x1 + hw * 0.85;
      for (let yy = trackTop; yy < trackTop + trackH; yy += 10) for (let k = 0; k < 2; k++) { ctx.fillStyle = ((yy / 10 + k) % 2) ? '#222' : '#fff'; ctx.fillRect(fx0 + k * 8, yy, 8, 10); }
      const all = [rivals[0], me, rivals[1]];
      all.forEach((h, i) => {
        const gy = trackTop + (i + 1) * lane - 6;
        const x = x0 + (x1 - x0) * Math.min(1, h.pos);
        const moving = t >= 0 && (h.speed > 0.01) && h.pos < LEN;
        drawHorse(ctx, moving ? h.imgs[frame ^ (i % 2)] : h.stand, x, gy, hw);
        ctx.font = `800 ${Math.round(Math.max(12, lane * 0.13))}px ui-rounded,system-ui`; ctx.textAlign = 'left';
        ctx.fillStyle = h === me ? '#E04F88' : '#3A2D4A';
        ctx.fillText((h === me ? '⭐ ' : '') + h.name, 8, trackTop + i * lane + lane * 0.2);
        const fp = finishOrder.indexOf(h);
        if (fp >= 0) { ctx.textAlign = 'right'; ctx.fillText(['🥇', '🥈', '🥉'][fp], W - 8, trackTop + i * lane + lane * 0.2); }
      });
      if (t < 0.6) {
        const txt = t < 0 ? String(Math.ceil(-t)) : 'Los!';
        ctx.font = `900 ${Math.round(W * 0.2)}px ui-rounded,system-ui`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 6;
        ctx.strokeText(txt, W / 2, trackTop + trackH * 0.45); ctx.fillText(txt, W / 2, trackTop + trackH * 0.45);
      }
      const pct = Math.round(Math.min(1, me.pos) * 100);
      $('#gExtra').innerHTML = '🐴 ' + pct + '%';
    });
    return { stop() { bar.removeEventListener('pointerdown', tap); } };
  }

  // ---------- 6. Hufeisenwerfen ----------
  function Throw() {
    const { c, ctx, W, H } = makeCanvas();
    const gy = H * 0.72, startX = W * 0.1, maxD = W * 0.85;
    let pegX = 0, power = 0, dir = 1, state = 'aim', throws = 0, score = 0, shoe = null, msg = '', msgT = 0, t = 0, meterSpeed = 1.1;
    const horse = horseImg('stand'), hw = Math.min(W * 0.3, H * 0.25);
    const newPeg = () => { pegX = startX + maxD * (0.35 + Math.random() * 0.6); };
    newPeg();
    hud('🎯 0', 'Wurf 1/10');
    const press = e => {
      e.preventDefault();
      if (state !== 'aim' || cur.paused) return;
      state = 'fly'; throws++;
      const target = startX + power * maxD;
      shoe = { x: startX, y: gy - H * 0.12, t: 0, dur: 0.9, x0: startX, x1: target, rot: 0 };
      Snd.play('jump');
    };
    c.addEventListener('pointerdown', press);
    function drawShoe(x, y, rot, sz) {
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
      ctx.strokeStyle = '#8D99A6'; ctx.lineWidth = sz * 0.28; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, sz * 0.5, Math.PI * 0.95, Math.PI * 2.05, true); ctx.stroke();
      ctx.fillStyle = '#4A5560'; [[-0.42, 0.1], [0.42, 0.1], [-0.3, -0.35], [0.3, -0.35]].forEach(([a, b]) => { ctx.beginPath(); ctx.arc(a * sz, -b * sz, sz * 0.05, 0, 7); ctx.fill(); });
      ctx.restore();
    }
    loop(dt => {
      t += dt;
      if (state === 'aim') { power += dir * dt * meterSpeed; if (power > 1) { power = 1; dir = -1; } if (power < 0) { power = 0; dir = 1; } }
      if (state === 'fly') {
        shoe.t += dt / shoe.dur;
        const k = Math.min(1, shoe.t);
        shoe.x = shoe.x0 + (shoe.x1 - shoe.x0) * k;
        shoe.y = gy - H * 0.12 - Math.sin(k * Math.PI) * H * 0.3 + k * H * 0.12;
        shoe.rot += dt * 9;
        if (k >= 1) {
          const d = Math.abs(shoe.x1 - pegX);
          let pts = 0;
          if (d < W * 0.025) { pts = 3; msg = '🎯 Volltreffer! +3'; Snd.play('win'); }
          else if (d < W * 0.07) { pts = 1; msg = 'Knapp dran! +1'; Snd.play('coin'); }
          else { msg = shoe.x1 < pegX ? 'Zu kurz!' : 'Zu weit!'; Snd.play('nope'); }
          score += pts; msgT = 1.3; state = 'wait'; shoe.rot = 0;
          hud('🎯 ' + score, 'Wurf ' + Math.min(10, throws + 1) + '/10');
        }
      }
      if (state === 'wait') {
        msgT -= dt;
        if (msgT <= 0) {
          if (throws >= 10) { state = 'end'; cur.paused = true; finish('werfen', score, score, `${score} Punkte mit 10 Würfen`); return; }
          state = 'aim'; shoe = null; newPeg(); meterSpeed = 1.1 + throws * 0.08; power = 0; dir = 1;
        }
      }
      sky(ctx, W, H, t, '#8FD3FF', '#E9F8FF');
      cloud(ctx, W * 0.3, H * 0.1, 0.9); cloud(ctx, W * 0.8, H * 0.16, 0.7);
      ctx.fillStyle = '#8FD07A'; ctx.beginPath(); ctx.moveTo(0, gy - H * 0.08); ctx.quadraticCurveTo(W / 2, gy - H * 0.16, W, gy - H * 0.06); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = '#62B552'; ctx.fillRect(0, gy, W, H - gy);
      ctx.fillStyle = '#E3C08A'; ctx.beginPath(); ctx.ellipse(pegX, gy + 4, W * 0.08, 10, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#8B5A2B'; ctx.fillRect(pegX - 4, gy - H * 0.07, 8, H * 0.07 + 4);
      ctx.fillStyle = '#E5484D'; ctx.fillRect(pegX - 4, gy - H * 0.07, 8, 6);
      drawHorse(ctx, horse, startX - hw * 0.35, gy + H * 0.12, hw);
      if (shoe) drawShoe(shoe.x, shoe.y, shoe.rot, Math.max(26, W * 0.07));
      else if (state === 'aim') drawShoe(startX + W * 0.05, gy - H * 0.12, Math.sin(t * 3) * 0.2, Math.max(26, W * 0.07));
      // Kraftanzeige
      const mx = W * 0.08, mw = W * 0.84, my = H - 60;
      ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(mx - 6, my - 6, mw + 12, 36, 18) : ctx.rect(mx - 6, my - 6, mw + 12, 36); ctx.fill();
      const grd = ctx.createLinearGradient(mx, 0, mx + mw, 0); grd.addColorStop(0, '#6BCB77'); grd.addColorStop(0.6, '#FFD93D'); grd.addColorStop(1, '#FF6B6B');
      ctx.fillStyle = grd; ctx.fillRect(mx, my, mw * power, 24);
      const pegP = (pegX - startX) / maxD;
      ctx.fillStyle = '#3A2D4A'; ctx.fillRect(mx + mw * pegP - 2, my - 8, 4, 40);
      ctx.font = '800 13px ui-rounded,system-ui'; ctx.textAlign = 'center'; ctx.fillStyle = '#3A2D4A'; ctx.fillText('Kraft – tippen zum Werfen!', W / 2, my - 14);
      if (msgT > 0) { ctx.font = `900 ${Math.round(W * 0.075)}px ui-rounded,system-ui`; ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 5; ctx.strokeText(msg, W / 2, H * 0.32); ctx.fillText(msg, W / 2, H * 0.32); }
    });
    return { stop() { c.removeEventListener('pointerdown', press); } };
  }

  // ---------- 7. Futter merken (Simon) ----------
  function Simon() {
    const a = area();
    a.style.background = 'linear-gradient(180deg,#FFE3F1,#E3F0FF)';
    const pads = [{ ch: '🥕', c: '#FF9F43', f: 392 }, { ch: '🍎', c: '#FF6B6B', f: 494 }, { ch: '🌾', c: '#FFD43B', f: 587 }, { ch: '💧', c: '#4DABF7', f: 659 }];
    const size = Math.min(a.clientWidth * 0.42, (a.clientHeight - 140) * 0.42, 190);
    a.innerHTML = `<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px"><div id="smsg" style="font-weight:900;font-size:22px;color:#3A2D4A;height:30px">Schau genau hin…</div><div style="display:grid;grid-template-columns:repeat(2,${size}px);gap:14px">${pads.map((p, i) => `<button data-p="${i}" style="height:${size}px;border-radius:30px;background:${p.c};font-size:${size * 0.45}px;box-shadow:0 6px 0 ${shade(p.c, -0.25)};opacity:.55;transition:opacity .1s,transform .1s;touch-action:none">${p.ch}</button>`).join('')}</div></div>`;
    const btns = $$('[data-p]', a);
    let seq = [], inp = 0, accept = false, best = 0, timers = [];
    const later = (fn, ms) => timers.push(setTimeout(fn, ms));
    const light = (i, ms = 380) => {
      const b = btns[i]; b.style.opacity = '1'; b.style.transform = 'scale(1.06)';
      Snd.tone(pads[i].f, ms / 1000, 'triangle', 0.14);
      later(() => { b.style.opacity = '.55'; b.style.transform = 'none'; }, ms);
    };
    function next() {
      seq.push(Math.floor(Math.random() * 4)); inp = 0; accept = false;
      $('#smsg').textContent = 'Schau genau hin… 👀';
      hud('🧠 ' + best, 'Länge ' + seq.length);
      const gap = Math.max(330, 650 - seq.length * 25);
      seq.forEach((p, k) => later(() => light(p, gap * 0.65), 700 + k * gap));
      later(() => { accept = true; $('#smsg').textContent = 'Jetzt du! 👆'; }, 700 + seq.length * gap);
    }
    a.onpointerdown = e => {
      const b = e.target.closest('[data-p]'); if (!b || !accept || cur.paused) return;
      e.preventDefault();
      const i = +b.dataset.p; light(i, 220);
      if (i !== seq[inp]) {
        accept = false; Snd.play('hurt'); $('#smsg').textContent = 'Oh nein, falsch! 😮';
        later(() => finish('simon', best, Math.round(best * 1.5), `Du hast dir ${best} Futter in Folge gemerkt`), 900);
        return;
      }
      inp++;
      if (inp === seq.length) { accept = false; best = seq.length; $('#smsg').textContent = 'Richtig! 🎉'; Snd.play('coin'); hud('🧠 ' + best, 'Länge ' + seq.length); later(next, 900); }
    };
    later(next, 300);
    return { stop() { timers.forEach(clearTimeout); a.onpointerdown = null; } };
  }

  // ---------- 8. Pferde-Quiz ----------
  const QUIZ = [
    ['Wie heißt ein junges Pferd?', ['Fohlen', 'Kalb', 'Lamm', 'Welpe']],
    ['Wie nennt man ein weibliches Pferd?', ['Stute', 'Hengst', 'Wallach', 'Bulle']],
    ['Wie heißt ein männliches Pferd, das Fohlen zeugen kann?', ['Hengst', 'Stute', 'Wallach', 'Fohlen']],
    ['Wie nennt man ein kastriertes männliches Pferd?', ['Wallach', 'Hengst', 'Stute', 'Pony']],
    ['Welche Gangart ist schneller als Schritt, aber langsamer als Galopp?', ['Trab', 'Tölt', 'Sprung', 'Passage']],
    ['Welche Pferderasse kann oft auch tölten?', ['Islandpferd', 'Friese', 'Haflinger', 'Shetlandpony']],
    ['Was ist das wichtigste Futter für Pferde?', ['Heu und Gras', 'Fleisch', 'Brot', 'Schokolade']],
    ['Was dürfen Pferde auf keinen Fall fressen?', ['Schokolade', 'Karotten', 'Äpfel', 'Heu']],
    ['Wer macht Pferden neue Hufeisen?', ['Der Hufschmied', 'Der Bäcker', 'Der Tierarzt', 'Der Sattler']],
    ['Wie heißt ein weißes oder graues Pferd?', ['Schimmel', 'Rappe', 'Fuchs', 'Falbe']],
    ['Wie heißt ein schwarzes Pferd?', ['Rappe', 'Schimmel', 'Fuchs', 'Brauner']],
    ['Was ist ein „Fuchs“ bei Pferden?', ['Ein rotbraunes Pferd', 'Ein sehr schlaues Pferd', 'Ein Pferd mit Flecken', 'Ein kleines Pony']],
    ['Wie heißt ein Pferd mit vielen kleinen Punkten wie ein Leopard?', ['Tigerschecke', 'Apfelschimmel', 'Rappe', 'Palomino']],
    ['Welche Farbe haben Friesen?', ['Schwarz', 'Weiß', 'Gold', 'Gefleckt']],
    ['Woher kommen Haflinger ursprünglich?', ['Aus Südtirol', 'Aus Island', 'Aus Spanien', 'Aus Amerika']],
    ['Bis zu welcher Größe (Stockmaß) nennt man ein Pferd meist Pony?', ['148 cm', '100 cm', '170 cm', '200 cm']],
    ['Wo wird die Größe eines Pferdes gemessen?', ['Am Widerrist', 'An den Ohren', 'Am Schweif', 'Am Bauch']],
    ['Wie heißen die Haare auf der Stirn des Pferdes?', ['Schopf', 'Pony', 'Bart', 'Locke']],
    ['Wie alt können Pferde ungefähr werden?', ['25 bis 30 Jahre', '5 Jahre', '10 Jahre', '80 Jahre']],
    ['Wie lange ist eine Stute ungefähr trächtig?', ['11 Monate', '3 Monate', '6 Monate', '2 Jahre']],
    ['Wie viele Stunden schlafen Pferde ungefähr pro Tag?', ['Etwa 3 Stunden', 'Etwa 8 Stunden', 'Etwa 14 Stunden', 'Gar nicht']],
    ['Können Pferde im Stehen dösen?', ['Ja', 'Nein', 'Nur Fohlen', 'Nur im Winter']],
    ['Können Pferde sich erbrechen?', ['Nein, praktisch nie', 'Ja, ganz oft', 'Nur nach Karotten', 'Nur Ponys']],
    ['Was zeigt ein Pferd meistens mit angelegten Ohren?', ['Ärger oder Unwohlsein', 'Freude', 'Müdigkeit', 'Hunger']],
    ['Warum sehen Pferde fast rundherum?', ['Ihre Augen sitzen seitlich am Kopf', 'Sie haben vier Augen', 'Sie drehen den Kopf ganz herum', 'Sie sehen mit den Ohren']],
    ['Wie viele Zähne hat ein erwachsener Hengst etwa?', ['40 bis 44', '12', '28', '100']],
    ['Wie viel Wasser trinkt ein Pferd an einem Tag etwa?', ['30 bis 50 Liter', '1 Liter', '5 Liter', '300 Liter']],
    ['Was ist ein Kaltblut?', ['Ein schweres, ruhiges Arbeitspferd', 'Ein Pferd, das immer friert', 'Ein Pferd aus dem Eis', 'Ein Rennpferd']],
    ['Womit macht man die Hufe sauber?', ['Mit dem Hufkratzer', 'Mit dem Kamm', 'Mit dem Löffel', 'Mit der Zahnbürste']],
    ['Was ist eine Schabracke?', ['Eine Decke unter dem Sattel', 'Ein Pferdefutter', 'Ein Hindernis', 'Ein Pferdestall']],
    ['Was ist eine Trense?', ['Ein Zaumzeug für den Kopf', 'Ein Sattel', 'Ein Hufeisen', 'Eine Pferdebürste']],
    ['Wie nennt man das Geräusch, das ein Pferd macht?', ['Wiehern', 'Muhen', 'Blöken', 'Gackern']],
    ['Wie nennt man eine Gruppe von Pferden?', ['Herde', 'Rudel', 'Schwarm', 'Schule']],
    ['Welches Tier ist mit dem Pferd verwandt?', ['Zebra', 'Kuh', 'Hirsch', 'Kamel']],
    ['Wie heißt das Wildpferd aus der Mongolei?', ['Przewalski-Pferd', 'Mustang', 'Pinto', 'Brumby']],
    ['Wie heißt die Schachfigur, die wie ein Pferd aussieht?', ['Springer', 'Turm', 'Läufer', 'Dame']],
    ['Wie heißt der Reitsport mit genauen Figuren und Lektionen?', ['Dressur', 'Springreiten', 'Polo', 'Rodeo']],
    ['Was frisst ein Pferd am Tag ungefähr an Heu (bei 500 kg)?', ['7 bis 10 kg', '100 g', '1 kg', '50 kg']],
    ['Womit putzt man zuerst den groben Schmutz aus dem Fell?', ['Mit dem Striegel', 'Mit dem Hufkratzer', 'Mit einem Handtuch', 'Mit Wasser und Seife']],
    ['Was bedeutet es, wenn ein Pferd die Oberlippe hochzieht (Flehmen)?', ['Es riecht etwas genauer', 'Es lacht', 'Es ist müde', 'Es hat Zahnweh']],
  ];
  function Quiz() {
    const a = area();
    a.style.background = 'linear-gradient(180deg,#FFF4D6,#FFE3F1)';
    const qs = shuffle(QUIZ.slice()).slice(0, 10);
    let i = 0, right = 0, lock = false;
    function show() {
      const [q, ans] = qs[i];
      const opts = shuffle(ans.map((t, k) => ({ t, ok: k === 0 })));
      a.innerHTML = `<div style="position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;gap:12px;justify-content:center;max-width:520px;margin:0 auto"><div style="font-weight:800;color:var(--ink2);text-align:center">Frage ${i + 1} von 10</div><div style="background:#fff;border-radius:24px;padding:20px 16px;font-size:21px;font-weight:900;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08)">${q}</div>${opts.map((o, k) => `<button class="btn" data-ok="${o.ok ? 1 : 0}" style="font-size:17px;text-align:left;padding:14px 16px"><b style="display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#FFE27A;margin-right:8px">${'ABCD'[k]}</b>${o.t}</button>`).join('')}</div>`;
      hud('✅ ' + right, (i + 1) + '/10');
      lock = false;
    }
    a.onclick = e => {
      const b = e.target.closest('[data-ok]'); if (!b || lock) return;
      lock = true;
      const ok = b.dataset.ok === '1';
      if (ok) { right++; Snd.play('coin'); b.style.background = '#B7F0C8'; }
      else { Snd.play('nope'); b.style.background = '#FFC2C8'; $$('[data-ok="1"]', a).forEach(x => x.style.background = '#B7F0C8'); }
      hud('✅ ' + right, (i + 1) + '/10');
      setTimeout(() => { i++; if (i >= 10) finish('quiz', right, right * 2, `${right} von 10 Fragen richtig`); else show(); }, ok ? 800 : 1700);
    };
    show();
    return { stop() { a.onclick = null; } };
  }

  return { open, close, requestClose };
})();
